<script>

const state={
races:[],
horses:[],
race:null
};

const $=id=>document.getElementById(id);


function clean(v){
return String(v??"")
.replace(/<[^>]*>/g," ")
.replace(/!\[[^\]]*\]\([^)]*\)/g,"")
.replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
.replace(/&nbsp;/g," ")
.replace(/\u00a0/g," ")
.replace(/\s+/g," ")
.trim();
}


function escapeHtml(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}


async function jinaFetch(url){

const readerUrl="https://r.jina.ai/"+url;

const response=await fetch(readerUrl);

if(!response.ok){
throw new Error("Jina HTTP "+response.status);
}

return await response.text();
}


/* =========================
   開催レース取得
========================= */

async function fetchMeeting(){

const date=$("raceDate").value.replace(/-/g,"");

if(!date){
setStatus("開催日を入力してください");
return;
}

try{

setStatus("開催レースを取得中...");

const url=
"https://race.netkeiba.com/top/race_list.html?kaisai_date="+date;

const text=await jinaFetch(url);

const ids=[
...text.matchAll(/race_id=(\d{12})/g)
].map(m=>m[1]);

const unique=[...new Set(ids)];

state.races=unique;

if(!unique.length){
throw new Error("レースIDを取得できませんでした");
}

const selectedCourse=$("course").value;
const selectedRace=$("raceNo").value;

const filtered=unique.filter(id=>{
return id.slice(4,6)===selectedCourse &&
id.slice(10,12)===selectedRace;
});

const list=filtered.length?filtered:unique;

$("raceSelect").innerHTML=list.map(id=>{
return `<option value="${id}">${id}</option>`;
}).join("");

setStatus(
"開催レース取得成功\n"+
unique.length+"件のレースIDを取得"
);

}catch(e){

console.error(e);

setStatus("取得失敗: "+e.message);

}
}


/* =========================
   レース取得
========================= */

async function fetchRace(){

const raceId=$("raceSelect").value;

if(!raceId){
setStatus("レースを選択してください");
return;
}

try{

setStatus("出走表を取得中...");

const url=
"https://race.netkeiba.com/race/shutuba.html?race_id="+raceId;

const text=await jinaFetch(url);

const horses=parseRacePage(text);

if(!horses.length){
throw new Error("出走馬を取得できませんでした");
}

state.horses=horses;

state.race={
id:raceId,
text
};

renderHorses();

$("analyzeBtn").disabled=false;

setStatus(
"出走表取得成功\n"+
horses.length+"頭取得"
);

}catch(e){

console.error(e);

setStatus("取得失敗: "+e.message);

}
}


/* =========================
   出走表解析
========================= */

function parseRacePage(text){

const lines=text.split(/\r?\n/);

const result=[];

for(const line of lines){

if(!line.includes("|")) continue;

const cells=line
.split("|")
.map(x=>clean(x));

if(cells.length<8) continue;

const frame=Number(cells[1]);
const number=Number(cells[2]);

if(
!Number.isInteger(frame) ||
frame<1 ||
frame>8
) continue;

if(
!Number.isInteger(number) ||
number<1 ||
number>18
) continue;

const titleMatch=line.match(
/db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
);

if(!titleMatch) continue;

const horseName=clean(titleMatch[1]);

const odds=Number(
clean(cells[10]||"")
);

const popularity=Number(
clean(cells[11]||"")
);

const horseUrlMatch=line.match(
/https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

const horseUrl=
horseUrlMatch?horseUrlMatch[0]:"";

result.push({

frame,
number,
name:horseName,

odds:Number.isFinite(odds)?odds:0,

popularity:
Number.isFinite(popularity)
?popularity
:0,

horseUrl,

style:"未解析",

pastRaces:[],

confidence:0,

scores:{
escape:0,
front:0,
stalker:0,
closer:0
}

});

}

const unique=[];
const used=new Set();

for(const h of result){

const key=h.number+"|"+h.name;

if(used.has(key)) continue;

used.add(key);

unique.push(h);

}

return unique;

}


/* =========================
   ヘッダー正規化
========================= */

function normalizeHeader(v){

return clean(v)
.replace(/\s+/g,"")
.replace(/ｵ/g,"オ")
.replace(/ｰ/g,"ー")
.replace(/ﾄ/g,"ト")
.replace(/ﾋﾞ/g,"ビ")
.replace(/ｽ/g,"ス")
.replace(/順/g,"順");

}


/* =========================
   競走成績ヘッダー
========================= */

function findHeaderRow(lines){

for(let i=0;i<lines.length;i++){

const line=lines[i];

if(!line.includes("|")) continue;

const cells=line
.split("|")
.map(x=>normalizeHeader(x));

const joined=cells.join("|");

if(
joined.includes("日付") &&
joined.includes("着順") &&
joined.includes("距離") &&
joined.includes("通過")
){

return{
index:i,
cells
};

}

}

return null;

}


/* =========================
   列番号
========================= */

function getColumnIndexes(header){

const find=(names)=>{

for(let i=0;i<header.length;i++){

const value=normalizeHeader(header[i]);

if(names.some(n=>value===n)){
return i;
}

}

return -1;

};

return{

date:find(["日付"]),

finish:find(["着順"]),

distance:find(["距離"]),

position:find(["通過"]),

course:find(["開催"]),

going:find(["馬場"]),

raceName:find(["レース名"])

};

}


/* =========================
   着順
========================= */

function parseFinish(value){

const v=clean(value);

if(!v) return null;

if(
v==="中止" ||
v==="除外" ||
v==="取消" ||
v==="失格"
){
return null;
}

const match=v.match(
/^(\d{1,2})(?:着)?$/
);

if(!match) return null;

const n=Number(match[1]);

if(n<1 || n>18) return null;

return n;

}


/* =========================
   距離
========================= */

function parseDistance(value){

const v=clean(value);

const match=v.match(
/(?:芝|ダ|障|ダート|芝外|芝内)?\s*(\d{3,4})/
);

if(!match) return null;

const n=Number(match[1]);

if(n<800 || n>5000) return null;

return n;

}


/* =========================
   日付
========================= */

function parseRaceDate(value){

const v=clean(value);

const m=v.match(
/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/
);

if(!m) return "";

return `${m[1]}/${String(m[2]).padStart(2,"0")}/${String(m[3]).padStart(2,"0")}`;

}


/* =========================
   通過
========================= */

function parsePosition(value){

const v=clean(value);

if(!v) return "";

if(!/^\d+(?:-\d+)*$/.test(v)){
return "";
}

const nums=v.split("-").map(Number);

if(!nums.length) return "";

if(nums.some(n=>n<1 || n>30)){
return "";
}

return nums.join("-");

}


/* =========================
   競馬場
========================= */

function parseCourse(value){

const v=clean(value);

if(!v) return "";

const courses=[
"札幌",
"函館",
"福島",
"新潟",
"東京",
"中山",
"中京",
"京都",
"阪神",
"小倉"
];

for(const course of courses){

if(v.includes(course)){
return course;
}

}

/*
 地方競馬等の場合は
 そのまま開催欄を返す
*/

return v;

}


/* =========================
   芝・ダート判定
========================= */

function parseSurface(value){

const v=clean(value);

if(!v) return "";

if(
v.includes("ダ") ||
v.includes("ダート")
){
return "ダート";
}

if(v.includes("芝")){
return "芝";
}

if(v.includes("障")){
return "障害";
}

return "";

}


/* =========================
   馬場状態
========================= */

function parseGoing(value){

const v=clean(value);

if(!v) return "";

if(v.includes("不良")){
return "不良";
}

if(v.includes("重")){
return "重";
}

if(v.includes("稍")){
return "稍重";
}

if(v.includes("良")){
return "良";
}

return v;

}


/* =========================
   距離欄から芝・ダートも取得
========================= */

function parseDistanceInfo(value){

const v=clean(value);

let surface="";

if(v.includes("ダート") || v.includes("ダ")){
surface="ダート";
}else if(v.includes("芝")){
surface="芝";
}else if(v.includes("障")){
surface="障害";
}

const distance=parseDistance(v);

return{
surface,
distance
};

}


/* =========================
   過去走解析
========================= */

function parsePastRaces(text){

const lines=text.split(/\r?\n/);

const headerInfo=findHeaderRow(lines);

if(!headerInfo){

console.warn(
"競走成績ヘッダーが見つかりません"
);

return [];

}

const columns=getColumnIndexes(
headerInfo.cells
);

console.log(
"netkeiba columns",
columns
);

if(
columns.date<0 ||
columns.finish<0 ||
columns.distance<0 ||
columns.position<0
){

console.warn(
"必要な列が見つかりません",
columns
);

return [];

}

const races=[];

for(
let i=headerInfo.index+1;
i<lines.length;
i++
){

const line=lines[i];

if(!line.includes("|")) continue;

const rawCells=line
.split("|")
.map(x=>clean(x));

const maxColumn=Math.max(
columns.date,
columns.finish,
columns.distance,
columns.position,
columns.course,
columns.going
);

if(rawCells.length<=maxColumn){
continue;
}


/*
 日付
*/

const date=parseRaceDate(
rawCells[columns.date]
);

if(!date) continue;


/*
 着順
*/

const finish=parseFinish(
rawCells[columns.finish]
);


/*
 距離
*/

const distanceInfo=
parseDistanceInfo(
rawCells[columns.distance]
);

const distance=
distanceInfo.distance;


/*
 通過
*/

const position=parsePosition(
rawCells[columns.position]
);


/*
 競馬場
*/

let course="";

if(columns.course>=0){

course=parseCourse(
rawCells[columns.course]
);

}


/*
 馬場
*/

let going="";

if(columns.going>=0){

going=parseGoing(
rawCells[columns.going]
);

}


/*
 芝・ダート

 基本は距離欄から判定。
 もし距離欄に入っていない場合は
 開催・レース名等から追加判定する。
*/

let surface=
distanceInfo.surface;


/*
 馬場欄に芝/ダートが混ざっている場合
*/

if(!surface && columns.going>=0){

const s=parseSurface(
rawCells[columns.going]
);

if(s) surface=s;

}


/*
 レース名等からの最終補完
*/

if(!surface){

for(const cell of rawCells){

const s=parseSurface(cell);

if(s){

surface=s;
break;

}

}

}


races.push({

date,

finish,

position,

distance,

course,

surface,

going

});

}


/*
 重複削除
*/

const unique=[];

const used=new Set();

for(const race of races){

const key=[
race.date,
race.finish,
race.position,
race.distance,
race.course,
race.surface,
race.going
].join("|");

if(used.has(key)) continue;

used.add(key);

unique.push(race);

}


/*
 新しい順10走
*/

return unique.slice(0,10);

}


/* =========================
   1レース脚質判定
========================= */

function judgeSingleRace(position){

if(!position){

return{
style:"不明",
score:0
};

}

const nums=position
.split("-")
.map(Number)
.filter(Number.isFinite);

if(!nums.length){

return{
style:"不明",
score:0
};

}

const first=nums[0];

if(first===1){

return{
style:"逃げ",
score:4
};

}

if(first<=3){

return{
style:"先行",
score:3
};

}

if(first<=6){

return{
style:"差し",
score:2
};

}

return{
style:"追込",
score:1
};

}


/* =========================
   総合脚質
========================= */

function judgeRunningStyle(races){

if(!races.length){

return{
style:"不明",
confidence:0,
scores:{
escape:0,
front:0,
stalker:0,
closer:0
}
};

}

const scores={
escape:0,
front:0,
stalker:0,
closer:0
};

const weights=[
1.00,
0.90,
0.80,
0.70,
0.60,
0.50,
0.45,
0.40,
0.35,
0.30
];

const scoreKey={
"逃げ":"escape",
"先行":"front",
"差し":"stalker",
"追込":"closer"
};

const styles=[];

races.forEach((race,index)=>{

const judged=
judgeSingleRace(
race.position
);

race.style=judged.style;

if(scoreKey[judged.style]){

scores[
scoreKey[judged.style]
]+=weights[index]||0.25;

}

if(judged.style!=="不明"){

styles.push(judged.style);

}

});


let bestStyle="不明";
let bestScore=-1;
let secondScore=-1;

Object.entries(scores).forEach(
([key,value])=>{

if(value>bestScore){

secondScore=bestScore;
bestScore=value;
bestStyle=key;

}else if(value>secondScore){

secondScore=value;

}

});


const styleMap={
escape:"逃げ",
front:"先行",
stalker:"差し",
closer:"追込"
};

const total=
Object.values(scores)
.reduce((a,b)=>a+b,0);

const dominance=
total>0
?bestScore/total
:0;

const separation=
bestScore>0
?Math.max(
0,
(bestScore-secondScore)/bestScore
)
:0;

const recent=races
.slice(0,3)
.map(r=>r.style)
.filter(Boolean)
.filter(s=>s!=="不明");

let consistency=0;

if(recent.length){

consistency=
recent.filter(
s=>s===styleMap[bestStyle]
).length/recent.length;

}

let confidence=
dominance*0.5+
separation*0.25+
consistency*0.25;

if(races.length===1){

confidence=Math.min(
confidence,
0.35
);

}else if(races.length===2){

confidence=Math.min(
confidence,
0.50
);

}else if(races.length===3){

confidence=Math.min(
confidence,
0.65
);

}

confidence=Math.round(
confidence*100
);

return{

style:
styleMap[bestStyle]||"不明",

confidence,

scores

};

}


/* =========================
   全頭解析
========================= */

async function analyzeAllHorses(){

if(!state.horses.length) return;

$("analyzeBtn").disabled=true;

let success=0;

for(
let i=0;
i<state.horses.length;
i++
){

const horse=state.horses[i];

setStatus(
`過去走解析中...\n${i+1}/${state.horses.length}\n${horse.name}`
);

try{

if(!horse.horseUrl){

horse.pastRaces=[];

continue;

}

const idMatch=
horse.horseUrl.match(
/\/horse\/(\d+)\/?/
);

if(!idMatch){

horse.pastRaces=[];

continue;

}

const horseId=idMatch[1];

const urls=[
`https://db.netkeiba.com/horse/result/${horseId}/`,
horse.horseUrl
];

let text="";
let races=[];

for(const url of urls){

try{

text=await jinaFetch(url);

races=parsePastRaces(text);

if(races.length){
break;
}

}catch(err){

console.warn(
"過去走取得失敗",
url,
err
);

}

await sleep(500);

}

horse.pastRaces=races;

const judged=
judgeRunningStyle(races);

horse.style=judged.style;

horse.confidence=
judged.confidence;

horse.scores=
judged.scores;

if(races.length){
success++;
}

renderHorses();

await sleep(300);

}catch(e){

console.error(
horse.name,
e
);

horse.pastRaces=[];
horse.style="不明";
horse.confidence=0;

}

}

$("analyzeBtn").disabled=false;

renderHorses();

renderFormation();

renderEV();

setStatus(
`過去走解析完了\n${success}/${state.horses.length}頭解析`
);

}

/* =========================
   隊列
========================= */

function renderFormation(){

const groups={
"逃げ":[],
"先行":[],
"差し":[],
"追込":[],
"不明":[]
};

state.horses.forEach(h=>{

if(groups[h.style]){
groups[h.style].push(h);
}else{
groups["不明"].push(h);
}

});

let html="";

Object.entries(groups).forEach(
([style,horses])=>{

if(!horses.length) return;

html+=`

<div class="evbox">

<strong>
${style}
</strong>

<div class="meta">

${horses.map(h=>
`${h.number} ${escapeHtml(h.name)}`
).join(" / ")}

</div>

</div>

`;

});

$("formationResult").innerHTML=
html||
"まだ解析されていません。";

}


/* =========================
   期待値
========================= */

function renderEV(){

if(!state.horses.length){

$("evResult").innerHTML=
"出走馬がありません。";

return;

}

const rows=
state.horses.map(h=>{

const odds=Number(h.odds);

const implied=
odds>0
?(1/odds)*100
:0;

return`

<div class="evbox">

<strong>
${h.number} ${escapeHtml(h.name)}
</strong>

<div class="meta">

脚質:
${escapeHtml(h.style)}

　
オッズ:
${odds||"-"}

　
市場想定:
${implied
?implied.toFixed(1)+"%"
:"-"}

</div>

</div>

`;

}).join("");

$("evResult").innerHTML=rows;

}
