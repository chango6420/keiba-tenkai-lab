<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>競馬展開ラボ v0.5.3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#17202a;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Hiragino Kaku Gothic ProN",
  "Yu Gothic",Meiryo,sans-serif;
}

header{
  background:#111827;
  color:#fff;
  padding:16px;
}

.title{
  font-size:22px;
  font-weight:800;
}

.badge{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:20px;
  background:#374151;
  font-size:11px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

h2{
  margin:0 0 12px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
}

input,
button{
  width:100%;
  min-height:44px;
  border-radius:9px;
  font-size:16px;
}

input{
  border:1px solid #d1d5db;
  padding:8px;
}

button{
  border:0;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#eef2ff;
  white-space:pre-wrap;
  font-size:13px;
}

.ok{
  background:#ecfdf5;
  color:#065f46;
}

.error{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  display:none;
  margin-top:10px;
  text-align:center;
  font-weight:bold;
}

.races{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.race{
  background:#f3f4f6;
  color:#111827;
  border:1px solid #d1d5db;
  min-height:55px;
}

.race.selected{
  background:#2563eb;
  color:#fff;
}

.small{
  margin-top:10px;
  font-size:11px;
  color:#64748b;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#111827;
  color:#d1d5db;
  padding:12px;
  border-radius:10px;
  max-height:400px;
  overflow:auto;
  font-size:10px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .races{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="title">競馬展開ラボ</div>
  <div class="badge">v0.5.3 NETKEIBA TEST</div>
</header>

<div class="container">

  <div class="card">

    <h2>① 日付を選択</h2>

    <div class="grid">

      <div>
        <label>開催日</label>
        <input
          type="date"
          id="raceDate"
        >
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="fetchButton">
          開催情報を取得
        </button>
      </div>

    </div>

    <div
      id="status"
      class="status"
    >
      日付を選択して
      「開催情報を取得」を押してください。
    </div>

    <div
      id="loading"
      class="loading"
    >
      ⏳ 取得中……
    </div>

  </div>


  <div
    id="raceCard"
    class="card"
    style="display:none;"
  >

    <h2>② レースを選択</h2>

    <div
      id="races"
      class="races"
    ></div>

    <div class="small">
      ※ 現在は取得テスト段階です。
    </div>

  </div>


  <div
    id="debugCard"
    class="card"
    style="display:none;"
  >

    <h2>取得結果</h2>

    <pre id="debug"></pre>

  </div>

</div>


<script>

console.log("競馬展開ラボ v0.5.3 起動");


/* =========================
   Jina
========================= */

function jina(url){

  return "https://r.jina.ai/" + url;

}


async function getPage(url){

  console.log("取得開始:",url);

  const response =
    await fetch(
      jina(url),
      {
        method:"GET",
        cache:"no-store"
      }
    );

  console.log(
    "HTTP:",
    response.status
  );

  if(!response.ok){

    throw new Error(
      "Jina HTTP " +
      response.status
    );

  }

  return await response.text();

}


/* =========================
   レース一覧URL
========================= */

function getRaceListURL(date){

  const d =
    date.replaceAll("-","");

  return (
    "https://race.netkeiba.com/" +
    "top/race_list.html" +
    "?kaisai_date=" +
    d
  );

}


/* =========================
   race_id抽出
========================= */

function getRaceIds(text){

  const result = [];

  const regex =
    /race_id=(\d{12})/g;

  let match;

  while(
    (match = regex.exec(text)) !== null
  ){

    if(
      !result.includes(match[1])
    ){

      result.push(match[1]);

    }

  }

  return result;

}


/* =========================
   ページ読み込み後
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    console.log(
      "DOMContentLoaded"
    );

    const date =
      document.getElementById(
        "raceDate"
      );

    const button =
      document.getElementById(
        "fetchButton"
      );


    /* 今日の日付 */

    const now =
      new Date();

    const y =
      now.getFullYear();

    const m =
      String(
        now.getMonth()+1
      ).padStart(2,"0");

    const d =
      String(
        now.getDate()
      ).padStart(2,"0");

    date.value =
      y + "-" + m + "-" + d;


    /* ボタン */

    button.addEventListener(
      "click",
      fetchRaces
    );

  }
);


/* =========================
   開催情報取得
========================= */

async function fetchRaces(){

  const date =
    document.getElementById(
      "raceDate"
    ).value;

  const status =
    document.getElementById(
      "status"
    );

  const loading =
    document.getElementById(
      "loading"
    );

  const raceCard =
    document.getElementById(
      "raceCard"
    );

  const races =
    document.getElementById(
      "races"
    );


  console.log(
    "ボタン押下",
    date
  );


  if(!date){

    status.className =
      "status error";

    status.textContent =
      "日付を選択してください。";

    return;

  }


  status.className =
    "status";

  status.textContent =
    "開催情報を取得しています……";

  loading.style.display =
    "block";

  raceCard.style.display =
    "none";

  races.innerHTML =
    "";


  try{

    const url =
      getRaceListURL(date);

    console.log(
      "Race List URL:",
      url
    );


    const text =
      await getPage(url);


    console.log(
      "取得文字数:",
      text.length
    );


    const ids =
      getRaceIds(text);


    console.log(
      "取得race_id:",
      ids
    );


    if(!ids.length){

      throw new Error(
        "race_idが見つかりませんでした。"
      );

    }


    /*
      race_idは12桁。

      同じレースが複数箇所に
      登場するので重複を除去。
    */

    const unique =
      [...new Set(ids)];


    /*
      最大36件程度になる可能性があるため、
      まず12件まで表示。
    */

    unique
      .slice(0,12)
      .forEach(
        function(id,index){

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "race";

          button.textContent =
            (index+1) + "R";

          button.addEventListener(
            "click",
            function(){

              document
                .querySelectorAll(
                  ".race"
                )
                .forEach(
                  function(b){
                    b.classList.remove(
                      "selected"
                    );
                  }
                );

              button.classList.add(
                "selected"
              );

              alert(
                "race_id: " + id +
                "\n\n次の段階で、このレースの出馬表を取得します。"
              );

            }
          );

          races.appendChild(
            button
          );

        }
      );


    status.className =
      "status ok";

    status.textContent =
      "開催情報の取得に成功しました。\n" +
      "認識したレース：" +
      unique.length +
      "件";


    raceCard.style.display =
      "block";


    document.getElementById(
      "debugCard"
    ).style.display =
      "block";


    document.getElementById(
      "debug"
    ).textContent =
      "取得成功\n\n" +
      "URL:\n" +
      url +
      "\n\nrace_id:\n" +
      unique.join("\n");


  }catch(error){

    console.error(error);


    status.className =
      "status error";

    status.textContent =
      "取得に失敗しました。\n\n" +
      error.message;


    document.getElementById(
      "debugCard"
    ).style.display =
      "block";


    document.getElementById(
      "debug"
    ).textContent =
      String(error);

  }


  loading.style.display =
    "none";

}

</script>

</body>
</html>
