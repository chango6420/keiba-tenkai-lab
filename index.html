<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.6.1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}

header{
  background:#17212b;
  color:#fff;
  padding:18px 14px
}

header h1{
  margin:0;
  font-size:22px
}

.badge{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:5px;
  background:#2f80ed;
  font-size:12px
}

.container{
  max-width:1000px;
  margin:auto;
  padding:14px
}

.card{
  background:#fff;
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 7px rgba(0,0,0,.08)
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

@media(max-width:650px){
  .formgrid{grid-template-columns:1fr}
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:5px
}

input,select,button{
  font-size:16px;
  padding:10px;
  border:1px solid #ccd2d8;
  border-radius:7px
}

input,select{width:100%}

button{
  background:#1976d2;
  color:#fff;
  border:none;
  font-weight:bold
}

button:active{opacity:.75}

button.secondary{background:#546e7a}
button.green{background:#188038}
button.orange{background:#ef6c00}

.raceButtons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px
}

.raceButtons button{background:#455a64}
.raceButtons button.selected{background:#d84315}

.status{
  padding:10px;
  background:#eef4ff;
  border-radius:7px;
  white-space:pre-wrap;
  line-height:1.5
}

.error{
  background:#fff0f0;
  color:#b00020
}

.success{
  background:#eefaf0;
  color:#176b2c
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:12px
}

.tabs button{
  white-space:nowrap;
  background:#607d8b
}

.tabs button.active{background:#1565c0}

.tab{display:none}
.tab.active{display:block}

.tableWrap{overflow-x:auto}

table{
  border-collapse:collapse;
  width:100%;
  min-width:850px
}

th,td{
  border:1px solid #ddd;
  padding:7px 6px;
  text-align:center;
  white-space:nowrap
}

th{background:#eceff1}

.rank1{
  background:#fff3cd;
  font-weight:bold
}

.small{
  font-size:12px;
  color:#666
}

.horseGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

@media(max-width:700px){
  .horseGrid{grid-template-columns:1fr}
}

.horseCard{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px
}

.horseTitle{
  font-weight:bold;
  margin-bottom:8px
}

.horseInputs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px
}

.scoreBox{
  padding:12px;
  border-radius:8px;
  background:#f1f5f9;
  margin-bottom:8px
}

.mark{
  font-size:22px;
  font-weight:bold
}

.big{
  font-size:18px;
  font-weight:bold
}

.lineup{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  align-items:flex-end;
  min-height:180px;
  padding:15px;
  background:#e8f0e8;
  border-radius:8px
}

.lineHorse{
  background:#fff;
  border:1px solid #aaa;
  border-radius:7px;
  padding:7px;
  text-align:center;
  min-width:55px
}

.debug{
  font-size:11px;
  color:#666;
  word-break:break-all
}
</style>

</div>

<script>

"use strict";


/* =========================
   基本変数
========================= */

let raceIds=[];
let selectedRaceId="";
let horses=[];
let lineupTimer=null;
let lineupSpeed=700;


/* =========================
   今日の日付
========================= */

function setToday(){

const d=new Date();

const yyyy=d.getFullYear();
const mm=String(d.getMonth()+1).padStart(2,"0");
const dd=String(d.getDate()).padStart(2,"0");

document.getElementById("raceDate").value=
yyyy+"-"+mm+"-"+dd;

}


/* =========================
   デバッグ
========================= */

function debug(msg){

const el=document.getElementById("debug");

el.textContent+="\n"+msg;

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(str){

if(str===null||str===undefined){
return "";
}

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   Jina Reader
========================= */

async function jinaFetch(url){

const readerUrl="https://r.jina.ai/"+url;

debug("Jina取得: "+url);

const response=await fetch(readerUrl);

if(!response.ok){

throw new Error(
"Jina HTTP "+response.status
);

}

return await response.text();

}


/* =========================
   開催情報
========================= */

async function getMeeting(){

const dateValue=
document.getElementById("raceDate").value;

const status=
document.getElementById("meetingStatus");

const buttons=
document.getElementById("raceButtons");

buttons.innerHTML="";

if(!dateValue){

status.className="status error";
status.textContent="日付を選択してください。";
return;

}

const date=dateValue.replaceAll("-","");

status.className="status";
status.textContent="開催情報を取得しています...";

try{

const url=
"https://race.netkeiba.com/top/race_list.html?kaisai_date="+date;

const text=await jinaFetch(url);

debug("開催情報取得成功");

const matches=
[...text.matchAll(/race_id=(\d{12})/g)];

raceIds=
[...new Set(matches.map(x=>x[1]))];

if(raceIds.length===0){

throw new Error(
"race_idが見つかりませんでした"
);

}

status.className="status success";

status.textContent=
"開催情報を取得しました。\n"+
raceIds.length+
"件のレースを検出しました。";

renderRaceButtons();

}catch(error){

console.error(error);

status.className="status error";

status.textContent=
"開催情報の取得に失敗しました。\n"+
error.message;

debug("ERROR: "+error.message);

}

}


/* =========================
   レースボタン
========================= */

function renderRaceButtons(){

const area=
document.getElementById("raceButtons");

area.innerHTML="";

raceIds.forEach(function(id){

const btn=document.createElement("button");

const raceNo=
parseInt(id.substring(10,12),10);

btn.textContent=raceNo+"R";

btn.onclick=function(){

selectRace(id,btn);

};

area.appendChild(btn);

});

}


/* =========================
   レース選択
========================= */

async function selectRace(id,button){

selectedRaceId=id;

document
.querySelectorAll("#raceButtons button")
.forEach(function(b){
b.classList.remove("selected");
});

button.classList.add("selected");

const infoCard=
document.getElementById("raceInfoCard");

const status=
document.getElementById("raceFetchStatus");

const info=
document.getElementById("raceInfo");

infoCard.style.display="block";

status.className="status";

status.textContent=
"出馬表を取得しています...";

info.innerHTML="";

document.getElementById("mainCard").style.display="none";

document.getElementById("horseDataCard").style.display="none";


try{

const url=
"https://race.netkeiba.com/race/shutuba.html?race_id="+id;

const text=await jinaFetch(url);

debug("出馬表取得成功: "+id);

horses=parseRacePage(text);

debug("パース結果: "+horses.length+"頭");

if(horses.length===0){

throw new Error(
"馬データを取得できませんでした"
);

}

renderRaceInfo(text);

renderHorses();

calculatePrediction();

status.className="status success";

status.textContent=
"出馬表の取得に成功しました。\n"+
horses.length+
"頭を取得しました。";

document.getElementById("mainCard").style.display="block";

document.getElementById("horseDataCard").style.display="block";

}catch(error){

console.error(error);

status.className="status error";

status.textContent=
"出馬表の取得に失敗しました。\n"+
error.message;

debug("RACE ERROR: "+error.message);

}

}


/* =========================
   馬名抽出
========================= */

function extractHorseName(cell){

if(!cell){
return "";
}


/*
netkeibaの馬リンク：

[オーブルクール![Image ...](...)]
(https://db.netkeiba.com/horse/... "オーブルクール")
*/

let m=
cell.match(
/\]\([^)]*\s+"([^"]+)"\)/
);

if(m&&m[1]){
return m[1].trim();
}


/*
通常リンク
*/

m=
cell.match(
/\[([^\]]+)\]\(https?:\/\/db\.netkeiba\.com\/horse\//
);

if(m&&m[1]){

return m[1]
.replace(/!\[[^\]]*\]\([^)]*\)/g,"")
.trim();

}


/*
画像除去
*/

let text=
cell
.replace(/!\[[^\]]*\]\([^)]*\)/g,"")
.replace(/\[|\]/g,"")
.trim();

return text;

}


/* =========================
   数値化
========================= */

function toNumber(value){

if(value===null||value===undefined){
return 0;
}

const n=parseFloat(
String(value)
.replace(/,/g,"")
.replace(/[^\d.]/g,"")
);

return isNaN(n)?0:n;

}


/* =========================
   ★新パーサー
========================= */

function parseRacePage(text){

const result=[];

const lines=text.split("\n");

debug("総行数: "+lines.length);


/*
各行について、
「db.netkeiba.com/horse/」
を含む行を馬行として処理。

これならMarkdown表のセル位置が変わっても
馬名を直接拾える。
*/

for(let i=0;i<lines.length;i++){

const line=lines[i];

if(
!line.includes("db.netkeiba.com/horse/")
){
continue;
}


/*
--------------------------------
馬番
--------------------------------

行の先頭付近に

| 1 | ...

という形があるので、
最初の1〜18の整数を取得。
*/

const cells=
line
.split("|")
.map(x=>x.trim());

let horseNo=0;

for(let j=0;j<Math.min(cells.length,5);j++){

const cleaned=
cells[j]
.replace(/[*_]/g,"")
.trim();

const m=
cleaned.match(/^(\d{1,2})$/);

if(m){

const n=parseInt(m[1],10);

if(n>=1&&n<=18){

horseNo=n;
break;

}

}

}


/*
先頭の区切り形式によって
上記で取れない場合の予備処理
*/

if(!horseNo){

const firstPart=
line
.replace(/^\s*\|/,"")
.trim();

const m=
firstPart.match(/^(\d{1,2})\s*\|/);

if(m){

const n=parseInt(m[1],10);

if(n>=1&&n<=18){
horseNo=n;
}

}

}


if(!horseNo){
debug("馬番取得失敗: "+line.substring(0,150));
continue;
}


/*
--------------------------------
馬名
--------------------------------
*/

const horseName=
extractHorseName(line);

if(!horseName){

debug(
"馬名取得失敗 馬番="+
horseNo
);

continue;
}


/*
--------------------------------
セル分割
--------------------------------
*/

const dataCells=
line
.split("|")
.map(x=>x.trim())
.filter((x,index,arr)=>{
return !(index===0&&x==="");
});


const joined=dataCells.join(" ");


/*
--------------------------------
性齢
--------------------------------
*/

let sexAge="";

const ageMatch=
joined.match(/(牡|牝|セ)(\d+)/);

if(ageMatch){

sexAge=
ageMatch[1]+ageMatch[2];

}


/*
--------------------------------
斤量
--------------------------------
*/

let weight=0;

const weightMatches=
joined.match(/\b\d{2}\.\d\b/g)||[];

if(weightMatches.length){

/*
50〜60kg程度のものを斤量候補にする
*/

const candidates=
weightMatches
.map(x=>parseFloat(x))
.filter(x=>x>=45&&x<=65);

if(candidates.length){

weight=candidates[0];

}

}


/*
--------------------------------
騎手
--------------------------------

馬名の後ろ側から
最初の日本語名らしい文字列を拾う。
*/

let jockey="";

const horseIndex=
dataCells.findIndex(cell=>
cell.includes("db.netkeiba.com/horse/")
);

if(horseIndex>=0){

const after=
dataCells.slice(horseIndex+1);

for(const cell of after){

const cleaned=
cell
.replace(/!\[[^\]]*\]\([^)]*\)/g,"")
.replace(/\[|\]/g,"")
.trim();

if(!cleaned){
continue;
}

if(
cleaned.length>=2&&
cleaned.length<=8&&
!/\d/.test(cleaned)&&
!cleaned.includes("美浦")&&
!cleaned.includes("栗東")
){

jockey=cleaned;
break;

}

}

}


/*
--------------------------------
厩舎
--------------------------------
*/

let stable="";

const stableMatch=
joined.match(
/((?:美浦|栗東)[^\s|]*)/
);

if(stableMatch){

stable=stableMatch[1];

}


/*
--------------------------------
オッズ
--------------------------------
*/

let odds=0;

/*
「単勝 10.7」のような近接パターンを優先
*/

const oddsMatch=
joined.match(
/(?:単勝|オッズ)[^\d]*(\d+(?:\.\d+)?)/i
);

if(oddsMatch){

odds=parseFloat(oddsMatch[1]);

}


/*
上記で取れない場合、
2以上の小数を候補にする。
*/

if(!odds){

const nums=
joined.match(/\b\d+\.\d+\b/g)||[];

const candidates=
nums
.map(x=>parseFloat(x))
.filter(x=>
x>=1.1&&
x<=9999
);

if(candidates.length){

odds=candidates[candidates.length-1];

}

}


/*
--------------------------------
人気
--------------------------------
*/

let popularity=0;

const popMatch=
joined.match(
/(\d+)\s*番人気/
);

if(popMatch){

popularity=
parseInt(popMatch[1],10);

}


/*
--------------------------------
馬データ
--------------------------------
*/

const horse={

no:horseNo,

name:horseName,

sexAge:sexAge,

weight:weight,

jockey:jockey,

stable:stable,

odds:odds,

popularity:popularity,

/*
まだ自動取得していない項目
*/

style:"差し",

secondLeg:50,

training:50,

pedigree:50,

position:50

};


/*
重複防止
*/

if(
!result.some(x=>x.no===horse.no)
){

result.push(horse);

debug(
"取得成功: "+
horse.no+
" "+
horse.name+
" odds="+
horse.odds
);

}

}


/*
--------------------------------
馬番順
--------------------------------
*/

result.sort((a,b)=>a.no-b.no);


/*
--------------------------------
最終確認
--------------------------------
*/

const missing=[];

for(let n=1;n<=18;n++){

if(
!result.some(h=>h.no===n)
){
missing.push(n);
}

}

debug(
"最終取得頭数: "+
result.length
);

if(missing.length){

debug(
"未取得馬番: "+
missing.join(",")
);

}else{

debug("1〜"+result.length+"番まで全頭取得");

}

return result;

}


/* =========================
   レース情報
========================= */

function renderRaceInfo(text){

const date=
document.getElementById("raceDate").value;

const raceNo=
parseInt(
selectedRaceId.substring(10,12),
10
);

const info=
document.getElementById("raceInfo");

let distance="";
let surface="";

const distMatch=
text.match(/(芝|ダ)(\d{3,4})m/);

if(distMatch){

surface=
distMatch[1]==="芝"
?"芝"
:"ダート";

distance=
distMatch[2]+"m";

}

info.innerHTML=
"<div class='scoreBox'>"+
"<div><b>"+
escapeHtml(date)+
" "+
raceNo+
"R"+
"</b></div>"+
"<div class='small'>"+
escapeHtml(surface)+
" "+
escapeHtml(distance)+
"</div>"+
"</div>";

}


/* =========================
   馬カード
========================= */

function renderHorses(){

const area=
document.getElementById("horseGrid");

area.innerHTML="";

horses.forEach(function(h){

const div=
document.createElement("div");

div.className="horseCard";

div.innerHTML=

"<div class='horseTitle'>"+
h.no+
". "+
escapeHtml(h.name)+
"</div>"+

"<div class='small'>"+
escapeHtml(h.sexAge)+
" / "+
(h.weight||"-")+
"kg / "+
escapeHtml(h.jockey||"-")+
" / "+
escapeHtml(h.stable||"-")+
"</div>"+

"<div class='small' style='margin-top:5px'>"+
"オッズ: "+
(h.odds||"-")+
"　人気: "+
(h.popularity||"-")+
"</div>"+

"<br>"+

"<div class='horseInputs'>"+

/* =========================
   ペース
========================= */

function calcPace(hs){

const front=
hs.filter(h=>
h.style==="逃げ"||
h.style==="先行"
);

const escape=
hs.filter(h=>
h.style==="逃げ"
);

const frontPower=
front.length
?front.reduce(
(sum,h)=>sum+h.secondLeg,
0
)/front.length
:0;

const escapePower=
escape.length
?escape.reduce(
(sum,h)=>sum+h.secondLeg,
0
)/escape.length
:0;

let pressure=
front.length*1.5+
escape.length*2+
Math.max(
0,
(frontPower-50)/10
)+
Math.max(
0,
(escapePower-50)/10
);

if(hs.length>=16){
pressure+=1;
}

if(pressure>=12){

return{
type:"H",
text:"Hペース想定・差し/追込有利"
};

}

if(pressure<=5){

return{
type:"S",
text:"Sペース想定・逃げ/先行有利"
};

}

return{
type:"M",
text:"Mペース想定・展開フラット"
};

}


/* =========================
   ペース補正
========================= */

function paceBonus(h,pace){

let b=0;

if(pace.type==="H"){

if(h.style==="逃げ")b-=9;
if(h.style==="先行")b-=4;
if(h.style==="差し")b+=7;
if(h.style==="追込")b+=9;

if(
(h.style==="逃げ"||
h.style==="先行")&&
h.secondLeg<45
){
b-=4;
}

}else if(pace.type==="M"){

if(h.style==="逃げ")b+=2;
if(h.style==="先行")b+=3;
if(h.style==="差し")b+=2;
if(h.style==="追込")b-=2;

}else{

if(h.style==="逃げ")b+=10;
if(h.style==="先行")b+=7;
if(h.style==="差し")b-=5;
if(h.style==="追込")b-=10;

if(
(h.style==="逃げ"||
h.style==="先行")&&
h.secondLeg>=70
){
b+=3;
}

}

return b;

}


/* =========================
   コース補正
========================= */

function courseBonus(h){

let b=0;

const distanceText=
document.getElementById("raceInfo")
.textContent;

const distanceMatch=
distanceText.match(/(\d{3,4})m/);

const distance=
distanceMatch
?parseInt(distanceMatch[1],10)
:1600;

const course=
document.getElementById("course").value;

if(distance<=1400){

b+=h.secondLeg*.08;
b+=h.position*.07;

}else if(distance<=1800){

b+=h.training*.08;
b+=h.position*.07;

}else{

b+=h.training*.08;
b+=h.pedigree*.08;

}

if(course==="東京"){
b+=h.position*.03;
}

if(course==="中山"){
b+=h.position*.03;
b+=h.secondLeg*.02;
}

if(course==="京都"){
b+=h.position*.03;
}

if(
course==="阪神"||
course==="中京"
){
b+=h.training*.03;
}

if(course==="新潟"){
b+=h.secondLeg*.03;
}

if(
course==="福島"||
course==="小倉"
){
b+=h.position*.03;
}

return b;

}


/* =========================
   予想計算
========================= */

function calculatePrediction(){

if(!horses.length){
return;
}

const pace=calcPace(horses);

document.getElementById("paceResult")
.textContent=
pace.type+
"："+
pace.text;

const scored=
horses.map(function(h){

const base=
h.training*.30+
h.pedigree*.25+
h.position*.25+
h.secondLeg*.20;

const paceAdj=
paceBonus(h,pace);

const courseAdj=
courseBonus(h);

let favoriteAdj=0;

if(
h.odds>0&&
h.odds<=3
){
favoriteAdj=-3;
}

let total=
base+
paceAdj+
courseAdj+
favoriteAdj;

if(total<1){
total=1;
}

return{
...h,
score:total
};

});


const scoreTotal=
scored.reduce(
(sum,h)=>sum+h.score,
0
);


scored.forEach(function(h){

h.winRate=
scoreTotal>0
?h.score/scoreTotal*100
:0;

h.ev=
h.odds>0
?h.winRate/100*h.odds*100
:0;

});


scored.sort(
(a,b)=>b.score-a.score
);


const marks=
["◎","○","▲","△","☆"];

const tbody=
document.getElementById("predictionBody");

tbody.innerHTML="";


scored.forEach(function(h,i){

const tr=
document.createElement("tr");

if(i===0){
tr.className="rank1";
}

tr.innerHTML=

"<td class='mark'>"+
(marks[i]||"")+
"</td>"+

"<td>"+h.no+"</td>"+

"<td><b>"+
escapeHtml(h.name)+
"</b></td>"+

"<td>"+
escapeHtml(h.sexAge)+
"</td>"+

"<td>"+
(h.weight||"-")+
"</td>"+

"<td>"+
escapeHtml(h.jockey||"-")+
"</td>"+

"<td>"+
escapeHtml(h.stable||"-")+
"</td>"+

"<td>"+
(h.odds||"-")+
"</td>"+

"<td>"+
(h.popularity||"-")+
"</td>"+

"<td><b>"+
h.score.toFixed(1)+
"</b></td>"+

"<td>"+
h.winRate.toFixed(1)+
"%"+
"</td>"+

"<td>"+
h.ev.toFixed(1)+
"</td>";

tbody.appendChild(tr);

});


const evSorted=
[...scored].sort(
(a,b)=>b.ev-a.ev
);

const evBody=
document.getElementById("evBody");

evBody.innerHTML="";


evSorted.forEach(function(h,i){

const tr=
document.createElement("tr");

tr.innerHTML=

"<td>"+
(i+1)+
"</td>"+

"<td>"+
h.no+
"</td>"+

"<td>"+
escapeHtml(h.name)+
"</td>"+

"<td>"+
(h.odds||"-")+
"</td>"+

"<td>"+
h.winRate.toFixed(1)+
"%"+
"</td>"+

"<td><b>"+
h.ev.toFixed(1)+
"</b></td>";

evBody.appendChild(tr);

});


document.getElementById("dataSummary")
.textContent=
horses.length+
"頭取得 / 出馬表データ自動反映 / 評価項目は初期値";

}

/* =========================
   隊列アニメーション
========================= */

function startLineup(){

stopLineup();

const area=
document.getElementById("lineupArea");

let shift=0;

lineupTimer=
setInterval(function(){

shift++;

area.style.transform=
"translateX("+
((shift%2)*3)+
"px)";

},lineupSpeed);

}


function stopLineup(){

if(lineupTimer){

clearInterval(lineupTimer);

lineupTimer=null;

}

document.getElementById("lineupArea")
.style.transform="translateX(0)";

}


function changeLineupSpeed(){

lineupSpeed=
Math.max(
100,
lineupSpeed-150
);

if(lineupTimer){
startLineup();
}

}

raceId:selectedRaceId,

date:

horses:horses,

actual3f:actual3f,

memo:memo,

savedAt:
new Date().toISOString()

};

let history=[];

try{

history=
JSON.parse(
localStorage.getItem(
"keiba_verify_v06"
)||"[]"
);

}catch(e){

history=[];

}

history.push(data);

localStorage.setItem(
"keiba_verify_v06",
JSON.stringify(history)
);

document.getElementById("verifyStatus");

status.className="status success";

status.textContent=
"検証データを保存しました。";

}
