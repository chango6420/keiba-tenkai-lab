<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競馬展開ラボ v1.1</title>

<style>
:root{
  --bg:#07101d;
  --card:#101a2a;
  --line:#263752;
  --text:#edf4ff;
  --muted:#91a0b8;
  --accent:#5da7ff;
  --good:#55d68a;
  --warn:#ffc857;
  --danger:#ff6978;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#07101d,#0a1322);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif
}
main{max-width:1250px;margin:auto;padding:14px 12px 60px}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding:5px 0 14px
}
.title{font-size:23px;font-weight:900}
.ver{font-size:11px;color:var(--muted);margin-top:3px}

.card{
  background:rgba(16,26,42,.96);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  margin-top:12px
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}
.field label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:4px
}
input,select,button{
  width:100%;
  min-height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#091321;
  color:var(--text);
  padding:8px;
  font:inherit
}
button{font-weight:800;cursor:pointer}
button:disabled{opacity:.45}
.primary{background:#1f6feb;border-color:#1f6feb}
.secondary{background:#172338}
.actions{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:8px;
  margin-top:9px
}
.status{
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
  margin-top:9px
}
.ok{color:var(--good)}
.warn{color:var(--warn)}
.bad{color:var(--danger)}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}
.kpi{
  background:#091321;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px;
  text-align:center
}
.kpi small{color:var(--muted);font-size:10px}
.kpi b{
  display:block;
  font-size:20px;
  margin-top:3px
}

.layout{
  display:grid;
  grid-template-columns:1.45fr .85fr;
  gap:12px
}
.trackWrap{overflow:hidden}
.track{
  position:relative;
  height:560px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0a1521;
  overflow:hidden
}
svg{width:100%;height:100%;display:block}
.trackTitle{
  position:absolute;
  left:10px;
  top:8px;
  background:rgba(7,16,29,.82);
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  color:#d8e5f6;
  z-index:5
}

.runner{
  position:absolute;
  width:31px;
  height:31px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:#07101d;
  background:#f4f7fb;
  border:2px solid #07101d;
  box-shadow:0 2px 7px #0009;
  transform:translate(-50%,-50%);
  transition:left .75s ease,top .75s ease;
  z-index:4
}
.runner.lead{
  background:#ffd34e;
  box-shadow:0 0 0 3px #ffd34e55,0 2px 7px #0009
}
.runner.front{background:#7ee7a6}
.runner.mid{background:#d9e7f7}
.runner.back{background:#aeb9c8;opacity:.85}

.stagebar{
  display:flex;
  gap:5px;
  overflow:auto;
  margin-top:8px
}
.stagebar button{
  min-width:82px;
  font-size:11px;
  padding:7px
}
.stagebar button.active{background:#1f6feb}

.legend{
  font-size:10px;
  color:var(--muted);
  line-height:1.6;
  margin-top:7px
}

.summary h2,.card h2{
  font-size:16px;
  margin:0 0 9px
}
.leadbox{
  background:#091321;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  margin-bottom:9px
}
.leadbox .big{
  font-size:22px;
  font-weight:900
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px
}
.chip{
  background:#18263b;
  border:1px solid #2d4262;
  border-radius:99px;
  padding:5px 8px;
  font-size:11px
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:11px
}
th,td{
  text-align:left;
  padding:7px;
  border-bottom:1px solid var(--line)
}
th{color:var(--muted);font-weight:600}
.num{font-weight:900}
.formation{display:grid;gap:7px}
.frow{
  display:grid;
  grid-template-columns:65px 1fr;
  gap:7px;
  align-items:start
}
.frow>b{
  font-size:11px;
  color:var(--muted);
  padding-top:4px
}
.note{
  font-size:10px;
  color:var(--muted);
  line-height:1.65
}
.analysis{
  background:#091321;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  margin-top:8px
}
.analysis strong{color:#fff}

@media(max-width:900px){
  .grid{grid-template-columns:1fr 1fr}
  .layout{grid-template-columns:1fr}
  .track{height:500px}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr 1fr}
  .actions{grid-template-columns:1fr}
  .track{height:440px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .runner{width:27px;height:27px;font-size:10px}
}
</style>
</head>

<body>
<main>

<div class="top">
  <div>
    <div class="title">🏇 競馬展開ラボ</div>
    <div class="ver">v1.1 — 出馬表・過去走・逃げ判定・隊列・コース展開</div>
  </div>
</div>

<div class="card">

  <div class="grid">

    <div class="field">
      <label>開催日</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label>競馬場</label>
      <select id="venue">
        <option>札幌</option>
        <option>函館</option>
        <option>福島</option>
        <option>新潟</option>
        <option>東京</option>
        <option>中山</option>
        <option>中京</option>
        <option>京都</option>
        <option>阪神</option>
        <option>小倉</option>
      </select>
    </div>

    <div class="field">
      <label>レース</label>
      <input id="rno" type="number" min="1" max="12" value="11">
    </div>

    <div class="field">
      <label>芝 / ダート</label>
      <select id="surface">
        <option>芝</option>
        <option>ダート</option>
      </select>
    </div>

    <div class="field">
      <label>距離</label>
      <input id="distance" type="number" value="1600">
    </div>

    <div class="field">
      <label>馬場</label>
      <select id="going">
        <option>良</option>
        <option>稍重</option>
        <option>重</option>
        <option>不良</option>
      </select>
    </div>

    <div class="field" style="grid-column:span 2">
      <label>race_id（分かる場合は最優先）</label>
      <input id="raceId" placeholder="12桁のrace_id">
    </div>

  </div>

  <div class="actions">
    <button class="primary" id="loadBtn">
      出馬表＋過去走＋展開予想を取得
    </button>

    <button class="secondary" id="playBtn">
      ▶ 展開アニメーション
    </button>

    <button class="secondary" id="resetBtn">
      停止 / START
    </button>
  </div>

  <div id="status" class="status">
    準備完了。取得ボタンを押してください。
  </div>

</div>

<div class="card">

  <div class="kpis">
    <div class="kpi">
      <small>頭数</small>
      <b id="kCount">—</b>
    </div>

    <div class="kpi">
      <small>想定ペース</small>
      <b id="kPace">—</b>
    </div>

    <div class="kpi">
      <small>逃げ本命</small>
      <b id="kLead">—</b>
    </div>

    <div class="kpi">
      <small>逃げ信頼度</small>
      <b id="kConf">—</b>
    </div>

    <div class="kpi">
      <small>展開データ</small>
      <b id="kSource">—</b>
    </div>
  </div>

</div>

<div class="layout">

<section>

  <div class="card trackWrap">

    <h2>コース上の展開</h2>

    <div class="track" id="track">

      <div class="trackTitle" id="trackTitle">
        コース未取得
      </div>

      <svg id="courseSvg" viewBox="0 0 900 540"></svg>

    </div>

    <div class="stagebar" id="stagebar"></div>

    <div class="legend">
      START → 1〜2角 → 3角 → 4角 → 直線 → GOAL。
      馬の位置は予想隊列に応じてコース上を移動します。
    </div>

  </div>

  <div class="card">

    <h2>レース毎の隊列予想</h2>

    <div id="formation">
      <div class="note">
        データ取得後に表示します。
      </div>
    </div>

  </div>

</section>

<aside>

  <div class="card summary">

    <h2>ハナ想定</h2>

    <div class="leadbox">
      <div class="big" id="leadName">—</div>
      <div id="leadReason" class="note">—</div>
    </div>

    <h2>逃げ候補</h2>

    <div id="candidates" class="chips"></div>

  </div>

  <div class="card">

    <h2>展開判定</h2>

    <div id="paceText" class="note">—</div>

    <div id="analysis" class="analysis">
      <div class="note">—</div>
    </div>

  </div>

  <div class="card">

    <h2>馬別脚質・隊列</h2>

    <div style="overflow:auto">

      <table>

        <thead>
          <tr>
            <th>馬</th>
            <th>脚質</th>
            <th>START</th>
            <th>3C</th>
            <th>4C</th>
          </tr>
        </thead>

        <tbody id="horseTable"></tbody>

      </table>

    </div>

  </div>

</aside>

</div>

</main>

<script>

/* =========================================================
   基本
========================================================= */

const $ = id => document.getElementById(id);

const state = {
  horses:[],
  raceId:"",
  forecast:null,
  course:null,
  stage:0,
  timer:null
};

const VENUE = {
  "札幌":"01",
  "函館":"02",
  "福島":"03",
  "新潟":"04",
  "東京":"05",
  "中山":"06",
  "中京":"07",
  "京都":"08",
  "阪神":"09",
  "小倉":"10"
};


/* =========================================================
   Jina
========================================================= */

async function jinaFetch(url){

  const response =
    await fetch("https://r.jina.ai/"+url);

  if(!response.ok){
    throw new Error(
      "Jina HTTP "+response.status
    );
  }

  return await response.text();
}


/* =========================================================
   race_id
========================================================= */

function raceIdFromForm(){

  const direct =
    $("raceId").value.trim();

  if(direct){
    return direct;
  }

  const date =
    $("date").value.replaceAll("-","");

  return {
    date,
    venue:VENUE[$("venue").value],
    race:String($("rno").value).padStart(2,"0")
  };
}


async function findRaceId(){

  const x = raceIdFromForm();

  if(typeof x === "string"){
    return x;
  }

  const text =
    await jinaFetch(
      "https://race.netkeiba.com/top/race_list.html?kaisai_date="+
      x.date
    );

  const ids = [
    ...new Set(
      [...text.matchAll(/race_id=(\d{12})/g)]
      .map(m=>m[1])
    )
  ];

  const found =
    ids.find(id =>
      id.slice(4,6) === x.venue &&
      id.slice(10,12) === x.race
    );

  if(!found){

    throw new Error(
      "指定日の競馬場・レース番号からrace_idを特定できませんでした。race_idを直接入力してください。"
    );

  }

  return found;
}


/* =========================================================
   出馬表
========================================================= */

function clean(s){

  return String(s||"")
    .replace(/\[[^\]]*\]/g,"")
    .replace(/<[^>]+>/g,"")
    .trim();

}


function parseEntries(text){

  const lines =
    text.split(/\r?\n/);

  const out=[];

  for(const line of lines){

    if(!line.includes("|")){
      continue;
    }

    const cells =
      line.split("|").map(x=>clean(x));

    if(cells.length < 5){
      continue;
    }

    const number =
      parseInt(cells[2],10);

    if(
      !Number.isInteger(number) ||
      number < 1 ||
      number > 18
    ){
      continue;
    }

    const nameMatch =
      line.match(
        /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
      );

    if(!nameMatch){
      continue;
    }

    if(
      out.some(h=>h.number===number)
    ){
      continue;
    }

    const frame =
      parseInt(cells[1],10)||0;

    out.push({
      number,
      frame,
      name:nameMatch[1].trim(),
      style:"—",
      past:[],
      start:"中団",
      c3:"中団",
      c4:"中団",
      confidence:0
    });

  }

  return out.sort(
    (a,b)=>a.number-b.number
  );

}


/* =========================================================
   過去走の通過順抽出
========================================================= */

function extractPositions(chunk){

  const matches = [
    ...chunk.matchAll(
      /(?:^|\s)(\d+(?:-\d+){1,5})(?=\s|$)/g
    )
  ];

  return [
    ...new Set(
      matches.map(m=>m[1])
    )
  ].slice(0,9);

}


function styleFromPositions(past){

  const nums =
    past
      .map(x =>
        Number(
          String(x.position)
            .split("-")[0]
        )
      )
      .filter(
        n => Number.isFinite(n)
      );

  if(!nums.length){

    return {
      style:"—",
      score:0,
      confidence:0
    };

  }

  let score=0;

  nums.forEach((n,i)=>{

    const weight =
      Math.max(
        .45,
        1-(i*.12)
      );

    if(n===1){
      score += 3*weight;
    }
    else if(n<=3){
      score += 2*weight;
    }
    else if(n<=6){
      score += 1*weight;
    }
    else if(n<=9){
      score -= .5*weight;
    }
    else{
      score -= 1*weight;
    }

  });

  const avg =
    nums.reduce(
      (a,b)=>a+b,0
    )/nums.length;

  let style;

  if(avg<=1.6){
    style="逃げ";
  }
  else if(avg<=4){
    style="先行";
  }
  else if(avg<=8){
    style="差し";
  }
  else{
    style="追込";
  }

  const consistency =
    nums.filter(
      n=>n<=3
    ).length / nums.length;

  let confidence =
    42 +
    consistency*30 +
    Math.min(nums.length,6)*4 +
    Math.min(Math.abs(score),10)*1.5;

  confidence =
    Math.max(
      20,
      Math.min(
        96,
        Math.round(confidence)
      )
    );

  if(nums.length<3){
    confidence =
      Math.min(
        confidence,
        65
      );
  }

  return {
    style,
    score,
    confidence
  };

}


/* =========================================================
   netkeiba レース展開予想
========================================================= */

function parseForecast(text){

  const start =
    text.indexOf("レース展開予想");

  if(start<0){
    return null;
  }

  const source =
    text.slice(
      start,
      start+18000
    );

  const paceMatch =
    source.match(
      /ペース\s*\n?\s*([SMH])/
    );

  const pace =
    paceMatch ?
      paceMatch[1] :
      "M";

  const stageNames=[
    "スタート後",
    "3コーナー",
    "4コーナー"
  ];

  const result={
    pace,
    stages:[]
  };

  for(let i=0;i<stageNames.length;i++){

    const stageName =
      stageNames[i];

    const startIndex =
      source.indexOf(stageName);

    if(startIndex<0){
      continue;
    }

    let endIndex =
      source.length;

    for(
      let j=i+1;
      j<stageNames.length;
      j++
    ){

      const next =
        source.indexOf(
          stageNames[j],
          startIndex+stageName.length
        );

      if(next>=0){
        endIndex=next;
        break;
      }

    }

    const block =
      source.slice(
        startIndex,
        endIndex
      );

    const groups={
      "先頭":[],
      "先団":[],
      "中団":[],
      "後方":[]
    };

    for(
      const groupName of Object.keys(groups)
    ){

      const pattern =
        new RegExp(
          groupName+
          "\\s*\\n([\\s\\S]*?)(?=\\n\\s*(?:先頭|先団|中団|後方)\\s*\\n|$)"
        );

      const match =
        block.match(pattern);

      if(!match){
        continue;
      }

      const nums = [
        ...match[1].matchAll(
          /(?:^|\s)(\d{1,2})(?=\s|$)/g
        )
      ]
      .map(m=>Number(m[1]))
      .filter(
        n=>n>=1 && n<=18
      );

      groups[groupName]=[
        ...new Set(nums)
      ];

    }

    result.stages.push({
      name:stageName,
      groups
    });

  }

  return result;

}


/* =========================================================
   netkeiba展開 → 馬へ反映
========================================================= */

function enrichFromForecast(){

  if(!state.forecast){
    return;
  }

  const map =
    new Map(
      state.horses.map(
        h=>[h.number,h]
      )
    );

  state.forecast.stages.forEach(
    (stage,index)=>{

      Object.entries(
        stage.groups
      ).forEach(
        ([group,numbers])=>{

          numbers.forEach(
            number=>{

              const horse =
                map.get(number);

              if(!horse){
                return;
              }

              if(index===0){
                horse.start=group;
              }

              if(index===1){
                horse.c3=group;
              }

              if(index===2){
                horse.c4=group;
              }

            }
          );

        }
      );

    }
  );

}


/* =========================================================
   独自隊列
========================================================= */

function independentFormation(){

  const rank={
    "逃げ":0,
    "先行":1,
    "差し":2,
    "追込":3,
    "—":4
  };

  const sorted =
    [...state.horses].sort(
      (a,b)=>{

        const sa =
          rank[a.style] ?? 4;

        const sb =
          rank[b.style] ?? 4;

        if(sa!==sb){
          return sa-sb;
        }

        return (
          b.confidence-a.confidence
        );

      }
    );

  const esc =
    sorted.filter(
      h=>h.style==="逃げ"
    );

  const front =
    sorted.filter(
      h=>h.style==="先行"
    );

  const mid =
    sorted.filter(
      h=>h.style==="差し"
    );

  const back =
    sorted.filter(
      h=>h.style==="追込"
    );

  return {
    sorted,
    esc,
    front,
    mid,
    back
  };

}


/* =========================================================
   逃げ判定
========================================================= */

function prediction(){

  const rank =
    independentFormation();

  let lead =
    rank.esc[0] ||
    rank.front[0] ||
    rank.sorted[0];

  let source="独自推定";

  if(state.forecast){

    const start =
      state.forecast.stages[0]?.groups?.先頭 || [];

    const candidates =
      start
        .map(
          n =>
            state.horses.find(
              h=>h.number===n
            )
        )
        .filter(Boolean);

    const escape =
      candidates.find(
        h=>h.style==="逃げ"
      );

    if(escape){
      lead=escape;
      source="netkeiba＋独自";
    }
    else if(candidates[0]){
      lead=candidates[0];
      source="netkeiba＋独自";
    }

  }

  const rivals = [
    ...rank.esc,
    ...rank.front
  ]
  .filter(
    h=>h!==lead
  )
  .sort(
    (a,b)=>
      b.confidence-a.confidence
  )
  .slice(0,6);

  let pace;

  if(rank.esc.length>=3){
    pace="H";
  }
  else if(rank.esc.length===2){
    pace="M";
  }
  else{
    pace="S";
  }

  if(state.forecast?.pace){
    pace=state.forecast.pace;
  }

  return {
    lead,
    rivals,
    rank,
    source,
    pace
  };

}


/* =========================================================
   コース仕様
========================================================= */

function courseSpec(){

  const venue =
    $("venue").value;

  const surface =
    $("surface").value;

  const distance =
    Number(
      $("distance").value
    );

  const specs={

    "東京":{
      dir:"左",
      type:"long",
      straight:526,
      description:"大きな4角＋長い直線"
    },

    "中山":{
      dir:"右",
      type:"tight",
      straight:310,
      description:"小回り＋急坂"
    },

    "京都":{
      dir:"右",
      type:"hill",
      straight:404,

/* =========================================================
   隊列をstageごとに作る
========================================================= */

function fallbackGroups(){

  const p =
    independentFormation();

  const ordered=[
    ...p.esc,
    ...p.front,
    ...p.mid,
    ...p.back
  ];

  const groups={
    "先頭":[],
    "先団":[],
    "中団":[],
    "後方":[]
  };

  if(!ordered.length){
    return groups;
  }

  groups["先頭"]=
    ordered.slice(0,1)
      .map(h=>h.number);

  groups["先団"]=
    ordered.slice(
      1,
      Math.max(
        2,
        Math.ceil(
          ordered.length*.30
        )
      )
    )
    .map(h=>h.number);

  groups["中団"]=
    ordered.slice(
      Math.ceil(
        ordered.length*.30
      ),
      Math.ceil(
        ordered.length*.72
      )
    )
    .map(h=>h.number);

  groups["後方"]=
    ordered.slice(
      Math.ceil(
        ordered.length*.72
      )
    )
    .map(h=>h.number);

  return groups;

}


function stageGroups(){

  if(
    state.forecast &&
    state.forecast.stages.length>=3
  ){

    return [
      state.forecast.stages[0].groups,
      state.forecast.stages[1].groups,
      state.forecast.stages[2].groups
    ];

  }

  const g =
    fallbackGroups();

  return [g,g,g];

}


/* =========================================================
   コース上のstage位置
   SVG pathを実際に使って配置する
========================================================= */

function getPathPoints(){

  const path =
    $("courseSvg")
      .querySelector("#courseCenter");

  if(!path){
    return [];
  }

  const length =
    path.getTotalLength();

  const points=[];

  for(let i=0;i<=100;i++){

    const p =
      path.getPointAtLength(
        length*(i/100)
      );

    points.push([
      p.x,
      p.y
    ]);

  }

  return points;

}


/*
  stage:
  0 START後
  1 1〜2角
  2 3C
  3 4C
  4 直線
  5 GOAL

  path上の進行率を変える。
*/
function stageProgress(stage){

  const spec =
    state.course;

  if(spec.type==="straight"){

    return [
      0,
      .18,
      .42,
      .63,
      .82,
      1
    ][stage];

  }

  return [
    .00,
    .22,
    .52,
    .70,
    .88,
    1.00
  ][stage];

}


/* =========================================================
   隊列グループ → path上の位置
========================================================= */

function positionsForStage(stage){

  const path =
    $("courseSvg")
      .querySelector("#courseCenter");

  if(!path){
    return {};
  }

  const length =
    path.getTotalLength();

  const groups =
    stageGroups();

  let groupData;

  if(stage<=1){
    groupData=groups[0];
  }
  else if(stage===2){
    groupData=groups[0];
  }
  else if(stage===3){
    groupData=groups[2];
  }
  else{
    groupData=groups[2];
  }

  const result={};

  const groupNames=[
    "先頭",
    "先団",
    "中団",
    "後方"
  ];

  /*
    グループごとに前後の距離を作る。
    これで「横一列」ではなく
    レース中の縦隊になる。
  */

  const base =
    stageProgress(stage);

  const offsets={
    "先頭":0,
    "先団":-.018,
    "中団":-.055,
    "後方":-.095
  };

  groupNames.forEach(
    groupName=>{

      const numbers =
        groupData[groupName] || [];

      numbers.forEach(
        (number,index)=>{

          const spread =
            index -
            (numbers.length-1)/2;

          let progress =
            base +
            offsets[groupName] +
            spread*.012;

          progress =
            Math.max(
              0,
              Math.min(
                .995,
                progress
              )
            );

          const point =
            path.getPointAtLength(
              length*progress
            );

          /*
            pathに対して横方向へ少しずらす。
            馬群が完全に重ならないようにする。
          */

          const before =
            path.getPointAtLength(
              Math.max(
                0,
                length*(progress-.002)
              )
            );

          const after =
            path.getPointAtLength(
              Math.min(
                length,
                length*(progress+.002)
              )
            );

          const dx =
            after.x-before.x;

          const dy =
            after.y-before.y;

          const norm =
            Math.sqrt(
              dx*dx+dy*dy
            ) || 1;

          const nx =
            -dy/norm;

          const ny =
            dx/norm;

          const lane =
            spread*13;

          result[number]=[
            point.x+nx*lane,
            point.y+ny*lane
          ];

        }
      );

    }
  );

  return result;

}


/* =========================================================
   runner色
========================================================= */

function runnerClass(horse){

  if(
    state.forecast?.stages?.[0]
      ?.groups?.先頭
      ?.includes(horse.number)
  ){
    return "lead";
  }

  if(horse.style==="逃げ"){
    return "lead";
  }

  if(horse.style==="先行"){
    return "front";
  }

  if(horse.style==="追込"){
    return "back";
  }

  return "mid";

}


/* =========================================================
   stage移動
========================================================= */

function animateStage(stage){

  state.stage=stage;

  const positions =
    positionsForStage(stage);

  state.horses.forEach(
    horse=>{

      const runner =
        $("runner"+horse.number);

      if(!runner){
        return;
      }

      const p =
        positions[horse.number];

      if(!p){
        return;
      }

      runner.className =
        "runner "+
        runnerClass(horse);

      runner.style.left =
        (p[0]/9)+"%";

      runner.style.top =
        (p[1]/5.4)+"%";

    }
  );

  document
    .querySelectorAll(
      "#stagebar button"
    )
    .forEach(
      (button,index)=>
        button.classList.toggle(
          "active",
          index===stage
        )
    );

}

function jumpStage(stage){

  if(!state.horses.length){
    return;
  }

  animateStage(stage);

}


/* =========================================================
   animation
========================================================= */

function play(){

  if(!state.horses.length){
    return;
  }

  clearInterval(
    state.timer
  );

  let stage=0;

  animateStage(0);

  state.timer =
    setInterval(
      ()=>{

        stage++;

        if(stage>5){

          clearInterval(
            state.timer
          );

          return;

        }

        animateStage(stage);

      },
      1000
    );

}


function stop(){

  clearInterval(
    state.timer
  );

  state.timer=null;

  if(state.horses.length){
    animateStage(0);
  }

}

/* =========================================================
   メイン取得
========================================================= */

async function load(){

  try{

    $("loadBtn").disabled=true;

    $("status").innerHTML =
      "race_id特定中…";


    const raceId =
      await findRaceId();

    state.raceId =
      raceId;


    $("status").innerHTML =
      `race_id ${raceId} / 出馬表取得中…`;


    const shutuba =
      await jinaFetch(
        `https://race.netkeiba.com/race/shutuba.html?race_id=${raceId}`
      );


    state.horses =
      parseEntries(
        shutuba
      );


    if(!state.horses.length){

      throw new Error(
        "出馬表から馬を取得できませんでした。"
      );

    }


    $("status").innerHTML =
      `出馬表 ${state.horses.length}頭 / `+
      `全頭の過去走・展開予想取得中…`;


    /*
      ここが重要。

      馬ごとのhorseページを16回取りに行かない。
      shutuba_past_9.htmlを1回取得して
      レース全体の過去走情報を解析する。
    */

    const past =
      await jinaFetch(
        `https://race.netkeiba.com/race/shutuba_past_9.html?race_id=${raceId}&rf=shutuba_submenu`
      );


    state.forecast =
      parseForecast(
        past
      );


    /*
      各馬について
      shutuba_pastページ内から
      馬番周辺の過去走データを拾う。
    */

    for(
      const horse of state.horses
    ){

      const marker =
        new RegExp(
          `(?:^|\\n)\\s*${horse.number}\\s+`
        );

      const match =
        marker.exec(
          past
        );

      let chunk="";

      if(match){

        chunk =
          past.slice(
            match.index,
            match.index+4500
          );

      }
      else{

        const idx =
          past.indexOf(
            String(horse.number)
          );

        if(idx>=0){

          chunk =
            past.slice(
              idx,
              idx+4500
            );

        }

      }


      if(chunk){

        const positions =
          extractPositions(
            chunk
          );

        horse.past =
          positions.map(
            position=>({
              position
            })
          );

        const style =
          styleFromPositions(
            horse.past
          );

        horse.style =
          style.style;

        horse.confidence =
          style.confidence;

      }

    }


    /*
      netkeibaの脚質表示を拾える場合はこちらを優先。
      ただし過去走から得た信頼度は保持する。
    */

    for(
      const horse of state.horses
    ){

      const re =
        new RegExp(
          `${horse.number}[^\\n]{0,700}(逃げ|先行|差し|追込)`
        );

      const match =
        past.match(re);

      if(match){

        horse.style =
          match[1];

      }

    }


    enrichFromForecast();


    $("kCount").textContent =
      state.horses.length;


    renderTrack();

    renderFormation();

    /*
      DOM描画後にpathの長さを取得する。
    */

    requestAnimationFrame(
      ()=>{
        animateStage(0);
      }
    );


    const analyzed =
      state.horses.filter(
        h=>h.past.length>0
      ).length;


    $("status").innerHTML =
      `<span class="ok">取得完了</span>：`+
      `${state.horses.length}頭 / `+
      `過去走解析 ${analyzed}頭 / `+
      `展開 ${state.forecast ? "netkeiba＋独自" : "独自推定"} / `+
      `コース ${state.course.venue}${state.course.surface}${state.course.distance}m`;


  }
  catch(error){

    console.error(error);

    $("status").innerHTML =
      `<span class="bad">取得失敗：</span>`+
      `${error.message}`;

  }
  finally{

    $("loadBtn").disabled=false;

  }

}

  ()=>{
    renderTrack();

    if(state.horses.length){
      animateStage(0);
    }
  };

  const d =
    new Date();

  d.setDate(

  );

    d.toISOString()
      .slice(0,10);

  renderTrack();
