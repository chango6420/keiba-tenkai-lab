<body>

<script>

"use strict";

/* =========================================================
   基本設定
========================================================= */

const statusEl = document.getElementById("status");
const raceSelect = document.getElementById("raceSelect");
const loadMeetingBtn = document.getElementById("loadMeetingBtn");
const loadRaceBtn = document.getElementById("loadRaceBtn");
const analyzeBtn = document.getElementById("analyzeBtn");

let races = [];
let horses = [];
let currentRace = null;

/* =========================================================
   Jina Reader
========================================================= */

async function jinaFetch(url){
  const readerUrl = "https://r.jina.ai/" + url;

  const response = await fetch(readerUrl);

  if(!response.ok){
    throw new Error("Jina HTTP " + response.status);
  }

  return await response.text();
}

/* =========================================================
   共通
========================================================= */

function clean(value){
  if(value === undefined || value === null) return "";
  return String(value)
    .replace(/\u00a0/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   開催レース取得
   ※ v0.9.4系の取得方式を維持
========================================================= */

async function loadMeeting(){

  const date = document.getElementById("kaisaiDate").value;

  if(!date){
    setStatus("開催日を選択してください。");
    return;
  }

  setStatus("開催レースを取得中...");

  loadMeetingBtn.disabled = true;

  try{

    const url =
      "https://race.netkeiba.com/top/race_list.html?kaisai_date=" +
      date.replace(/-/g,"");

    const text = await jinaFetch(url);

    const ids = [
      ...new Set(
        [...text.matchAll(/race_id=(\d{12})/g)]
          .map(m => m[1])
      )
    ];

    if(!ids.length){
      throw new Error("race_idを取得できませんでした。");
    }

    races = [];

    for(let i=0;i<ids.length;i++){

      const id = ids[i];

      races.push({
        id:id,
        label:"Race " + (i+1) + "　" + id
      });
    }

    raceSelect.innerHTML =
      '<option value="">レースを選択してください</option>' +
      races.map((race,index) =>
        `<option value="${race.id}">
          ${escapeHtml(String(index+1).padStart(2,"0"))}R　${race.id}
        </option>`
      ).join("");

    loadRaceBtn.disabled = false;

    setStatus(
      "開催レース取得完了\n" +
      races.length + "レース見つかりました。"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "開催レース取得に失敗しました。\n" +
      error.message
    );

  }finally{

    loadMeetingBtn.disabled = false;

  }
}

/* =========================================================
   出走馬取得
========================================================= */

async function loadRace(){

  const raceId = raceSelect.value;

  if(!raceId){
    setStatus("レースを選択してください。");
    return;
  }

  setStatus("出走馬を取得中...");

  loadRaceBtn.disabled = true;

  try{

    const url =
      "https://race.netkeiba.com/race/shutuba.html?race_id=" +
      raceId;

    const text = await jinaFetch(url);

    horses = parseHorses(text);

    currentRace = {
      id:raceId,
      url:url
    };

    if(!horses.length){
      throw new Error("出走馬を取得できませんでした。");
    }

    renderRaceInfo();
    renderHorses();
    renderEV();

    analyzeBtn.disabled = false;

    setStatus(
      "出走馬取得完了\n" +
      horses.length + "頭取得しました。"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "出走馬取得に失敗しました。\n" +
      error.message
    );

  }finally{

    loadRaceBtn.disabled = false;

  }
}

/* =========================================================
   出走馬パース
========================================================= */

function parseHorses(text){

  const lines = text.split(/\r?\n/);

  const result = [];

  for(const line of lines){

    if(!line.includes("|")) continue;

    const cells =
      line.split("|").map(x => clean(x));

    if(cells.length < 8) continue;

    const frame =
      Number(cells[1]);

    const number =
      Number(cells[2]);

    if(!Number.isInteger(frame) ||
       frame < 1 ||
       frame > 8){
      continue;
    }

    if(!Number.isInteger(number) ||
       number < 1 ||
       number > 18){
      continue;
    }

    const titleMatch =
      line.match(
        /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
      );

    if(!titleMatch) continue;

    const name = clean(titleMatch[1]);

    const odds =
      Number(clean(cells[10] || ""));

    const popularity =
      Number(clean(cells[11] || ""));

    const horseIdMatch =
      line.match(
        /db\.netkeiba\.com\/horse\/(\d+)/
      );

    const horseId =
      horseIdMatch ? horseIdMatch[1] : "";

    const horseUrl =
      horseId
        ? "https://db.netkeiba.com/horse/" + horseId + "/"
        : "";

    result.push({
      frame,
      number,
      name,
      odds:Number.isFinite(odds) ? odds : 0,
      popularity:
        Number.isFinite(popularity)
          ? popularity
          : 0,
      horseId,
      horseUrl,

      style:"",
      styleScore:{
        escape:0,
        front:0,
        stalker:0,
        closer:0
      },

      confidence:0,
      pastRaces:[]
    });
  }

  const unique = [];
  const used = new Set();

  for(const horse of result){

    if(used.has(horse.number)) continue;

    used.add(horse.number);
    unique.push(horse);
  }

  unique.sort((a,b) => a.number - b.number);

  return unique;
}

/* =========================================================
   過去走ヘッダー検出
========================================================= */

function findHeaderRow(lines){

  for(const line of lines){

    if(!line.includes("|")) continue;

    const cells =
      line.split("|").map(x => clean(x));

    const joined = cells.join("|");

    if(
      joined.includes("日付") &&
      joined.includes("着順") &&
      joined.includes("距離") &&
      joined.includes("通過")
    ){
      return cells;
    }
  }

  return null;
}

/* =========================================================
   列位置取得
========================================================= */

function getColumnIndexes(header){

  function find(names){

    for(const name of names){

      const index =
        header.findIndex(
          cell => cell === name ||
                  cell.includes(name)
        );

      if(index >= 0) return index;
    }

    return -1;
  }

  return {
    date:find(["日付"]),
    course:find(["開催"]),
    finish:find(["着順"]),
    distance:find(["距離"]),
    going:find(["馬場"]),
    position:find(["通過"]),
    raceName:find(["レース名"])
  };
}

/* =========================================================
   着順
========================================================= */

function parseFinish(value){

  const text = clean(value);

  const match =
    text.match(/^(\d{1,2})(?:着)?$/);

  if(!match) return 0;

  const n = Number(match[1]);

  if(n < 1 || n > 18) return 0;

  return n;
}

/* =========================================================
   距離＋芝ダート
========================================================= */

function parseDistanceInfo(value){

  const text = clean(value);

  let surface = "";

  if(/ダート|ダ/.test(text)){
    surface = "ダート";
  }else if(/芝/.test(text)){
    surface = "芝";
  }else if(/障/.test(text)){
    surface = "障害";
  }

  const match =
    text.match(/(\d{3,4})/);

  const distance =
    match ? Number(match[1]) : 0;

  return {
    surface,
    distance
  };
}

/* =========================================================
   競馬場
   例：
   4中山1 → 中山
   3東京5 → 東京
   笠松 → 笠松
========================================================= */

function parseCourse(value){

  const text = clean(value);

  const courses = [
    "札幌",
    "函館",
    "福島",
    "新潟",
    "東京",
    "中山",
    "中京",
    "京都",
    "阪神",
    "小倉",
    "門別",
    "盛岡",
    "水沢",
    "浦和",
    "船橋",
    "大井",
    "川崎",
    "金沢",
    "笠松",
    "名古屋",
    "園田",
    "姫路",
    "高知",
    "佐賀"
  ];

  for(const course of courses){

    if(text.includes(course)){
      return course;
    }
  }

  return text
    .replace(/[0-9]/g,"")
    .trim();
}

/* =========================================================
   芝・ダート
========================================================= */

function parseSurface(value){

  const text = clean(value);

  if(/ダート|ダ/.test(text)){
    return "ダート";
  }

  if(/芝/.test(text)){
    return "芝";
  }

  if(/障/.test(text)){
    return "障害";
  }

  return "";
}

/* =========================================================
   馬場
========================================================= */

function parseGoing(value){

  const text = clean(value);

  if(text.includes("不良")) return "不良";
  if(text.includes("重")) return "重";
  if(text.includes("稍")) return "稍重";
  if(text.includes("良")) return "良";

  return "";
}

/* =========================================================
   日付
========================================================= */

function parseRaceDate(value){

  const text = clean(value);

  if(
    /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(text) ||
    /^\d{4}\.\d{1,2}\.\d{1,2}$/.test(text)
  ){
    return text;
  }

  return "";
}

/* =========================================================
   過去走解析
   ★固定列方式
========================================================= */

function parsePastRaces(text){

  const lines =
    text.split(/\r?\n/);

  const header =
    findHeaderRow(lines);

  if(!header){
    console.warn("過去走ヘッダーが見つかりません");
    return [];
  }

  const indexes =
    getColumnIndexes(header);

  if(
    indexes.date < 0 ||
    indexes.finish < 0 ||
    indexes.distance < 0 ||
    indexes.position < 0
  ){
    console.warn(
      "必要な列が見つかりません",
      indexes
    );

    return [];
  }

  const races = [];

  const maxIndex =
    Math.max(
      indexes.date,
      indexes.course,
      indexes.finish,
      indexes.distance,
      indexes.going,
      indexes.position,
      indexes.raceName
    );

  for(const line of lines){

    if(!line.includes("|")) continue;

    const cells =
      line.split("|").map(x => clean(x));

    /*
      ヘッダー以下のデータ行で、
      必要列まで存在するものだけ処理。
      これで「1行ずつ結果がズレる」問題を防ぐ。
    */
    if(cells.length <= maxIndex) continue;

    if(
      cells[indexes.date] ===
      header[indexes.date]
    ){
      continue;
    }

    const date =
      parseRaceDate(
        cells[indexes.date]
      );

    const finish =
      parseFinish(
        cells[indexes.finish]
      );

    const position =
      clean(
        cells[indexes.position]
      );

    const distanceInfo =
      parseDistanceInfo(
        cells[indexes.distance]
      );

    const course =
      indexes.course >= 0
        ? parseCourse(
            cells[indexes.course]
          )
        : "";

    const surface =
      distanceInfo.surface ||
      (
        indexes.distance >= 0
          ? parseSurface(
              cells[indexes.distance]
            )
          : ""
      );

    const distance =
      distanceInfo.distance;

    const going =
      indexes.going >= 0
        ? parseGoing(
            cells[indexes.going]
          )
        : "";

    const raceName =
      indexes.raceName >= 0
        ? clean(
            cells[indexes.raceName]
          )
        : "";

    /*
      日付・着順・通過の最低条件。
      距離だけ別の数字を拾うことはしない。
    */
    if(!date) continue;
    if(!finish) continue;
    if(!position) continue;

    races.push({
      date,
      finish,
      position,
      distance,
      course,
      surface,
      going,
      raceName
    });
  }

  const unique = [];
  const used = new Set();

  for(const race of races){

    const key =
      [
        race.date,
        race.finish,
        race.position,
        race.distance,
        race.course,
        race.surface,
        race.going
      ].join("|");

    if(used.has(key)) continue;

    used.add(key);
    unique.push(race);
  }

  return unique.slice(0,10);
}

/* =========================================================
   通過順 → 脚質
========================================================= */

function classifyStyle(position){

  if(!position) return "";

  const first =
    Number(
      String(position)
        .split("-")[0]
    );

  if(!Number.isFinite(first)){
    return "";
  }

  if(first === 1){
    return "逃げ";
  }

  if(first <= 3){
    return "先行";
  }

  if(first <= 6){
    return "差し";
  }

  return "追込";
}

/* =========================================================
   脚質スコア
========================================================= */

function analyzeStyle(races){

  const scores = {
    escape:0,
    front:0,
    stalker:0,
    closer:0
  };

  const recent =
    races.slice(0,10);

  recent.forEach((race,index)=>{

    const weight =
      index < 3
        ? 3
        : index < 6
          ? 2
          : 1;

    const style =
      classifyStyle(
        race.position
      );

    if(style === "逃げ"){
      scores.escape += weight;
    }

    if(style === "先行"){
      scores.front += weight;
    }

    if(style === "差し"){
      scores.stalker += weight;
    }

    if(style === "追込"){
      scores.closer += weight;
    }
  });

  const entries =
    Object.entries(scores)
      .sort((a,b)=>b[1]-a[1]);

  const winner =
    entries[0];

  const second =
    entries[1];

  let style = "不明";

  if(winner[1] > 0){

    if(winner[0] === "escape"){
      style = "逃げ";
    }else if(winner[0] === "front"){
      style = "先行";
    }else if(winner[0] === "stalker"){
      style = "差し";
    }else if(winner[0] === "closer"){
      style = "追込";
    }
  }

  let confidence = 0;

  const total =
    entries.reduce(
      (sum,item)=>sum+item[1],
      0
    );

  if(total > 0){

    const dominance =
      winner[1] / total;

    const separation =
      winner[1] - second[1];

    confidence =
      Math.round(
        dominance * 60 +
        Math.min(
          separation * 4,
          25
        ) +
        Math.min(
          races.length * 2,
          15
        )
      );
  }

  /*
    データが少ない場合は過信させない
  */
  if(races.length <= 1){
    confidence =
      Math.min(confidence,35);
  }else if(races.length <= 3){
    confidence =
      Math.min(confidence,55);
  }

  return {
    style,
    scores,
    confidence
  };
}

/* =========================================================
   全頭過去走取得
========================================================= */

async function analyzeAllHorses(){

  if(!horses.length){
    setStatus("先に出走馬を取得してください。");
    return;
  }

  analyzeBtn.disabled = true;

  let success = 0;

  setStatus(
    "過去走解析開始...\n" +
    "0 / " + horses.length
  );

  for(let i=0;i<horses.length;i++){

    const horse =
      horses[i];

    try{

      if(!horse.horseUrl){
        continue;
      }

      /*
        v0.9.4で動作していたURLを維持
      */
      const text =
        await jinaFetch(
          horse.horseUrl
        );

      const pastRaces =
        parsePastRaces(text);

      horse.pastRaces =
        pastRaces;

      const analysis =
        analyzeStyle(
          pastRaces
        );

      horse.style =
        analysis.style;

      horse.styleScore =
        analysis.scores;

      horse.confidence =
        analysis.confidence;

      success++;

    }catch(error){

      console.error(
        horse.name,
        error
      );

      horse.pastRaces = [];
      horse.style = "解析失敗";
      horse.confidence = 0;
    }

    setStatus(
      "過去走解析中...\n" +
      (i+1) +
      " / " +
      horses.length +
      "\n" +
      horse.name
    );

    renderHorses();

    /*
      連続アクセスを少し緩和
    */
    await sleep(250);
  }

  renderHorses();
  renderFormation();
  renderEV();

  analyzeBtn.disabled = false;

  setStatus(
    "過去走解析完了\n" +
    success +
    " / " +
    horses.length +
    "頭解析"
  );
}

/* =========================================================
   待機
========================================================= */

function sleep(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}

/* =========================================================
   レース情報
========================================================= */

function renderRaceInfo(){

  }

  document.getElementById("raceInfo").innerHTML = `
    <div>
      <span class="badge">Race ID ${escapeHtml(currentRace.id)}</span>
      <span class="badge">${horses.length}頭</span>
    </div>
  `;

/* =========================================================
   馬表示
========================================================= */

function renderHorses(){

  const box =
    document.getElementById("horseList");

  if(!horses.length){

    box.innerHTML =
      "<p>出走馬未取得</p>";

    return;
  }

  box.innerHTML =
    horses.map(horse => {

      const style =
        horse.style || "未解析";

      const pastCount =
        horse.pastRaces
          ? horse.pastRaces.length
          : 0;

      const pastHtml =
        horse.pastRaces &&
        horse.pastRaces.length
          ? horse.pastRaces.map(
              (race,index)=>{

                const course =
                  race.course || "--";

                const surface =
                  race.surface || "--";

                const distance =
                  race.distance
                    ? race.distance + "m"
                    : "--";

                const going =
                  race.going || "--";

                return `
                  <div class="past-row">
                    <b>${index+1}走前</b>
                   　
                    ${escapeHtml(race.date)}
                   　
                    <b>${race.finish}着</b>
                   　
                    通過 ${escapeHtml(race.position)}
                    <br>
                    <span class="small">
                      ${escapeHtml(course)}
                      ・
                      ${escapeHtml(surface)}
                      ${escapeHtml(distance)}
                      ・
                      ${escapeHtml(going)}
                      ${race.raceName
                        ? " ・ " +
                          escapeHtml(race.raceName)
                        : ""}
                    </span>
                  </div>
                `;
              }
            ).join("")
          : "<div class='small'>過去走データなし</div>";

      return `
        <div class="horse">

          <div class="horse-head">

            <div>
              <span class="frame">
                ${horse.frame}
              </span>

              <span class="horse-name">
                ${horse.number}.
                ${escapeHtml(horse.name)}
              </span>
            </div>

            <div>
              <span class="badge">
                ${escapeHtml(style)}
              </span>
            </div>

          </div>

          <div class="meta">
            オッズ：
            ${horse.odds || "--"}
            　
            人気：
            ${horse.popularity || "--"}
          </div>

          <div class="meta">
            過去走：
            ${pastCount}走
            　
            脚質信頼度：
            ${horse.confidence || 0}%
          </div>

          <details>
            <summary>過去走を見る</summary>

            <div class="past">
              ${pastHtml}
            </div>
          </details>

        </div>
      `;
    }).join("");
}

/* =========================================================
   隊列
========================================================= */

function renderFormation(){

  const box =
    document.getElementById("formationBox");

  if(!horses.length){
    box.innerHTML =
      "出走馬未取得";
    return;
  }

  const escape =
    horses.filter(
      h => h.style === "逃げ"
    );

  const front =
    horses.filter(
      h => h.style === "先行"
    );

  const stalker =
    horses.filter(
      h => h.style === "差し"
    );

  const closer =
    horses.filter(
      h => h.style === "追込"
    );

  function names(list){

    if(!list.length){
      return "なし";
    }

    return list.map(
      h =>
        h.number +
        "." +
        escapeHtml(h.name)
    ).join("　");
  }

  box.innerHTML = `
    <div class="card">
      <b>逃げ</b>
      <p>${names(escape)}</p>
    </div>

    <div class="card">
      <b>先行</b>
      <p>${names(front)}</p>
    </div>

    <div class="card">
      <b>差し</b>
      <p>${names(stalker)}</p>
    </div>

    <div class="card">
      <b>追込</b>
      <p>${names(closer)}</p>
    </div>
  `;
}

/* =========================================================
   期待値
========================================================= */

function renderEV(){

  const box =
    document.getElementById("evBox");

  if(!horses.length){
    box.innerHTML =
      "<p>出走馬未取得</p>";
    return;
  }

  box.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>馬</th>
          <th>脚質</th>
          <th>人気</th>
          <th>オッズ</th>
          <th>入力勝率</th>
          <th>期待値</th>
        </tr>
      </thead>

      <tbody>
        ${horses.map((horse,index)=>{

          const probability =
            horse.userProbability || 0;

          const ev =
            horse.odds && probability
              ? (
                  horse.odds *
                  (probability / 100)
                ).toFixed(2)
              : "--";

          return `
            <tr>
              <td>
                ${horse.number}.
                ${escapeHtml(horse.name)}
              </td>

              <td>
                ${escapeHtml(
                  horse.style || "--"
                )}
              </td>

              <td>
                ${horse.popularity || "--"}
              </td>

              <td>
                ${horse.odds || "--"}
              </td>

              <td>
                <input
                  type="number"
                  min="0"
                  max="100"
                  step="0.1"
                  value="${probability || ""}"
                  placeholder="%"
                  onchange="updateProbability(${index},this.value)"
                >
              </td>

              <td>
                <b>
                  ${ev}
                </b>
              </td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}

function updateProbability(index,value){

  const n =
    Number(value);

  horses[index].userProbability =
    Number.isFinite(n) ? n : 0;

  renderEV();
}

/* =========================================================
   タブ
========================================================= */

document.querySelectorAll(".tab")
.forEach(button => {

  button.addEventListener(
    "click",
    ()=>{

      document.querySelectorAll(".tab")
        .forEach(b =>
          b.classList.remove("active")
        );

      document.querySelectorAll(".section")
        .forEach(section =>
          section.classList.remove("active")
        );

      button.classList.add("active");

      const id =
        button.dataset.tab;

      document
        .getElementById(id)
        .classList.add("active");

    }
  );

});

/* =========================================================
   検証
========================================================= */

function loadVerify(){

  const box =
    document.getElementById("verifyList");

  const data =
    JSON.parse(
      localStorage.getItem(
        "keiba_verify_v0951"
      ) || "[]"
    );

  if(!data.length){

    box.innerHTML =
      "<p class='small'>保存された検証結果はありません。</p>";

    return;
  }

  box.innerHTML =
    data.map(item => `
      <div class="past-row">
        <b>${escapeHtml(item.race)}</b>
        → ${escapeHtml(item.winner)}
        <span class="small">
          ${escapeHtml(item.time)}
        </span>
      </div>
    `).join("");
}

function saveVerify(){

  const race =
    document.getElementById(
      "verifyRace"
    ).value.trim();

  const winner =
    document.getElementById(
      "verifyWinner"
    ).value.trim();

  if(!race || !winner){

    alert(
      "レース名と勝ち馬を入力してください。"
    );

    return;
  }

  const key =
    "keiba_verify_v0951";

  const data =
    JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  data.unshift({
    race,
    winner,
    time:new Date().toLocaleString(
      "ja-JP"
    )
  });

  localStorage.setItem(
    key,
    JSON.stringify(
      data.slice(0,100)
    )
  );

  document.getElementById(
    "verifyRace"
  ).value = "";

  document.getElementById(
    "verifyWinner"
  ).value = "";

  loadVerify();

  alert("保存しました。");
}
