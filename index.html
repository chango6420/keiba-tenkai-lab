<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>競馬展開ラボ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:15px;
  background:#111820;
  border-bottom:1px solid #27313c;
  position:sticky;
  top:0;
  z-index:20;
}

h1{
  margin:0;
  font-size:21px;
}

.sub{
  margin-top:4px;
  color:#8b949e;
  font-size:11px;
}

main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:10px;
}

.card{
  background:#111820;
  border:1px solid #27313c;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

h2{
  font-size:16px;
  margin:0 0 10px;
}

input,select{
  width:100%;
  background:#0b0f14;
  color:#e6edf3;
  border:1px solid #303944;
  border-radius:8px;
  padding:10px;
  margin:4px 0 8px;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  margin:3px;
  background:#238636;
  color:white;
  font-weight:bold;
}

button.gray{
  background:#303944;
}

.status{
  margin-top:8px;
  background:#0b0f14;
  border-radius:8px;
  padding:9px;
  color:#9da7b3;
  font-size:12px;
  white-space:pre-wrap;
}

.summary{
  padding:12px;
  background:#0b0f14;
  border-radius:10px;
}

.main-escape{
  font-size:21px;
  font-weight:bold;
  margin:5px 0;
}

.secondary{
  color:#9da7b3;
  font-size:12px;
}

.formation-line{
  padding:7px 8px;
  border-bottom:1px solid #27313c;
}

.formation-line:last-child{
  border-bottom:0;
}

.group{
  display:inline-block;
  min-width:54px;
  font-weight:bold;
}

.escape{color:#ffb84d}
.front{color:#58a6ff}
.middle{color:#79c0ff}
.back{color:#bc8cff}

.horse{
  padding:9px 5px;
  border-bottom:1px solid #27313c;
}

.horse:last-child{
  border-bottom:0;
}

.horse-title{
  font-weight:bold;
}

.badge{
  display:inline-block;
  font-size:10px;
  border-radius:5px;
  padding:2px 5px;
  margin-left:4px;
  background:#303944;
}

.small{
  color:#8b949e;
  font-size:11px;
  line-height:1.5;
}

.controls{
  text-align:center;
  padding:5px 0;
}

.course-title{
  text-align:center;
  color:#9da7b3;
  font-size:12px;
  margin-bottom:6px;
}

#courseWrap{
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#061009;
}

svg{
  width:100%;
  height:auto;
  display:block;
}

.trackOuter{
  fill:none;
  stroke:#b7b7b7;
  stroke-width:76;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.trackInner{
  fill:none;
  stroke:#686868;
  stroke-width:2;
  stroke-dasharray:5 6;
}

.rail{
  fill:none;
  stroke:#eeeeee;
  stroke-width:3;
  opacity:.75;
}

.marker{
  fill:#fff;
  stroke:#111;
  stroke-width:2;
}

.markerText{
  fill:#fff;
  font-size:13px;
  font-weight:bold;
}

.horseCircle{
  fill:#222;
  stroke:#fff;
  stroke-width:2;
}

.horseCircle.escapeHorse{
  stroke-width:4;
}

.horseNumber{
  fill:#fff;
  font-size:12px;
  font-weight:bold;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.horseLabel{
  fill:#fff;
  font-size:10px;
  text-anchor:middle;
  pointer-events:none;
}

.legend{
  text-align:center;
  color:#8b949e;
  font-size:10px;
  padding:7px;
}

.notice{
  padding:8px;
  background:#241d0d;
  color:#e6c86e;
  border-radius:8px;
  font-size:11px;
  margin-top:7px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>競馬展開ラボ</h1>
  <div class="sub">逃げ予想 → 隊列 → コース展開アニメーション</div>
</header>

<main>

<div class="card">
  <h2>① レース取得</h2>

  <input id="date" type="date">

  <button onclick="loadMeeting()">開催を取得</button>

  <select id="race">
    <option value="">レースを選択</option>
  </select>

  <button onclick="loadRace()">このレースを解析</button>

  <div id="status" class="status">待機中</div>
</div>


<div class="card">
  <h2>② 今回の逃げ予想</h2>

  <div id="escapeBox" class="summary">
    レースを解析すると表示されます。
  </div>
</div>


<div class="card">
  <h2>③ 想定隊列</h2>

  <div id="formation">
    レースを解析すると表示されます。
  </div>
</div>


<div class="card">
  <h2>④ 展開アニメーション</h2>

  <div id="courseTitle" class="course-title">
    コース未設定
  </div>

  <div class="controls">
    <button onclick="play()">▶ 再生</button>
    <button class="gray" onclick="pause()">Ⅱ 一時停止</button>
    <button class="gray" onclick="reset()">↺ リセット</button>
    <br>
    <button class="gray" onclick="speed(.5)">0.5倍</button>
    <button class="gray" onclick="speed(1)">1倍</button>
    <button class="gray" onclick="speed(2)">2倍</button>
  </div>

  <div id="courseWrap">
    <svg id="courseSvg" viewBox="0 0 900 560">
      <text x="450" y="280"
            fill="#777"
            text-anchor="middle">
        レース解析後にコースを表示
      </text>
    </svg>
  </div>

  <div class="legend">
    馬番を表示｜タップで馬名・脚質を確認
  </div>
</div>


<div class="card">
  <h2>⑤ 各馬の解析</h2>

  <div id="horses">
    まだ解析されていません。
  </div>
</div>

</main>


<script>

/* =====================================
   基本
===================================== */

const JINA="https://r.jina.ai/";

let raceId="";
let raceText="";
let horses=[];
let raceInfo={};

let animation={
  running:false,
  progress:0,
  speed:1,
  start:0,
  frame:null
};

let courseState=null;


function clean(v){
  return String(v ?? "")
    .replace(/<[^>]*>/g," ")
    .replace(/\[[^\]]*\]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


function status(v){
  document.getElementById("status").textContent=v;
}


async function jinaFetch(url){

  const r=await fetch(JINA+url);

  if(!r.ok){
    throw new Error("Jina HTTP "+r.status);
  }

  return await r.text();
}


/* =====================================
   開催
===================================== */

async function loadMeeting(){

  const d=document.getElementById("date").value;

  if(!d){
    status("日付を選択してください");
    return;
  }

  try{

    status("開催情報を取得中…");

    const date=d.replaceAll("-","");

    const url=
      "https://race.netkeiba.com/top/race_list.html?kaisai_date="+date;

    const text=await jinaFetch(url);

    const ids=[
      ...text.matchAll(/race_id=(\d{12})/g)
    ].map(x=>x[1]);

    const unique=[...new Set(ids)];

    const select=document.getElementById("race");

    select.innerHTML=
      '<option value="">レースを選択</option>';

    unique.forEach((id,i)=>{

      const o=document.createElement("option");

      o.value=id;

      const venueCode=id.slice(4,6);

      const venue=
        venueName(venueCode);

      const meeting=id.slice(6,8);
      const day=id.slice(8,10);
      const no=id.slice(10,12);

      o.textContent=
        venue+
        " "+
        meeting+
        "回"+day+"日 "+
        no+"R";

      select.appendChild(o);

    });

    status(
      "開催取得完了\n"+
      unique.length+"レース"
    );

  }catch(e){

    console.error(e);

    status(
      "開催取得失敗\n"+
      e.message
    );
  }
}


/* =====================================
   競馬場コード
===================================== */

function venueName(code){

  const map={
    "01":"札幌",
    "02":"函館",
    "03":"福島",
    "04":"新潟",
    "05":"東京",
    "06":"中山",
    "07":"中京",
    "08":"京都",
    "09":"阪神",
    "10":"小倉"
  };

  return map[code] || "不明";
}


/* =====================================
   レース取得
===================================== */

async function loadRace(){

  raceId=
    document.getElementById("race").value;

  if(!raceId){

    status("レースを選択してください");

    return;
  }

  try{

    status("出馬表を取得中…");

    raceText=
      await jinaFetch(
        "https://race.netkeiba.com/race/shutuba.html?race_id="+raceId
      );

    horses=parseEntries(raceText);

    parseRaceInfo(raceText);

    if(!horses.length){

      status(
        "出馬表は取得できましたが、馬を解析できませんでした。"
      );

      return;
    }

    renderHorses();

    status(
      "出馬表取得完了\n"+
      horses.length+"頭\n"+
      "過去走を一括取得します…"
    );

    await loadPast();

  }catch(e){

    console.error(e);

    status(
      "レース取得失敗\n"+
      e.message
    );
  }
}


/* =====================================
   出馬表
===================================== */

function parseEntries(text){

  const result=[];
  const used=new Set();

  for(const line of text.split(/\r?\n/)){

    if(!line.includes("|")) continue;

    const cells=
      line.split("|").map(clean);

    if(cells.length<8) continue;

    const frame=
      Number(cells[1]);

    const number=
      Number(cells[2]);

    if(
      !Number.isInteger(frame) ||
      frame<1 ||
      frame>8
    ) continue;

    if(
      !Number.isInteger(number) ||
      number<1 ||
      number>18
    ) continue;

    const m=
      line.match(
        /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
      );

    if(!m) continue;

    if(used.has(number)) continue;

    used.add(number);

    result.push({

      frame,
      number,
      name:clean(m[1]),

      past:[],

      style:"不明",

      scores:{
        escape:0,
        front:0,
        middle:0,
        back:0
      },

      confidence:0,

      escapeScore:0,

      group:"中団",

      netkeibaGroup:""

    });

  }

  return result.sort(
    (a,b)=>a.number-b.number
  );
}


/* =====================================
   レース情報
===================================== */

function parseRaceInfo(text){

  const venue=
    venueName(
      raceId.slice(4,6)
    );

  let surface="";

  if(
    /ダート\d{3,4}m/.test(text) ||
    /ダ\d{3,4}m/.test(text)
  ){

    surface="ダート";

  }else if(text.includes("芝")){

    surface="芝";
  }

  let distance=0;

  const m=
    text.match(
      /(?:芝|ダート|ダ|障)[^0-9]{0,5}(\d{3,4})m/
    );

  if(m){
    distance=Number(m[1]);
  }

  if(!distance){

    const m2=
      text.match(
        /\b(1000|1100|1150|1200|1300|1400|1500|1600|1700|1800|1900|2000|2100|2200|2300|2400|2500|2600|2800|3000|3200|3400|3600)\b/
      );

    if(m2){
      distance=Number(m2[1]);
    }
  }

  raceInfo={
    venue,
    surface,
    distance
  };
}


/* =====================================
   過去9走一括取得
===================================== */

async function loadPast(){

  try{

    const url=
      "https://race.netkeiba.com/race/shutuba_past_9.html?race_id="+
      raceId;

    const text=
      await jinaFetch(url);

    const parsed=
      parsePast(text);

    let count=0;

    horses.forEach(horse=>{

      const p=
        parsed.find(
          x=>x.number===horse.number
        );

      if(p){

        horse.past=p.past;

        analyseHorse(horse);

        count++;
      }

    });

    /*
     * netkeiba側の展開情報を可能な範囲で取得
     */

    parsePublicStyle(text);

    /*
     * 最終的な今回の隊列
     */

    analyseFormation();

    renderEscape();

    renderFormation();

    renderHorses();

    renderCourse();

    status(
      "解析完了\n"+
      horses.length+"頭\n"+
      "過去走解析："+count+"頭\n"+
      "今回の逃げ予想・隊列を作成しました"
    );

  }catch(e){

    console.error(e);

    status(
      "過去走取得失敗\n"+
      e.message
    );
  }
}


/* =====================================
   過去走解析
===================================== */

function parsePast(text){

  const result=[];

  /*
   * shutuba_past_9 は馬番→馬名→
   * 前走〜9走前という構造を持つ。
   *
   * ここでは日付を起点に
   * その周辺の情報を1走として拾う。
   */

  const lines=text.split(/\r?\n/);

  let current=null;

  for(const line of lines){

    const c=line.split("|").map(clean);

    /*
     * 馬番候補
     */

    for(let i=0;i<c.length;i++){

      const n=Number(c[i]);

      if(
        Number.isInteger(n) &&
        n>=1 &&
        n<=18
      ){

        /*
         * 馬名リンクが同じ行にある場合のみ
         * 新しい馬として認識
         */

        const nameMatch=
          line.match(
            /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
          );

        if(nameMatch){

          current={
            number:n,
            past:[]
          };

          result.push(current);

          break;
        }
      }
    }

    if(!current) continue;

    if(!line.includes("|")) continue;

    /*
     * 日付を探す
     */

    let dateIndex=-1;

    for(let i=0;i<c.length;i++){

      if(
        /^\d{4}[\/.]\d{1,2}[\/.]\d{1,2}$/.test(c[i])
      ){

        dateIndex=i;
        break;
      }
    }

    if(dateIndex<0) continue;

    const date=c[dateIndex];

    /*
     * この行が既に同じレースならスキップ
     */

    if(
      current.past.some(
        x=>x.date===date
      )
    ) continue;

    let finish=0;
    let position="";
    let distance=0;
    let surface="";
    let going="";
    let course="";

    /*
     * 日付より後ろの情報を調べる
     */

    const after=
      c.slice(
        dateIndex,
        Math.min(c.length,dateIndex+30)
      );

    for(const value of after){

      /*
       * 着順
       */

      if(
        !finish &&
        /^(?:[1-9]|1[0-8])(?:着)?$/.test(value)
      ){

        finish=
          Number(
            value.replace("着","")
          );
      }

      /*
       * 距離
       */

      const dm=
        value.match(
          /^(芝|ダ|ダート|障)[^\d]{0,3}(\d{3,4})m$/
        );

      if(dm){

        distance=
          Number(dm[2]);

        surface=
          dm[1]==="芝"
          ? "芝"
          : dm[1]==="障"
          ? "障害"
          : "ダート";
      }

      /*
       * 馬場
       */

      if(
        value==="良" ||
        value==="稍重" ||
        value==="重" ||
        value==="不良"
      ){

        going=value;
      }

      /*
       * 通過順位
       */

      if(
        /^\d+(?:-\d+)+$/.test(value)
      ){

        if(!position){
          position=value;
        }
      }
    }

    /*
     * 開催名
     */

    for(const value of after){

      const venues=[
        "札幌",
        "函館",
        "福島",
        "新潟",
        "東京",
        "中山",
        "中京",
        "京都",
        "阪神",
        "小倉"
      ];

      if(
        venues.some(v=>value.includes(v))
      ){

        course=
          venues.find(
            v=>value.includes(v)
          );

        break;
      }
    }

    if(
      finish ||
      position ||
      distance
    ){

      current.past.push({

        date,
        finish,
        position,
        distance,
        surface,
        going,
        course

      });

    }

  }

  /*
   * 各馬最大9走
   */

  result.forEach(x=>{
    x.past=x.past.slice(0,9);
  });

  /*
   * 同じ馬番が複数ブロックとして取れた場合は統合
   */

  const merged=[];

  result.forEach(x=>{

    let target=
      merged.find(
        y=>y.number===x.number
      );

    if(!target){

      target={
        number:x.number,
        past:[]
      };

      merged.push(target);
    }

    x.past.forEach(p=>{

      if(
        !target.past.some(
          q=>q.date===p.date &&
          q.position===p.position
        )
      ){

        target.past.push(p);
      }

    });

  });

  merged.forEach(x=>{
    x.past=x.past.slice(0,9);
  });

  return merged;
}


/* =====================================
   脚質分類
===================================== */

function classify(position){

  if(!position) return "不明";

  const a=
    position
      .split("-")
      .map(Number)
      .filter(Boolean);

  if(!a.length) return "不明";

  const first=a[0];

  if(first===1) return "逃げ";

  if(first<=3) return "先行";

  if(first<=6) return "差し";

  return "追込";
}


/* =====================================
   馬ごとの脚質分析
===================================== */

function analyseHorse(h){

  const races=
    h.past
      .filter(x=>x.position)
      .slice(0,9);

  if(!races.length){

    h.style="不明";
    h.confidence=0;
    h.escapeScore=0;

    return;
  }

  let e=0;
  let f=0;
  let m=0;
  let b=0;

  races.forEach((r,i)=>{

    const weight=
      i===0 ? 6 :
      i===1 ? 5 :
      i===2 ? 4 :
      i===3 ? 3 :
      2;

    const s=
      classify(r.position);

    if(s==="逃げ") e+=weight;
    if(s==="先行") f+=weight;
    if(s==="差し") m+=weight;
    if(s==="追込") b+=weight;

  });

  h.scores={
    escape:e,
    front:f,
    middle:m,
    back:b
  };

  const arr=[
    ["逃げ",e],
    ["先行",f],
    ["差し",m],
    ["追込",b]
  ];

  arr.sort(
    (a,b)=>b[1]-a[1]
  );

  h.style=arr[0][0];

  const total=e+f+m+b;

  h.confidence=
    total
    ? Math.round(arr[0][1]/total*100)
    : 0;

  /*
   * 今回のハナ候補スコア
   */

  h.escapeScore=
    e*2+
    f*.8;

  /*
   * 直近3走の1番手を強く評価
   */

  races.slice(0,3).forEach((r,i)=>{

    const p=
      r.position
        .split("-")
        .map(Number);

    if(p[0]===1){

      h.escapeScore+=
        14-(i*3);
    }

  });

  /*
   * 逃げ経験ゼロ
   */

  if(e===0){

    h.escapeScore*=.3;
  }

}


/* =====================================
   公開脚質情報
===================================== */

function parsePublicStyle(text){

  /*
   * netkeibaのページに
   * 逃・先行・差・追込が記載されている場合、
   * 馬番周辺の情報を補助的に利用。
   */

  horses.forEach(h=>{

    const patterns=[

      new RegExp(
        "\\|\\s*"+h.number+
        "\\s*\\|[^\\n]{0,120}逃"
      ),

      new RegExp(
        h.name+
        "[^\\n]{0,150}逃"
      )

    ];

    for(const p of patterns){

      const m=text.match(p);

      if(!m) continue;

      if(m[0].includes("逃")){
        h.netkeibaGroup="逃げ";
      }

      break;
    }

  });

}


/* =====================================
   今回の隊列決定
===================================== */

function analyseFormation(){

  /*
   * 逃げスコア順
   */

  const sorted=
    [...horses].sort(
      (a,b)=>
        b.escapeScore-a.escapeScore
    );

  if(!sorted.length) return;

  const main=sorted[0];

  /*
   * スコアが極端に低い場合は
   * 「逃げ馬なし」に近い隊列。
   * ただし表示上は最上位を仮のハナ候補とする。
   */

  const second=sorted[1];

  horses.forEach(h=>{

    if(h===main){

      h.group="逃げ";

      return;
    }

    if(
      h.style==="逃げ" ||
      h.style==="先行"
    ){

      h.group="先行";

    }else if(
      h.style==="差し"
    ){

      h.group="中団";

    }else{

      h.group="後方";

    }

  });

  /*
   * 2位との差が小さい場合は
   * ハナ争い候補
   */

  if(second){

    const ratio=
      main.escapeScore
      ? second.escapeScore/
        main.escapeScore
      : 0;

    if(ratio>=.72){

      second.group="逃げ候補";
    }
  }

  /*
   * 逃げ候補が「逃げ」になってしまわないよう整理
   */

  horses.forEach(h=>{

    if(
      h!==main &&
      h.group==="逃げ"
    ){

      h.group="先行";
    }

  });

}


/* =====================================
   逃げ予想表示
===================================== */

function renderEscape(){

  const box=
    document.getElementById("escapeBox");

  const sorted=
    [...horses].sort(
      (a,b)=>
        b.escapeScore-a.escapeScore
    );

  if(!sorted.length){

    box.textContent=
      "逃げ予想を作れませんでした。";

    return;
  }

  const main=sorted[0];

  const candidates=
    sorted.slice(1,4);

  let html=`

    <div class="secondary">
      今回のハナ予想
    </div>

    <div class="main-escape">
      ◎ ${main.number}番 ${main.name}
    </div>

    <div>
      逃げスコア：
      ${main.escapeScore.toFixed(1)}
    </div>

    <div class="secondary">
      過去脚質：${main.style}
      ／脚質信頼度：${main.confidence}%
    </div>

    <div style="margin-top:10px">
      <strong>ハナ争い候補</strong>
    </div>
  `;

  candidates.forEach((h,i)=>{

    html+=`
      <div>
        ${["○","▲","△"][i] || "△"}
        ${h.number}番 ${h.name}
        <span class="secondary">
          (${h.escapeScore.toFixed(1)})
        </span>
      </div>
    `;

  });

  box.innerHTML=html;
}

function renderFormation(){

  const groups=[
    ["逃げ","escape"],

    ["先行","front"],
    ["中団","middle"],
    ["後方","back"]
  ];

  let html="";

  groups.forEach(([name,cls])=>{

    const arr=
      horses.filter(

    if(!arr.length) return;

    html+=`
      <div class="formation-line">
        <span class="group ${cls}">
          ${name}
        </span>

        ${arr.map(h=>
          `${h.number} ${h.name}`
        ).join(" ／ ")}

  document.getElementById(
    "formation"
  ).innerHTML=html;
}

/* =====================================
   通常コース
===================================== */

function drawOval(){

  const svg=
    document.getElementById("courseSvg");

  /*
   * 競馬場ごとに若干形を変える
   */

  let left=180;
  let right=720;
  let top=100;
  let bottom=460;

  if(raceInfo.venue==="東京"){

    left=150;
    right=750;
    top=110;
    bottom=450;

  }else if(raceInfo.venue==="中山"){

    left=190;
    right=710;
    top=90;
    bottom=470;

  }else if(raceInfo.venue==="福島" ||
           raceInfo.venue==="小倉"){

    left=205;
    right=695;
    top=115;
    bottom=445;

  }

  const cx=450;
  const cy=280;
  const rx=(right-left)/2;
  const ry=(bottom-top)/2;

  /*
   * 反時計回りの楕円。
   * SVG上では見た目として競馬場らしい
   * 左回りコースを作る。
   */

  const d=`

    M ${left} ${cy}

    C ${left} ${top},
      ${cx-rx*.35} ${top},
      ${cx} ${top}

    C ${cx+rx*.35} ${top},
      ${right} ${top},
      ${right} ${cy}

    C ${right} ${bottom},
      ${cx+rx*.35} ${bottom},
      ${cx} ${bottom}

    C ${cx-rx*.35} ${bottom},
      ${left} ${bottom},
      ${left} ${cy}

  `;

  /*
   * START位置を距離で変える。
   * 短距離ほど1角までの距離を長くする。
   */

  let startFraction=.08;

  if(raceInfo.distance<=1200){
    startFraction=.02;
  }else if(raceInfo.distance<=1400){
    startFraction=.07;
  }else if(raceInfo.distance<=1600){
    startFraction=.12;
  }else if(raceInfo.distance<=1800){
    startFraction=.18;
  }else if(raceInfo.distance<=2000){
    startFraction=.25;
  }else{
    startFraction=.35;
  }

  svg.innerHTML=`

    <path
      id="coursePath"
      d="${d}"
      class="trackOuter"
    />

    <path
      d="${d}"
      class="trackInner"
    />

    <path
      d="${d}"
      class="rail"
    />

    <g id="markers"></g>

    <g id="horseLayer"></g>
  `;

  const path=
    document.getElementById(
      "coursePath"
    );

  const length=
    path.getTotalLength();

  courseState={
    type:"oval",
    path,
    length,
    startFraction
  };

  drawMarkers();

  createTokens();

}


/* =====================================
   マーカー
===================================== */

function drawMarkers(){

  const svg=
    document.getElementById("courseSvg");

  const layer=
    document.getElementById("markers");

  if(!layer) return;

  const path=courseState.path;
  const len=courseState.length;

  /*
   * 3角・4角をコース上の割合で定義
   */

  const start=
    courseState.startFraction;

  const pStart=
    path.getPointAtLength(
      len*start
    );

  const p3=
    path.getPointAtLength(
      len*.48
    );

  const p4=
    path.getPointAtLength(
      len*.73
    );

  const pGoal=
    path.getPointAtLength(
      len*(start+.12>1 ? 1 : start+.12)
    );

  /*
   * 実際の走行方向に合わせ、
   * GOALはSTART直後の位置に置く。
   */

  layer.innerHTML=`

    <circle
      cx="${pStart.x}"
      cy="${pStart.y}"
      r="7"
      class="marker"
    />

    <text
      x="${pStart.x}"
      y="${pStart.y-18}"
      class="markerText"
      text-anchor="middle"
    >
      START
    </text>

    <circle
      cx="${p3.x}"
      cy="${p3.y}"
      r="7"
      class="marker"
    />

    <text
      x="${p3.x+10}"
      y="${p3.y-10}"
      class="markerText"
    >
      3C
    </text>

    <circle
      cx="${p4.x}"
      cy="${p4.y}"
      r="7"
      class="marker"
    />

    <text
      x="${p4.x+10}"
      y="${p4.y+25}"
      class="markerText"
    >
      4C
    </text>

    <circle
      cx="${pGoal.x}"
      cy="${pGoal.y}"
      r="7"
      class="marker"
    />

    <text
      x="${pGoal.x}"
      y="${pGoal.y+30}"
      class="markerText"
      text-anchor="middle"
    >
      GOAL
    </text>

  `;
}

/* =====================================
   隊列位置
===================================== */

function groupValue(h){

  if(h.group==="逃げ") return 0;
  if(h.group==="逃げ候補") return .02;
  if(h.group==="先行") return .05;
  if(h.group==="中団") return .11;
  return .17;
}


function sameGroupOffset(h){

  const same=
    horses.filter(
      x=>x.group===h.group
    );

  const i=
    same.indexOf(h);

  return i-
    (same.length-1)/2;
}


/* =====================================
   馬をコース上に配置
===================================== */

function positionHorse(h,progress){

  const layer=
    document.getElementById(
      "horseLayer"
    );

  if(!layer) return;

  const index=
    horses.indexOf(h);

  const token=
    layer.children[index];

  if(!token) return;

  /*
   * 直線
   */

  if(courseState.type==="straight"){

    const rank=
      groupValue(h);

    const offset=
      sameGroupOffset(h);

    /*
     * スタート時点で隊列を作る
     */

    const start=
      courseState.startX+
      rank*35+
      offset*16;

    const x=
      start+
      (
        courseState.goalX-start
      )*progress;

    const y=
      courseState.y+
      offset*20;

    token.setAttribute(
      "transform",
      `translate(${x},${y})`
    );

    return;
  }


  /*
   * 楕円
   */

  const path=
    courseState.path;

  const len=
    courseState.length;

  /*
   * 競馬の展開らしく
   * スタート直後は隊列差を大きくし、
   * 3角→4角で徐々に詰める。
   */

  let p;

  const start=
    courseState.startFraction;

  /*
   * スタート位置から
   * ゴール直前まで一周する。
   */

  let raceFraction=
    start+
    progress*
    (1-start);

  /*
   * 位置取りによる前後差
   */

  const groupGap=
    groupValue(h);

  /*
   * 前半は差を維持
   */

  if(progress<.55){

    raceFraction-=groupGap*.35;

  }else if(progress<.78){

    /*
     * 3角〜4角
     * 差を少し詰める
     */

    raceFraction-=groupGap*.18;

  }else{

    /*
     * 直線
     * 後方馬が伸びる余地
     */

    raceFraction-=groupGap*.05;
  }

  /*
   * 同じ隊列内の横方向
   */

  const offset=
    sameGroupOffset(h);

  const point=
    path.getPointAtLength(
      len*
      (
        ((raceFraction%1)+1)%1
      )
    );

  /*
   * コース幅方向に少し散らす
   */

  const spread=
    9+
    groupGap*20;

  /*
   * コース接線の近似
   */

  const ahead=
    path.getPointAtLength(
      len*
      (
        (((raceFraction+.002)%1)+1)%1
      )
    );

  const dx=
    ahead.x-point.x;

  const dy=
    ahead.y-point.y;

  const mag=
    Math.sqrt(dx*dx+dy*dy)||1;

  const nx=
    -dy/mag;

  const ny=
    dx/mag;

  const x=
    point.x+
    nx*offset*spread;

  const y=
    point.y+
    ny*offset*spread;

  token.setAttribute(
    "transform",
    `translate(${x},${y})`
  );

}


/* =====================================
   全馬更新
===================================== */

function update(){

  horses.forEach(
    h=>
      positionHorse(
        h,
        animation.progress
      )
  );
}


/* =====================================
   アニメーション
===================================== */

function play(){

  if(animation.running) return;

  animation.running=true;

  const duration=13000;

  const startProgress=
    animation.progress;

  animation.start=
    performance.now()-
    (
      startProgress*
      duration/
      animation.speed
    );

  function frame(now){

    if(!animation.running) return;

    const elapsed=
      now-animation.start;

    animation.progress=
      Math.min(
        1,
        elapsed/
        duration*
        animation.speed
      );

    update();

    if(animation.progress>=1){

      animation.running=false;

      return;
    }

    animation.frame=
      requestAnimationFrame(frame);
  }

  animation.frame=
    requestAnimationFrame(frame);
}


function pause(){

  animation.running=false;

  if(animation.frame){

    cancelAnimationFrame(
      animation.frame
    );
  }
}


function reset(){

  pause();

  animation.progress=0;

  update();
}


function speed(v){

  animation.speed=v;

}
