<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.7</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:16px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  margin:0 0 4px;
  font-size:24px;
}

.version{
  display:inline-block;
  background:#222;
  color:#fff;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:16px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

label{
  font-size:12px;
  color:#666;
}

input,select,button{
  font:inherit;
}

input,select{
  padding:9px 10px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fff;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button:active{
  opacity:.7;
}

button.raceBtn{
  min-width:58px;
  background:#e9edf1;
  color:#222;
  margin:4px;
}

button.raceBtn.selected{
  background:#222;
  color:#fff;
}

#status{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  background:#f0f2f4;
  font-size:13px;
  white-space:pre-wrap;
}

.raceInfo{
  font-size:14px;
  line-height:1.7;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  border-bottom:1px solid #e5e5e5;
  padding:9px 7px;
  text-align:left;
  white-space:nowrap;
  font-size:13px;
}

th{
  background:#f5f6f7;
  font-weight:700;
}

td.num{
  text-align:center;
  font-weight:bold;
}

.odds{
  font-weight:bold;
}

.debug{
  background:#111;
  color:#0f0;
  padding:12px;
  border-radius:8px;
  font-family:monospace;
  font-size:11px;
  line-height:1.5;
  white-space:pre-wrap;
  max-height:350px;
  overflow:auto;
}

.empty{
  color:#777;
  padding:20px 0;
}
</style>
</head>

<body>

<div class="container">

  <h1>競馬展開ラボ</h1>
  <div class="version">v0.7 開発版</div>

  <div class="card">
    <h2>開催日を選択</h2>

    <div class="row">
      <div class="field">
        <label>日付</label>
        <input type="date" id="raceDate">
      </div>

      <button onclick="loadMeeting()">
        開催情報を取得
      </button>
    </div>

    <div id="status">待機中</div>
  </div>

  <div class="card">
    <h2>レース選択</h2>
    <div id="raceButtons" class="empty">
      まず開催情報を取得してください。
    </div>
  </div>

  <div class="card">
    <h2>出馬表</h2>

    <div id="raceInfo" class="raceInfo">
      レースを選択してください。
    </div>

    <div id="horseArea" class="empty">
      -
    </div>
  </div>

  <div class="card">
    <h2>取得デバッグ</h2>
    <div id="debug" class="debug">まだ取得していません。</div>
  </div>

</div>

<script>

const state = {
  raceIds: [],
  horses: [],
  selectedRaceId: null
};

function $(id){
  return document.getElementById(id);
}

function logDebug(text){
  const box = $("debug");

  if(box.textContent === "まだ取得していません。"){
    box.textContent = "";
  }

  box.textContent += text + "\n";
  box.scrollTop = box.scrollHeight;

  console.log(text);
}

function clearDebug(){
  $("debug").textContent = "";
}

function setStatus(text){
  $("status").textContent = text;
}

/*
==================================================
Jina Reader
==================================================
*/

async function jinaHtmlFetch(url){

  const readerUrl =
    "https://r.jina.ai/" + url;

  logDebug("Jina HTML取得:");
  logDebug(readerUrl);

  const response = await fetch(readerUrl,{
    method:"GET",
    headers:{
      "X-Respond-With":"html",
      "X-Engine":"browser",
      "X-Timeout":"20"
    }
  });

  if(!response.ok){
    throw new Error(
      "Jina HTTP " + response.status
    );
  }

  const text = await response.text();

  logDebug(
    "HTML取得成功: " +
    text.length +
    "文字"
  );

  return text;
}


/*
==================================================
開催情報取得
==================================================
*/

async function loadMeeting(){

  clearDebug();

  const date =
    $("raceDate").value.replace(/-/g,"");

  if(!date){
    alert("日付を選択してください");
    return;
  }

  setStatus("開催情報を取得中...");

  try{

    const url =
      "https://race.netkeiba.com/top/race_list.html?kaisai_date="
      + date;

    const html =
      await jinaHtmlFetch(url);

    logDebug(
      "開催HTML解析開始"
    );

    const ids =
      [
        ...html.matchAll(
          /race_id=(\d{12})/g
        )
      ]
      .map(x=>x[1]);

    state.raceIds =
      [...new Set(ids)];

    logDebug(
      "検出race_id数: " +
      state.raceIds.length
    );

    if(state.raceIds.length === 0){

      setStatus(
        "レース情報を取得できませんでした。"
      );

      return;
    }

    renderRaceButtons();

    setStatus(
      "開催情報取得成功\n" +
      state.raceIds.length +
      "レース検出"
    );

  }catch(error){

    console.error(error);

    logDebug(
      "ERROR: " +
      error.message
    );

    setStatus(
      "開催情報の取得に失敗しました。\n" +
      error.message
    );
  }
}


/*
==================================================
レースボタン
==================================================
*/

function renderRaceButtons(){

  const area =
    $("raceButtons");

  area.innerHTML = "";

  state.raceIds.forEach(
    (id,index)=>{

      const raceNo =
        ((index % 12)+1) + "R";

      const button =
        document.createElement("button");

      button.className =
        "raceBtn";

      button.textContent =
        raceNo;

      button.onclick =
        ()=>selectRace(id,button);

      area.appendChild(button);
    }
  );
}


/*
==================================================
レース取得
==================================================
*/

async function selectRace(id,button){

  state.selectedRaceId = id;

  document
    .querySelectorAll(".raceBtn")
    .forEach(b=>
      b.classList.remove("selected")
    );

  if(button){
    button.classList.add("selected");
  }

  $("horseArea").innerHTML =
    '<div class="empty">出馬表取得中...</div>';

  setStatus(
    "出馬表を取得中..."
  );

  clearDebug();

  try{

    const url =
      "https://race.netkeiba.com/race/shutuba.html?race_id="
      + id;

    logDebug(
      "対象race_id: " + id
    );

    const html =
      await jinaHtmlFetch(url);

    logDebug(
      "出馬表HTML取得成功"
    );

    /*
    HTMLそのものをDOM解析
    */
    const parser =
      new DOMParser();

    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );

    logDebug(
      "table数: " +
      doc.querySelectorAll("table").length
    );

    logDebug(
      "horse link数: " +
      doc.querySelectorAll(
        'a[href*="/horse/"]'
      ).length
    );

    const horses =
      parseHorseTable(doc);

    state.horses =
      horses;

    logDebug(
      "最終取得頭数: " +
      horses.length
    );

    logDebug(
      "取得馬番: " +
      horses.map(h=>h.number).join(",")
    );

    if(horses.length === 0){

      $("horseArea").innerHTML =
        '<div class="empty">出馬表を解析できませんでした。</div>';

      setStatus(
        "取得は成功しましたが、馬データを解析できませんでした。"
      );

      return;
    }

    renderRaceInfo(doc,id);

    renderHorses(horses);

    setStatus(
      "出馬表取得成功\n" +
      horses.length +
      "頭"
    );

  }catch(error){

    console.error(error);

    logDebug(
      "ERROR: " +
      error.message
    );

    $("horseArea").innerHTML =
      '<div class="empty">取得失敗</div>';

    setStatus(
      "出馬表の取得に失敗しました。\n" +
      error.message
    );
  }
}


/*
==================================================
出馬表解析
==================================================

MarkdownではなくHTMLの<tr>単位で見る。

netkeibaの出馬表は
「馬番」「馬名」「性齢」「斤量」
「騎手」「厩舎」「馬体重」「人気」
などを含む行を持つため、

1. trを全部見る
2. その中にhorseリンクがあるか確認
3. 行内のtd/thを取得
4. 馬番を探す
5. 馬名をhorseリンクから取得

という順番にする。
==================================================
*/

function parseHorseTable(doc){

  const result = [];
  const seen = new Set();

  const rows =
    [
      ...doc.querySelectorAll("tr")
    ];

  logDebug(
    "tr数: " + rows.length
  );

  for(const row of rows){

    const horseLink =
      row.querySelector(
        'a[href*="/horse/"]'
      );

    if(!horseLink){
      continue;
    }

    /*
    馬名
    */
    let name =
      cleanText(
        horseLink.textContent
      );

    /*
    horseリンク内に画像しかない場合、
    title / altも確認
    */
    if(!name){

      name =
        cleanText(
          horseLink.getAttribute("title") || ""
        );
    }

    if(!name){

      const img =
        horseLink.querySelector("img");

      if(img){
        name =
          cleanText(
            img.getAttribute("alt") || ""
          );
      }
    }

    /*
    行内セル
    */
    const cells =
      [
        ...row.querySelectorAll(
          "th,td"
        )
      ];

    const cellTexts =
      cells.map(
        c=>cleanText(c.textContent)
      );

    /*
    馬番を探す
    */

    let number = null;

    for(let i=0;i<cellTexts.length;i++){

      const value =
        cellTexts[i];

      /*
      1〜18だけを馬番候補にする
      */
      if(
        /^\d{1,2}$/.test(value)
      ){

        const n =
          Number(value);

        if(n>=1 && n<=18){

          /*
          枠番と馬番が両方あるため、
          horse linkに近い数字を優先。
          */

          number = n;

          /*
          直前セルも確認
          */
          if(i>0){

            const prev =
              Number(cellTexts[i-1]);

            if(
              Number.isInteger(prev) &&
              prev>=1 &&
              prev<=8
            ){
              /*
              ここは枠番の可能性がある。
              現在のnを馬番として維持。
              */
            }
          }

          break;
        }
      }
    }

    /*
    馬名が取れなかった場合は
    この行を無理に登録しない
    */
    if(!name){
      logDebug(
        "馬名取得失敗行: " +
        cellTexts.join(" / ")
      );
      continue;
    }

    /*
    馬番がない場合は行の前半から探索
    */
    if(number === null){

      for(
        let i=0;
        i<Math.min(6,cellTexts.length);
        i++
      ){

        const m =
          cellTexts[i].match(
            /(?:^|\s)(1[0-8]|[1-9])(?:\s|$)/
          );

        if(m){

          number =
            Number(m[1]);

          break;
        }
      }
    }

    if(number === null){

      logDebug(
        "馬番取得失敗: " +
        name
      );

      continue;
    }

    if(seen.has(number)){
      continue;
    }

    /*
    性齢
    */
    let sexAge = "";

    for(const t of cellTexts){

      if(
        /^[牡牝セ]\d{1,2}$/.test(t)
      ){
        sexAge = t;
        break;
      }
    }

    /*
    斤量
    */
    let weight = "";

    for(const t of cellTexts){

      if(
        /^\d{2}(?:\.\d)?$/.test(t)
      ){

        const n =
          Number(t);

        if(n>=45 && n<=65){

          weight=t;
          break;
        }
      }
    }

    /*
    騎手
    */
    let jockey = "";

    const jockeyLink =
      row.querySelector(
        'a[href*="/jockey/"]'
      );

    if(jockeyLink){

      jockey =
        cleanText(
          jockeyLink.textContent
        );
    }

    /*
    厩舎
    */
    let stable = "";

    const stableLink =
      row.querySelector(
        'a[href*="/trainer/"]'
      );

    if(stableLink){

      stable =
        cleanText(
          stableLink.textContent
        );
    }

    /*
    オッズ
    */

    let odds = "";

    const rowText =
      cellTexts.join(" ");

    /*
    「オッズ」らしい数字を探す。
    ただし今回は無理に誤った数字を
    入れないようにする。
    */

    const oddsCandidates =
      rowText.match(
        /\b\d+\.\d\b/g
      ) || [];

    if(oddsCandidates.length){

      /*
      まず明らかな体重・斤量を除外。
      それでも複数ある場合は
      最後の候補を仮採用。
      */
      for(
        let i=oddsCandidates.length-1;
        i>=0;
        i--
      ){

        const candidate =
          oddsCandidates[i];

        const n =
          Number(candidate);

        if(
          n>=1.0 &&
          n<=9999
        ){

          odds =
            candidate;

          break;
        }
      }
    }

    const horse = {
      number,
      name,
      sexAge,
      weight,
      jockey,
      stable,
      odds,
      cells:cellTexts
    };

    result.push(horse);
    seen.add(number);

    logDebug(
      "取得: " +
      number +
      " " +
      name +
      " odds=" +
      (odds || "-")
    );
  }

  /*
  馬番順
  */
  result.sort(
    (a,b)=>
      a.number-b.number
  );

  return result;
}


/*
==================================================
レース情報
==================================================
*/

function renderRaceInfo(doc,id){

  let title =
    cleanText(
      doc.title || ""
    );

  /*
  netkeibaタイトルから余計な部分を削る
  */
  if(!title){
    title =
      "race_id " + id;
  }

  $("raceInfo").innerHTML =
    "<b>" +
    escapeHtml(title) +
    "</b><br>" +
    "race_id: " +
    escapeHtml(id);
}


/*
==================================================
馬表示
==================================================
*/

function renderHorses(horses){

  if(!horses.length){

    $("horseArea").innerHTML =
      '<div class="empty">馬データなし</div>';

    return;
  }

  let html = "";

  html +=
    '<div class="tableWrap">';

  html +=
    '<table>';

  html +=
    '<thead>' +
    '<tr>' +
    '<th>馬番</th>' +
    '<th>馬名</th>' +
    '<th>性齢</th>' +
    '<th>斤量</th>' +
    '<th>騎手</th>' +
    '<th>厩舎</th>' +
    '<th>オッズ</th>' +
    '</tr>' +
    '</thead>';

  html += "<tbody>";

  for(const h of horses){

    html +=
      "<tr>" +

      '<td class="num">' +
      escapeHtml(String(h.number)) +
      "</td>" +

      "<td><b>" +
      escapeHtml(h.name) +
      "</b></td>" +

      "<td>" +
      escapeHtml(h.sexAge || "-") +
      "</td>" +

      "<td>" +
      escapeHtml(h.weight || "-") +
      "</td>" +

      "<td>" +
      escapeHtml(h.jockey || "-") +
      "</td>" +

      "<td>" +
      escapeHtml(h.stable || "-") +
      "</td>" +

      '<td class="odds">' +
      escapeHtml(h.odds || "-") +
      "</td>" +

      "</tr>";
  }

  html += "</tbody>";
  html += "</table>";
  html += "</div>";

  $("horseArea").innerHTML =
    html;
}


/*
==================================================
文字処理
==================================================
*/

function cleanText(value){

  return String(value || "")
    .replace(/\s+/g," ")
    .replace(/\u00a0/g," ")
    .trim();
}

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/*
==================================================
初期設定
==================================================
*/

(function(){

  const now =
    new Date();

  const yyyy =
    now.getFullYear();

  const mm =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const dd =
    String(
      now.getDate()
    ).padStart(2,"0");

  $("raceDate").value =
    yyyy + "-" + mm + "-" + dd;

})();

</script>

</body>
</html>
