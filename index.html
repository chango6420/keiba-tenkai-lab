<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>競馬展開ラボ v0.5</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #999;
    margin-bottom: 25px;
}

.panel {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 6px;
}

select,
input,
button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    font-size: 15px;
}

button {
    background: #2b6cff;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #111;
    color: #aaa;
    white-space: pre-wrap;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #333;
    text-align: center;
}

th {
    background: #222;
    color: #aaa;
    font-size: 13px;
}

td {
    font-size: 14px;
}

.horse-name {
    font-weight: bold;
    text-align: left;
}

.success {
    color: #55d98a;
}

.error {
    color: #ff6b6b;
}

.small {
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}

@media (max-width: 700px) {
    .controls {
        grid-template-columns: 1fr;
    }

    body {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>競馬展開ラボ v0.5</h1>

    <div class="subtitle">
        netkeiba 出馬表自動取得テスト
    </div>

    <div class="panel">

        <h2>① レース選択</h2>

        <div class="controls">

            <div>
                <label>開催日</label>
                <input
                    type="date"
                    id="raceDate"
                >
            </div>

            <div>
                <label>競馬場</label>
                <select id="course">
                    <option value="01">札幌</option>
                    <option value="02">函館</option>
                    <option value="03">福島</option>
                    <option value="04">新潟</option>
                    <option value="05">東京</option>
                    <option value="06">中山</option>
                    <option value="07">中京</option>
                    <option value="08">京都</option>
                    <option value="09">阪神</option>
                    <option value="10">小倉</option>
                </select>
            </div>

            <div>
                <label>レース番号</label>
                <select id="raceNo">
                    <option value="01">1R</option>
                    <option value="02">2R</option>
                    <option value="03">3R</option>
                    <option value="04">4R</option>
                    <option value="05">5R</option>
                    <option value="06">6R</option>
                    <option value="07">7R</option>
                    <option value="08">8R</option>
                    <option value="09">9R</option>
                    <option value="10">10R</option>
                    <option value="11">11R</option>
                    <option value="12">12R</option>
                </select>
            </div>

        </div>

        <br>

        <button onclick="loadRace()">
            netkeibaから出馬表を取得
        </button>

        <div id="status" class="status">
            待機中
        </div>

        <div class="small">
            ※ v0.5では公開されている出馬表データのみを取得します。
        </div>

    </div>


    <div class="panel">

        <h2>② 取得結果</h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>枠</th>
                        <th>馬番</th>
                        <th>馬名</th>
                        <th>性齢</th>
                        <th>斤量</th>
                        <th>騎手</th>
                        <th>調教師</th>
                    </tr>

                </thead>

                <tbody id="horseTable">

                    <tr>
                        <td colspan="7">
                            まだデータがありません
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:8000/api/race";


function setStatus(message, type = "") {

    const status = document.getElementById("status");

    status.textContent = message;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }
}


function getRaceData() {

    const date =
        document.getElementById("raceDate").value;

    const course =
        document.getElementById("course").value;

    const raceNo =
        document.getElementById("raceNo").value;

    return {
        date,
        course,
        raceNo
    };
}


async function loadRace() {

    const data = getRaceData();

    if (!data.date) {

        setStatus(
            "開催日を入力してください。",
            "error"
        );

        return;
    }


    setStatus(
        "netkeibaからデータを取得しています..."
    );


    document.getElementById("horseTable").innerHTML = `
        <tr>
            <td colspan="7">
                取得中...
            </td>
        </tr>
    `;


    try {

        const params = new URLSearchParams({
            date: data.date,
            course: data.course,
            raceNo: data.raceNo
        });


        const response = await fetch(
            `${API_URL}?${params.toString()}`
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const result = await response.json();


        if (!result.success) {

            throw new Error(
                result.error || "取得に失敗しました"
            );

        }


        renderHorses(result.horses);


        setStatus(
            `取得成功\n${result.horses.length}頭を取得しました。`,
            "success"
        );


        console.log(
            "取得データ:",
            result
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "取得失敗\n\n" +
            error.message +
            "\n\n" +
            "Pythonサーバーが起動しているか確認してください。",
            "error"
        );


        document.getElementById("horseTable").innerHTML = `
            <tr>
                <td colspan="7">
                    データ取得に失敗しました
                </td>
            </tr>
        `;

    }

}


function renderHorses(horses) {

    const tbody =
        document.getElementById("horseTable");


    if (!horses || horses.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    出馬表データがありません
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    horses.forEach(horse => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>${escapeHtml(horse.frame)}</td>

            <td>${escapeHtml(horse.number)}</td>

            <td class="horse-name">
                ${escapeHtml(horse.name)}
            </td>

            <td>${escapeHtml(horse.sexAge)}</td>

            <td>${escapeHtml(horse.weight)}</td>

            <td>${escapeHtml(horse.jockey)}</td>

            <td>${escapeHtml(horse.trainer)}</td>

        `;


        tbody.appendChild(tr);

    });

}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
 * 今日の日付を初期値にする
 */

(function init() {

    const today =
        new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(today.getMonth() + 1)
            .padStart(2, "0");

    const dd =
        String(today.getDate())
            .padStart(2, "0");


    document.getElementById("raceDate").value =
        `${yyyy}-${mm}-${dd}`;

})();

</script>

</body>
</html>
