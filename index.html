<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.5.1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#1f2937;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.header{
  background:#111827;
  color:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.header h1{
  margin:0 0 6px;
  font-size:22px;
}

.badge{
  display:inline-block;
  background:#2563eb;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
}

.card{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  font-weight:bold;
}

input,
select,
button{
  width:100%;
  min-height:44px;
  border-radius:9px;
  border:1px solid #d1d5db;
  background:white;
  padding:10px;
  font-size:15px;
}

button{
  margin-top:12px;
  background:#2563eb;
  color:white;
  border:0;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.status{
  padding:12px;
  border-radius:9px;
  background:#eef2ff;
  white-space:pre-wrap;
  font-size:13px;
}

.status.ok{
  background:#ecfdf5;
  color:#065f46;
}

.status.error{
  background:#fef2f2;
  color:#991b1b;
}

.result-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.horse{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.horse-name{
  font-weight:bold;
}

.horse-data{
  margin-top:4px;
  font-size:12px;
  color:#4b5563;
  line-height:1.5;
}

.raw{
  margin-top:10px;
  background:#111827;
  color:#e5e7eb;
  padding:10px;
  border-radius:8px;
  overflow:auto;
  font-size:11px;
  max-height:350px;
  white-space:pre-wrap;
}

.small{
  font-size:11px;
  color:#6b7280;
  line-height:1.6;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>
    競馬展開ラボ
    <span class="badge">v0.5.1 NETKEIBA TEST</span>
  </h1>

  <div style="font-size:12px;color:#cbd5e1;">
    Jina Reader経由・netkeiba取得テスト
  </div>
</div>


<div class="card">

  <div class="grid">

    <div>
      <label>日付</label>
      <input id="raceDate" type="date">
    </div>

    <div>
      <label>開催</label>
      <select id="venue">
        <option value="">まず開催を取得</option>
      </select>
    </div>

  </div>

  <button id="getVenues">
    ① 開催を取得
  </button>


  <div style="margin-top:12px;">

    <label>レース</label>

    <select id="raceSelect" disabled>
      <option value="">開催を選択してください</option>
    </select>

  </div>

  <button id="getRace" disabled>
    ② 出馬表を取得
  </button>

</div>


<div id="status" class="card status">
待機中
</div>


<div id="result" class="card" style="display:none;">
</div>


<div class="card small">

<b>v0.5.1について</b><br><br>

今回の目的は、まずnetkeibaのページを取得できるか確認することです。<br><br>

① 日付を選択<br>
② 開催を取得<br>
③ 開催を選択<br>
④ レースを選択<br>
⑤ 出馬表を取得<br><br>

取得成功後に、馬番・馬名・斤量・騎手・オッズなどを自動入力する版へ進みます。

</div>

</div>


<script>

const $ = id => document.getElementById(id);

const raceDate = $("raceDate");
const venue = $("venue");
const raceSelect = $("raceSelect");
const getVenues = $("getVenues");
const getRace = $("getRace");
const status = $("status");
const result = $("result");


// ------------------------------------
// 初期日付
// ------------------------------------

const today = new Date();

raceDate.value =
  today.getFullYear() +
  "-" +
  String(today.getMonth()+1).padStart(2,"0") +
  "-" +
  String(today.getDate()).padStart(2,"0");


// ------------------------------------
// 共通
// ------------------------------------

function clean(text){

  return (text || "")
    .replace(/\s+/g," ")
    .trim();

}


function setStatus(text,type=""){

  status.textContent = text;

  status.className = "card status";

  if(type){
    status.classList.add(type);
  }

}


// ------------------------------------
// netkeiba URL
// ------------------------------------

function getDayURL(date){

  const d =
    date.replace(/-/g,"");

  return (
    "https://race.netkeiba.com/top/race_list.html" +
    "?kaisai_date=" +
    d
  );

}


function getRaceURL(raceId){

  return (
    "https://race.netkeiba.com/race/shutuba.html" +
    "?race_id=" +
    raceId
  );

}


// ------------------------------------
// Jina Reader
// ------------------------------------

function jinaURL(url){

  return (
    "https://r.jina.ai/" +
    url
  );

}


async function fetchJina(url){

  const response =
    await fetch(
      jinaURL(url),
      {
        method:"GET",
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "Jina HTTP " +
      response.status
    );

  }

  return await response.text();

}


// ------------------------------------
// race_id抽出
// ------------------------------------

function extractRaceIds(text){

  const regex =
    /race_id=(\d{12})/g;

  const ids = [];

  let match;

  while(
    (match = regex.exec(text)) !== null
  ){

    if(!ids.includes(match[1])){

      ids.push(match[1]);

    }

  }

  return ids;

}


// ------------------------------------
// レース情報を周辺テキストから作る
// ------------------------------------

function makeRaceList(text){

  const ids =
    extractRaceIds(text);

  return ids.map((id,index)=>{

    const pos =
      text.indexOf(id);

    let around =
      "";

    if(pos >= 0){

      around =
        text.substring(
          Math.max(0,pos-180),
          Math.min(text.length,pos+180)
        );

    }

    const raceMatch =
      around.match(/(\d{1,2})R/);

    const raceNumber =
      raceMatch
        ? raceMatch[1]
        : String(index+1);

    const venueMatch =
      around.match(
        /(札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉)/
      );

    const venueName =
      venueMatch
        ? venueMatch[1]
        : "開催";

    return {

      id:id,

      number:raceNumber,

      venue:venueName,

      text:clean(around)

    };

  });

}


// ------------------------------------
// ① 開催取得
// ------------------------------------

async function loadVenues(){

  const date =
    raceDate.value;

  if(!date){

    setStatus(
      "日付を選択してください。",
      "error"
    );

    return;

  }


  venue.innerHTML =
    '<option value="">取得中...</option>';

  raceSelect.innerHTML =
    '<option value="">開催を選択してください</option>';

  raceSelect.disabled = true;

  getRace.disabled = true;


  setStatus(
    "Jina Reader経由でnetkeibaを取得中...\n少し待ってください。"
  );


  try{

    const url =
      getDayURL(date);

    const text =
      await fetchJina(url);


    if(!text){

      throw new Error(
        "空のデータが返りました。"
      );

    }


    const races =
      makeRaceList(text);


    if(!races.length){

      throw new Error(
        "ページは取得できましたが、race_idを認識できませんでした。"
      );

    }


    // 開催ごとに分類

    const venueMap = {};


    races.forEach(race=>{

      if(!venueMap[race.venue]){

        venueMap[race.venue] = [];

      }

      venueMap[race.venue].push(race);

    });


    venue.innerHTML =
      '<option value="">開催を選択</option>';


    Object.keys(venueMap)
      .forEach(name=>{

        const option =
          document.createElement("option");

        option.value =
          name;

        option.textContent =
          name +
          "（" +
          venueMap[name].length +
          "レース）";

        option.dataset.races =
          JSON.stringify(
            venueMap[name]
          );

        venue.appendChild(option);

      });


    // 開催が正確に判定できなかった場合でも
    // 「取得成功」として候補を表示

    setStatus(
      "netkeibaページの取得に成功しました！\n" +
      "race_idを " +
      races.length +
      "件 認識しました。\n\n" +
      "開催を選択してください。",
      "ok"
    );


    // デバッグ情報

    result.innerHTML =
      '<div class="result-title">' +
      "取得確認" +
      "</div>" +

      "<p>" +
      "認識したrace_id：" +
      races.length +
      "件" +
      "</p>" +

      '<details>' +
      "<summary>取得したデータを確認</summary>" +
      '<div class="raw">' +
      text.substring(0,10000) +
      "</div>" +
      "</details>";


    result.style.display =
      "block";


  }catch(error){

    setStatus(
      "取得失敗\n\n" +
      error.message,
      "error"
    );


    result.innerHTML =
      '<div class="result-title">' +
      "取得エラー詳細" +
      "</div>" +

      "<p>" +
      error.message +
      "</p>";


    result.style.display =
      "block";

  }

}


// ------------------------------------
// 開催選択
// ------------------------------------

venue.addEventListener(
  "change",
  function(){

    raceSelect.innerHTML =
      '<option value="">レースを選択</option>';

    raceSelect.disabled =
      true;

    getRace.disabled =
      true;


    const option =
      venue.options[
        venue.selectedIndex
      ];


    if(!option.dataset.races){

      return;

    }


    let races;

    try{

      races =
        JSON.parse(
          option.dataset.races
        );

    }catch{

      return;

    }


    races.sort(
      (a,b)=>
        Number(a.number) -
        Number(b.number)
    );


    races.forEach(race=>{

      const option =
        document.createElement("option");

      option.value =
        race.id;

      option.textContent =
        race.number +
        "R";

      raceSelect.appendChild(
        option
      );

    });


    raceSelect.disabled =
      false;

  }
);


// ------------------------------------
// レース選択
// ------------------------------------

raceSelect.addEventListener(
  "change",
  function(){

    getRace.disabled =
      !raceSelect.value;

  }
);


// ------------------------------------
// 馬名抽出
// ------------------------------------

function extractHorseNames(text){

  const names = [];

  // markdownリンク形式
  const linkRegex =
    /\[([^\]]+)\]\(https?:\/\/[^)]*\/horse\/[^)]*\)/g;

  let match;

  while(
    (match = linkRegex.exec(text)) !== null
  ){

    const name =
      clean(match[1]);

    if(
      name &&
      name.length <= 30 &&
      !names.includes(name)
    ){

      names.push(name);

    }

  }


  // HTMLリンク形式にも対応
  const htmlRegex =
    /<a[^>]+href=["'][^"']*\/horse\/[^"']*["'][^>]*>(.*?)<\/a>/gi;

  while(
    (match = htmlRegex.exec(text)) !== null
  ){

    const name =
      clean(
        match[1]
          .replace(/<[^>]+>/g,"")
      );

    if(
      name &&
      name.length <= 30 &&
      !names.includes(name)
    ){

      names.push(name);

    }

  }


  return names;

}


// ------------------------------------
// ② 出馬表取得
// ------------------------------------

async function loadRace(){

  const raceId =
    raceSelect.value;

  if(!raceId){

    return;

  }


  result.style.display =
    "none";


  setStatus(
    "選択したレースの出馬表を取得中..."
  );


  try{

    const url =
      getRaceURL(raceId);


    const text =
      await fetchJina(url);


    if(!text){

      throw new Error(
        "空のデータが返りました。"
      );

    }


    const horses =
      extractHorseNames(text);


    let output = "";


    output +=
      '<div class="result-title">' +
      "出馬表取得結果" +
      "</div>";


    output +=
      "<p>" +
      "<b>race_id：</b>" +
      raceId +
      "</p>";


    output +=
      "<p>" +
      "<b>認識した馬：</b>" +
      horses.length +
      "頭" +
      "</p>";


    if(horses.length){

      horses.forEach(
        (name,index)=>{

          output +=
            '<div class="horse">' +
            '<div class="horse-name">' +
            (index+1) +
            ". " +
            name +
            "</div>" +
            "</div>";

        }

      );

    }else{

      output +=
        "<p>" +
        "ページは取得できましたが、馬名を認識できませんでした。" +
        "</p>";

    }


    output +=
      "<details>" +
      "<summary>取得した本文を確認</summary>" +
      '<div class="raw">' +
      text.substring(0,20000) +
      "</div>" +
      "</details>";


    result.innerHTML =
      output;

    result.style.display =
      "block";


    if(horses.length){

      setStatus(
        "出馬表の取得に成功しました！\n" +
        horses.length +
        "頭の馬名を認識しました。",
        "ok"
      );

    }else{

      setStatus(
        "ページ取得は成功しました。\n" +
        "ただし馬名の自動認識はできませんでした。",
        "error"
      );

    }


  }catch(error){

    result.innerHTML =
      '<div class="result-title">' +
      "出馬表取得エラー" +
      "</div>" +

      "<p>" +
      error.message +
      "</p>";


    result.style.display =
      "block";


    setStatus(
      "出馬表の取得に失敗しました。\n\n" +
      error.message,
      "error"
    );

  }

}


// ------------------------------------
// ボタン
// ------------------------------------

getVenues.addEventListener(
  "click",
  loadVenues
);

getRace.addEventListener(
  "click",
  loadRace
);

</script>

</body>
</html>
