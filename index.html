<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬展開ラボ v0.6.4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0f1115;
  color:#f5f5f5;
}

header{
  padding:16px;
  background:#171a21;
  border-bottom:1px solid #292e38;
}

h1{
  margin:0;
  font-size:22px;
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 8px;
  border-radius:6px;
  background:#2b6cff;
  font-size:12px;
}

.container{
  padding:14px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:#171a21;
  border:1px solid #292e38;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

h3{
  font-size:15px;
  margin:14px 0 8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

label{
  display:block;
  font-size:12px;
  color:#aeb5c2;
  margin-bottom:5px;
}

input,select,button{
  width:100%;
  border:1px solid #343b48;
  border-radius:8px;
  background:#0f1115;
  color:#fff;
  padding:10px;
  font-size:14px;
}

button{
  background:#245ee8;
  border:none;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#292f3b;
}

button.danger{
  background:#b93232;
}

button:active{
  opacity:.8;
}

.race-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

@media(min-width:700px){
  .race-buttons{
    grid-template-columns:repeat(6,1fr);
  }
}

.race-buttons button{
  background:#222832;
  border:1px solid #39414e;
}

.race-buttons button.active{
  background:#245ee8;
}

.status{
  padding:10px;
  background:#0d0f13;
  border-radius:8px;
  white-space:pre-wrap;
  font-size:12px;
  color:#bfc6d3;
  line-height:1.6;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  margin-bottom:12px;
}

.tabs button{
  background:#20252e;
  font-size:12px;
  padding:9px 4px;
}

.tabs button.active{
  background:#245ee8;
}

.tab{
  display:none;
}

.tab.active{
  display:block;
}

.horse-card{
  background:#101318;
  border:1px solid #2b3039;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.horse-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.horse-name{
  font-weight:700;
  font-size:15px;
}

.horse-meta{
  font-size:12px;
  color:#9fa7b4;
  margin-top:4px;
}

.horse-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:8px;
}

@media(min-width:700px){
  .horse-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.mini-label{
  font-size:10px;
  color:#858d9a;
}

.mark{
  font-size:20px;
  font-weight:900;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  border-bottom:1px solid #292e38;
  padding:7px 4px;
  text-align:center;
}

th{
  color:#aeb5c2;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  background:#0f1115;
  color:#fff;
  border:1px solid #343b48;
  border-radius:8px;
  padding:10px;
}

.muted{
  color:#8d95a3;
  font-size:12px;
}

.good{
  color:#55d98a;
}

.warn{
  color:#ffd05a;
}

.bad{
  color:#ff6b6b;
}

.loading{
  opacity:.7;
  pointer-events:none;
}
</style>

<body>

<header>
  <h1>競馬展開ラボ</h1>

</header>

<div class="container">

          <option>2200</option>
          <option>2400</option>

        <div class="muted">
          現在はnetkeiba出馬表から取得できる情報を表示します。
          血統スコアは手動評価です。
        </div>
      </div>

    </div>


    <!-- EV -->

      <h2>期待値</h2>

      <div id="evArea">
        <div class="muted">予想実行後に表示します。</div>
      </div>

      <label>実際の上がり3F</label>
      <input id="actual3f" type="number" step="0.1" placeholder="例 35.2">

      <br><br>

      <label>メモ</label>
      <textarea id="verifyMemo"></textarea>

      <button onclick="saveVerification()">検証データ保存</button>

      <br><br>

      <div id="verifyList"></div>

<script>

/* =========================================================
   グローバル
========================================================= */

let horses = [];
let raceId = "";
let raceText = "";
let predictionData = null;

let lineupTimer = null;
let lineupSpeed = 700;


/* =========================================================
   初期化
========================================================= */

document.addEventListener("DOMContentLoaded", function(){

  const d = new Date();

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");

  document.getElementById("raceDate").value =
    `${yyyy}-${mm}-${dd}`;

  renderVerifyHistory();

});


/* =========================================================
   ステータス
========================================================= */

function setStatus(text){
  document.getElementById("status").textContent = text;
}


/* =========================================================
   Jina Reader
========================================================= */

async function jinaFetch(url){

  const readerUrl = "https://r.jina.ai/" + url;

  const response = await fetch(readerUrl);

  if(!response.ok){
    throw new Error("Jina HTTP " + response.status);
  }

  return await response.text();
}


/* =========================================================
   開催情報取得
========================================================= */

async function fetchMeeting(){

  const date = document.getElementById("raceDate").value;

  if(!date){
    alert("日付を選択してください");
    return;
  }

  const ymd = date.replace(/-/g,"");

  const btn = document.getElementById("fetchMeetingBtn");

  btn.classList.add("loading");
  btn.disabled = true;

  setStatus(
    "開催情報を取得中...\n" +
    "https://race.netkeiba.com/top/race_list.html?kaisai_date=" +
    ymd
  );

  try{

    const url =
      "https://race.netkeiba.com/top/race_list.html?kaisai_date=" +
      ymd;

    const text = await jinaFetch(url);

    const ids = [...new Set(
      [...text.matchAll(/race_id=(\d{12})/g)]
      .map(m => m[1])
    )];

    if(!ids.length){
      throw new Error("race_idが見つかりませんでした");
    }

    renderRaceButtons(ids);

    setStatus(
      "開催情報取得成功\n" +
      "取得レース数: " + ids.length
    );

  }catch(error){

    console.error(error);

    setStatus(
      "開催情報取得失敗\n" +
      error.message
    );

    alert("開催情報の取得に失敗しました。\n" + error.message);

  }finally{

    btn.classList.remove("loading");
    btn.disabled = false;

  }

}


/* =========================================================
   レースボタン
========================================================= */

function renderRaceButtons(ids){

  const area = document.getElementById("raceButtons");

  area.innerHTML = "";

  ids.sort();

  ids.forEach(id => {

    const btn = document.createElement("button");

    const raceNo = Number(id.slice(-2));

    btn.textContent = raceNo + "R";

    btn.onclick = function(){
      selectRace(id,btn);
    };

    area.appendChild(btn);

  });

}


/* =========================================================
   レース選択
========================================================= */

async function selectRace(id,button){

  raceId = id;

  document.querySelectorAll(".race-buttons button")
    .forEach(b => b.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  setStatus(
    "出馬表取得中...\n" +
    "race_id: " + id
  );

  try{

    const url =
      "https://race.netkeiba.com/race/shutuba.html?race_id=" +
      id;

    raceText = await jinaFetch(url);

    if(!raceText || raceText.length < 1000){
      throw new Error("取得データが短すぎます");
    }

    horses = parseRacePage(raceText);

    if(!horses.length){
      throw new Error(
        "出馬表を解析できませんでした"
      );
    }

    document.getElementById("horseCount").value =
      String(horses.length);

    renderHorses();

    setStatus(
      "出馬表取得成功\n" +
      "race_id: " + id + "\n" +
      "取得文字数: " + raceText.length + "\n" +
      "取得頭数: " + horses.length + "\n" +
      "取得馬番一覧: " +
      horses.map(h => h.number).join(",")
    );

  }catch(error){

    console.error(error);

    setStatus(
      "出馬表取得失敗\n" +
      error.message
    );

    alert(
      "出馬表の取得に失敗しました。\n" +
      error.message
    );

  }

}


/* =========================================================
   セル文字列処理
========================================================= */

function cleanCell(text){

  if(text == null){
    return "";
  }

  let s = String(text);

  // HTMLタグ除去
  s = s.replace(/<[^>]*>/g," ");

  // Markdown画像
  s = s.replace(/!\[[^\]]*\]\([^)]*\)/g,"");

  // Markdownリンク
  s = s.replace(/\[([^\]]+)\]\([^)]*\)/g,"$1");

  // 引用・装飾
  s = s.replace(/[*_`~]/g,"");

  // HTMLエンティティ
  s = s
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&")
    .replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'");

  return s.replace(/\s+/g," ").trim();

}


/* =========================================================
   馬名取得
========================================================= */

function extractHorseName(line){

  /*
    netkeibaのJina出力では、

    [馬名![Image](...)](
      https://db.netkeiba.com/horse/XXXXXXXX
      "馬名"
    )

    のような形になる。

    title属性を最優先で使う。
  */

  let m = line.match(
    /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
  );

  if(m){
    return cleanCell(m[1]);
  }


  /*
    titleが取れない場合のフォールバック。
  */

  const horsePart =
    line.match(
      /$begin:math:display$\(\[\^$end:math:display$]*?)\]$begin:math:text$https\?\:\\\/\\\/db\\\.netkeiba\\\.com\\\/horse\\\/\\d\+\/
    \)\;

  if\(horsePart\)\{

    let name \= horsePart\[1\]\;

    name \= name\.replace\(
      \/\!\\\[\[\^\\\]\]\*\\\]\\\(\[\^\)\]\*$end:math:text$/g,
      ""
    );

    name = cleanCell(name);

    if(name){
      return name;
    }

  }

  return "";

}


/* =========================================================
   リンク文字列取得
========================================================= */

function extractLinkLabel(cell, type){

  const regex = new RegExp(
    "\$begin:math:display$\(\[\^\\$end:math:display$]+)\\]\$begin:math:text$\[\^\)\]\*\" \+ type \+ \"\[\^\)\]\*\\$end:math:text$",
    "i"
  );

  const m = cell.match(regex);

  if(m){
    return cleanCell(m[1]);
  }

  return cleanCell(cell);

}


/* =========================================================
   出馬表パーサー v0.6.4
========================================================= */

function parseRacePage(text){

  const lines = text.split(/\r?\n/);

  const result = [];
  const usedNumbers = new Set();

  for(const line of lines){

    /*
      馬リンクが存在する行だけを対象。
      これで余計なページ内数字を排除する。
    */

    if(!line.includes("db.netkeiba.com/horse/")){
      continue;
    }


    /*
      Markdown tableを保持したまま分割。
      空セルを消さないのが重要。
    */

    const cells =
      line.split("|").map(v => v.trim());


    /*
      先頭・末尾の空セルを考慮すると、

      cells[1] = 枠番
      cells[2] = 馬番
      cells[3] = 印
      cells[4] = 馬名
      cells[5] = 性齢
      cells[6] = 斤量
      cells[7] = 騎手
      cells[8] = 厩舎
      cells[9] = 馬体重
      cells[10] = オッズ
      cells[11] = 人気

      という構造になる。
    */

    if(cells.length < 10){
      continue;
    }


    const frame =
      Number(cleanCell(cells[1]));

    const number =
      Number(cleanCell(cells[2]));


    /*
      枠番・馬番として妥当か確認。
    */

    if(
      !Number.isInteger(frame) ||
      frame < 1 ||
      frame > 8
    ){
      continue;
    }

    if(
      !Number.isInteger(number) ||
      number < 1 ||
      number > 18
    ){
      continue;
    }


    /*
      同じ馬が複数回出てくる可能性があるため、
      馬番で重複排除。
    */

    if(usedNumbers.has(number)){
      continue;
    }


    const name = extractHorseName(line);

    if(!name){
      continue;
    }


    /*
      性齢
    */

    let sexAge = "";

    for(let i=4;i<8 && i<cells.length;i++){

      const c = cleanCell(cells[i]);

      if(/^[牡牝セ]\d{1,2}$/.test(c)){
        sexAge = c;
        break;
      }

    }


    /*
      斤量
    */

    let weight = "";

    for(let i=5;i<8 && i<cells.length;i++){

      const c = cleanCell(cells[i]);

      if(
        /^\d{2}(?:\.\d)?$/.test(c)
      ){

        const n = Number(c);

        if(n >= 40 && n <= 70){
          weight = c;
          break;
        }

      }

    }


    /*
      騎手
    */

    let jockey =
      extractLinkLabel(cells[7] || "", "jockey");

    if(!jockey){
      jockey = cleanCell(cells[7] || "");
    }


    /*
      厩舎
    */

    let trainer =
      extractLinkLabel(cells[8] || "", "trainer");

    if(!trainer){
      trainer = cleanCell(cells[8] || "");
    }


    /*
      オッズ

      ここが今回の重要部分。

      cells[9]  = 馬体重
      cells[10] = オッズ
      cells[11] = 人気

      空セルを勝手に除去しないので、
      別の数字を拾わない。
    */

    let oddsText =
      cleanCell(cells[10] || "");

    let odds = Number(oddsText);

    if(!Number.isFinite(odds)){
      odds = 0;
    }


    /*
      人気
    */

    let popularityText =
      cleanCell(cells[11] || "");

    let popularity =
      Number(popularityText);

    if(!Number.isFinite(popularity)){
      popularity = 0;
    }


    /*
      手動評価の初期値。

      netkeibaから自動取得できた部分以外は
      いったん50としておく。
    */

    const horse = {

      frame: frame,

      number: number,

      name: name,

      sexAge: sexAge,

      weight: weight,

      jockey: jockey,

      trainer: trainer,

      odds: odds,

      popularity: popularity,

      style: "先行",

      secondLeg: 50,

      training: 50,

      pedigree: 50,

      position: 50,

      score: 0,

      winRate: 0,

      ev: 0,

      mark: ""

    };


    result.push(horse);

    usedNumbers.add(number);

  }


  /*
    馬番順に並べる
  */

  result.sort(
    (a,b) => a.number - b.number
  );


  console.log(
    "========== v0.6.4 PARSER =========="
  );

  console.log(
    "総行数:",
    lines.length
  );

  console.log(
    "最終取得頭数:",
    result.length
  );

  console.log(
    "取得馬番一覧:",
    result.map(h => h.number).join(",")
  );


  const max =
    result.length
      ? Math.max(...result.map(h => h.number))
      : 0;

  const missing = [];

  for(let i=1;i<=max;i++){

    if(!usedNumbers.has(i)){
      missing.push(i);
    }

  }

  if(missing.length){

    console.warn(
      "未取得馬番:",
      missing.join(",")
    );

  }


  return result;

}


/* =========================================================
   馬一覧表示
========================================================= */

function renderHorses(){

  const area =
    document.getElementById("horseList");

  if(!horses.length){

    area.innerHTML =
      '<div class="muted">出馬表なし</div>';

    return;

  }


  let html = "";

  horses.forEach((h,index) => {

    html += `

      <div class="horse-card">

        <div class="horse-head">

          <div>

            <span class="mark" id="mark-${index}">
              -
            </span>

/* =========================================================
   展開計算
========================================================= */

function calcPace(hs){

  const front =
    hs.filter(
      h => h.style === "逃げ" ||
           h.style === "先行"
    );

  const escape =
    hs.filter(
      h => h.style === "逃げ"
    );


  const frontPower =
    front.length
      ? front.reduce(
          (sum,h)=>sum+h.secondLeg,0
        ) / front.length
      : 0;


  const escapePower =
    escape.length
      ? escape.reduce(
          (sum,h)=>sum+h.secondLeg,0
        ) / escape.length
      : 0;


  let pressure =
    front.length * 1.5 +
    escape.length * 2 +
    Math.max(
      0,
      (frontPower - 50) / 10
    ) +
    Math.max(
      0,
      (escapePower - 50) / 10
    );


  if(hs.length >= 16){
    pressure += 1;
  }


  let pace = "M";
  let flow = "展開フラット";


  if(pressure >= 12){

    pace = "H";
    flow = "差し・追込有利";

  }else if(pressure <= 5){

    pace = "S";
    flow = "逃げ・先行有利";

  }


  return {
    pace,
    flow,
    pressure,
    frontCount:front.length,
    escapeCount:escape.length
  };

}


/* =========================================================
   ペース補正
========================================================= */

function paceBonus(h,pace){

  let bonus = 0;


  if(pace === "H"){

    if(h.style === "逃げ") bonus -= 9;
    if(h.style === "先行") bonus -= 4;
    if(h.style === "差し") bonus += 7;
    if(h.style === "追込") bonus += 9;

    if(
      (h.style==="逃げ" ||
       h.style==="先行") &&
      h.secondLeg < 45
    ){
      bonus -= 4;
    }

  }


  if(pace === "M"){

    if(h.style === "逃げ") bonus += 2;
    if(h.style === "先行") bonus += 3;
    if(h.style === "差し") bonus += 2;
    if(h.style === "追込") bonus -= 2;

  }


  if(pace === "S"){

    if(h.style === "逃げ") bonus += 10;
    if(h.style === "先行") bonus += 7;
    if(h.style === "差し") bonus -= 5;
    if(h.style === "追込") bonus -= 10;

    if(
      (h.style==="逃げ" ||
       h.style==="先行") &&
      h.secondLeg >= 70
    ){
      bonus += 3;
    }

  }


  return bonus;

}


/* =========================================================
   コース補正
========================================================= */

function courseBonus(h){

  const distance =
    Number(document.getElementById("distance").value);

  const surface =
    document.getElementById("surface").value;

  const going =
    document.getElementById("going").value;

  const course =
    document.getElementById("course").value;


  let bonus = 0;


  if(distance <= 1400){

    bonus +=
      h.secondLeg * 0.05 +
      h.position * 0.05;

  }else if(distance <= 1800){

    bonus +=
      h.training * 0.05 +
      h.position * 0.05;

  }else{

    bonus +=
      h.training * 0.05 +
      h.pedigree * 0.05;

  }


  if(surface === "ダート"){

    bonus +=
      h.position * 0.04 +
      h.secondLeg * 0.04;

  }else{

    bonus +=
      h.training * 0.04 +
      h.pedigree * 0.04;

  }


  if(going === "稍重"){

    bonus +=
      h.training * 0.02 +
      h.pedigree * 0.02;

  }


  if(going === "重" || going === "不良"){

    bonus +=
      h.training * 0.04 +
      h.pedigree * 0.04;

  }


  switch(course){

    case "東京":
      bonus += h.position * 0.03;
      break;

    case "中山":
      bonus +=
        h.position * 0.03 +
        h.secondLeg * 0.03;
      break;

    case "京都":
      bonus += h.position * 0.03;
      break;

    case "阪神":
      bonus += h.training * 0.03;
      break;

    case "中京":
      bonus += h.training * 0.03;
      break;

    case "新潟":
      bonus += h.secondLeg * 0.03;
      break;

    case "小倉":
      bonus += h.position * 0.03;
      break;

    case "福島":
      bonus +=
        h.position * 0.03 +
        h.secondLeg * 0.02;
      break;

    case "札幌":
      bonus += h.training * 0.03;
      break;

    case "函館":
      bonus += h.training * 0.03;
      break;

  }


  return bonus;

}


/* =========================================================
   人気補正
========================================================= */

function favoriteBonus(h){

  const mode =
    document.getElementById("favoriteMode").value;

  let bonus = 0;


  if(h.odds > 0 && h.odds <= 3){

    if(mode === "caution"){
      bonus -= 3;
    }

    if(mode === "value"){
      bonus -= 5;
    }

  }


  return bonus;

}


/* =========================================================
   予想実行
========================================================= */

function runPrediction(){

  if(!horses.length){

    alert("まずレースを選択してください。");

    return;

  }


  const pace =
    calcPace(horses);


  let totalScore = 0;


  horses.forEach(h => {

    const base =
      h.training * 0.30 +
      h.pedigree * 0.25 +
      h.position * 0.25 +
      h.secondLeg * 0.20;


    const paceAdj =
      paceBonus(h,pace.pace);


    const courseAdj =
      courseBonus(h);


    const favoriteAdj =
      favoriteBonus(h);


    h.score =
      base +
      paceAdj +
      courseAdj +
      favoriteAdj;


    if(h.score < 1){
      h.score = 1;
    }


    totalScore += h.score;

  });


  horses.forEach(h => {

    h.winRate =
      h.score /
      totalScore *
      100;


    h.ev =
      h.odds > 0
        ? h.winRate / 100 *
          h.odds *
          100
        : 0;

  });


  horses.sort(
    (a,b) => b.score - a.score
  );


  const marks =
    ["◎","○","▲","△","☆"];


  horses.forEach((h,i)=>{

    h.mark =
      i < marks.length
        ? marks[i]
        : "";

  });


  predictionData = {
    raceId:raceId,
    pace:pace,
    timestamp:new Date().toISOString()
  };


  renderPrediction(pace);
  renderPace(pace);
  renderPedigree();
  renderEV();


  setStatus(
    "予想計算完了\n" +
    "ペース: " + pace.pace + "\n" +
    "展開: " + pace.flow + "\n" +
    "取得頭数: " + horses.length
  );

}

/* =========================================================
   隊列アニメーション
========================================================= */

function startLineup(){

  stopLineup();

  let i = 0;

  lineupTimer = setInterval(()=>{

    const cards =
      document.querySelectorAll(
        "#lineupArea .horse-card"
      );

    cards.forEach(
      c => c.style.opacity = "0.35"
    );


    if(cards[i]){
      cards[i].style.opacity = "1";
    }


    i++;

    if(i >= cards.length){
      i = 0;
    }

  },lineupSpeed);

}


function stopLineup(){

  if(lineupTimer){

    clearInterval(lineupTimer);
    lineupTimer = null;

  }

}


function speedUp(){

  if(lineupSpeed > 200){
    lineupSpeed -= 100;
  }

}

function saveVerification(){

  const actual3f =
    document.getElementById("actual3f").value;

  const memo =
    document.getElementById("verifyMemo").value;


  const data = {

    raceId:raceId,

    date:
      document.getElementById("raceDate").value,

    course:
      document.getElementById("course").value,

    raceNo:
      document.getElementById("raceNo").value,

    prediction:predictionData,

    horses:
      horses.map(h=>({
        number:h.number,
        name:h.name,
        mark:h.mark,
        score:h.score,
        winRate:h.winRate,
        odds:h.odds,
        ev:h.ev
      })),

    actual3f:actual3f,

    memo:memo,

    savedAt:
      new Date().toISOString()

  };


  const key = "keiba_verify_v064";

  const old =
    JSON.parse(
      localStorage.getItem(key) || "[]"
    );


  old.push(data);


  localStorage.setItem(
    key,
    JSON.stringify(old)
  );


  renderVerifyHistory();

  alert("検証データを保存しました。");

}

   検証履歴
========================================================= */

function renderVerifyHistory(){

  const area =
    document.getElementById("verifyList");

  if(!area){
    return;
  }


  const key = "keiba_verify_v064";

  const data =
    JSON.parse(
      localStorage.getItem(key) || "[]"
    );


  if(!data.length){

    area.innerHTML =
      '<div class="muted">保存データなし</div>';

    return;

  }


  let html = "";

  data
    .slice()
    .reverse()
    .forEach((d,i)=>{

      html += `

        <div class="horse-card">

          <b>
            ${escapeHtml(d.date || "")}

            ${escapeHtml(d.raceNo || "")}

          <div class="horse-meta">

            ${escapeHtml(String(d.actual3f || "--"))}

            <br>

    });

}

========================================================= */

function switchTab(id,button){

  document.querySelectorAll(".tab")
    .forEach(
      t => t.classList.remove("active")
    );


  document.querySelectorAll(".tabBtn")
    .forEach(
      b => b.classList.remove("active")
    );


  document.getElementById(id)
    .classList.add("active");


  button.classList.add("active");

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
