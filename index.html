<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>競馬展開ラボ v0.5.4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#17202a;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Hiragino Kaku Gothic ProN",
  "Yu Gothic",Meiryo,sans-serif;
}

header{
  background:#111827;
  color:#fff;
  padding:16px;
}

.title{
  font-size:22px;
  font-weight:800;
}

.badge{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:20px;
  background:#374151;
  font-size:11px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

h2{
  margin:0 0 12px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
}

input,
button{
  width:100%;
  min-height:44px;
  border-radius:9px;
  font-size:16px;
}

input{
  border:1px solid #d1d5db;
  padding:8px;
}

button{
  border:0;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#eef2ff;
  white-space:pre-wrap;
  font-size:13px;
}

.ok{
  background:#ecfdf5;
  color:#065f46;
}

.error{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  display:none;
  margin-top:10px;
  text-align:center;
  font-weight:bold;
}

.races{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.race{
  background:#f3f4f6;
  color:#111827;
  border:1px solid #d1d5db;
  min-height:55px;
}

.race.selected{
  background:#2563eb;
  color:#fff;
}

.meta{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.meta-box{
  background:#f8fafc;
  border-radius:9px;
  padding:9px;
}

.meta-label{
  font-size:10px;
  color:#64748b;
}

.meta-value{
  font-size:14px;
  font-weight:800;
  margin-top:2px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th{
  background:#111827;
  color:#fff;
  padding:8px;
  font-size:11px;
  white-space:nowrap;
}

td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  font-size:12px;
  white-space:nowrap;
}

.horse-name{
  font-weight:800;
}

.odds{
  font-weight:800;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .races{
    grid-template-columns:repeat(3,1fr);
  }

  .meta{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

<header>
  <div class="title">競馬展開ラボ</div>
  <div class="badge">v0.5.4 TEST</div>
</header>

<div class="container">

  <!-- 日付 -->
  <div class="card">

    <h2>① 日付を選択</h2>

    <div class="grid">

      <div>
        <label>開催日</label>
        <input type="date" id="raceDate">
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="fetchButton">
          開催情報を取得
        </button>
      </div>

    </div>

    <div id="status" class="status">
      日付を選択して「開催情報を取得」を押してください。
    </div>

    <div id="loading" class="loading">
      ⏳ 取得中……
    </div>

  </div>


  <!-- レース -->
  <div id="raceCard" class="card" style="display:none;">

    <h2>② レースを選択</h2>

    <div id="races" class="races"></div>

    <div id="raceStatus" class="status">
      レースを選択してください。
    </div>

  </div>


  <!-- 出馬表 -->
  <div id="resultCard" class="card" style="display:none;">

    <h2>③ 出馬表</h2>

    <div id="raceMeta" class="meta"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>枠</th>
            <th>馬番</th>
            <th>馬名</th>
            <th>性齢</th>
            <th>斤量</th>
            <th>騎手</th>
            <th>厩舎</th>
            <th>馬体重</th>
            <th>オッズ</th>
            <th>人気</th>
          </tr>
        </thead>

        <tbody id="horseTable"></tbody>

      </table>

    </div>

    <div id="parseStatus" class="status ok">
      解析待ち
    </div>

  </div>

</div>


<script>

/* =====================================================
   v0.5.4
   v0.5.3をベースに最小変更
===================================================== */

var JINA_BASE = "https://r.jina.ai/";

var selectedRaceId = "";


/* =====================================================
   ページ準備
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    var date =
      document.getElementById("raceDate");

    var button =
      document.getElementById("fetchButton");


    /*
      今日の日付をセット
    */

    var now = new Date();

    var year =
      now.getFullYear();

    var month =
      String(now.getMonth() + 1)
      .padStart(2,"0");

    var day =
      String(now.getDate())
      .padStart(2,"0");

    date.value =
      year + "-" +
      month + "-" +
      day;


    /*
      開催情報ボタン
    */

    button.onclick =
      function(){

        fetchRaceDay();

      };

  }
);


/* =====================================================
   Jina取得
===================================================== */

function fetchJina(url){

  return fetch(
    JINA_BASE + url,
    {
      method:"GET",
      cache:"no-store"
    }
  )
  .then(
    function(response){

      if(!response.ok){

        throw new Error(
          "Jina HTTP " +
          response.status
        );

      }

      return response.text();

    }
  );

}


/* =====================================================
   開催情報URL
===================================================== */

function getDayURL(date){

  var d =
    date.replace(/-/g,"");

  return (
    "https://race.netkeiba.com/" +
    "top/race_list.html" +
    "?kaisai_date=" +
    d
  );

}


/* =====================================================
   出馬表URL
===================================================== */

function getRaceURL(raceId){

  return (
    "https://race.netkeiba.com/" +
    "race/shutuba.html" +
    "?race_id=" +
    raceId
  );

}


/* =====================================================
   race_id取得
===================================================== */

function extractRaceIds(text){

  var ids = [];

  var regex =
    /race_id=(\d{12})/g;

  var match;


  while(
    (match = regex.exec(text)) !== null
  ){

    if(
      ids.indexOf(match[1]) === -1
    ){

      ids.push(match[1]);

    }

  }


  return ids;

}


/* =====================================================
   開催情報取得
===================================================== */

function fetchRaceDay(){

  var date =
    document.getElementById(
      "raceDate"
    ).value;

  var status =
    document.getElementById(
      "status"
    );

  var loading =
    document.getElementById(
      "loading"
    );

  var raceCard =
    document.getElementById(
      "raceCard"
    );

  var races =
    document.getElementById(
      "races"
    );


  if(!date){

    status.className =
      "status error";

    status.textContent =
      "日付を選択してください。";

    return;

  }


  status.className =
    "status";

  status.textContent =
    "開催情報を取得しています……";


  loading.style.display =
    "block";


  raceCard.style.display =
    "none";


  races.innerHTML =
    "";


  /*
    v0.5.3と同じ取得処理
  */

  var url =
    getDayURL(date);


  fetchJina(url)

    .then(
      function(text){

        var ids =
          extractRaceIds(text);


        if(ids.length === 0){

          throw new Error(
            "race_idが見つかりませんでした。"
          );

        }


        /*
          末尾2桁がR番号。

          同一開催日の複数競馬場を含むため、
          まず取得したrace_idをそのまま
          3つの開催場×12R程度まで扱う。
        */

        var shown = 0;


        ids.forEach(
          function(id){

            var raceNo =
              parseInt(
                id.substring(10,12),
                10
              );


            if(
              raceNo < 1 ||
              raceNo > 12
            ){

              return;

            }


            var button =
              document.createElement(
                "button"
              );


            button.className =
              "race";


            button.textContent =
              raceNo + "R";


            button.onclick =
              function(){

                selectRace(
                  id,
                  raceNo,
                  button
                );

              };


            races.appendChild(
              button
            );


            shown++;

          }
        );


        if(shown === 0){

          throw new Error(
            "1R〜12Rのレースを認識できませんでした。"
          );

        }


        status.className =
          "status ok";


        status.textContent =
          "開催情報の取得に成功しました。\n" +
          "認識したレース：" +
          shown +
          "件";


        raceCard.style.display =
          "block";

      }
    )

    .catch(
      function(error){

        console.error(error);


        status.className =
          "status error";


        status.textContent =
          "開催情報の取得に失敗しました。\n\n" +
          error.message;

      }
    )

    .finally(
      function(){

        loading.style.display =
          "none";

      }
    );

}


/* =====================================================
   レース選択
===================================================== */

function selectRace(
  raceId,
  raceNo,
  button
){

  selectedRaceId =
    raceId;


  /*
    選択状態
  */

  var buttons =
    document.querySelectorAll(
      ".race"
    );


  buttons.forEach(
    function(b){

      b.classList.remove(
        "selected"
      );

    }
  );


  button.classList.add(
    "selected"
  );


  var status =
    document.getElementById(
      "raceStatus"
    );


  status.className =
    "status";


  status.textContent =
    raceNo +
    "Rの出馬表を取得しています……";


  /*
    出馬表取得
  */

  var url =
    getRaceURL(raceId);


  fetchJina(url)

    .then(
      function(text){

        var data =
          parseRacePage(
            text,
            raceId,
            raceNo
          );


        renderRace(
          data
        );


        status.className =
          "status ok";


        status.textContent =
          "出馬表の取得に成功しました。\n" +
          "認識した馬：" +
          data.horses.length +
          "頭";


        document.getElementById(
          "resultCard"
        ).style.display =
          "block";

      }
    )

    .catch(
      function(error){

        console.error(error);


        status.className =
          "status error";


        status.textContent =
          "出馬表の取得に失敗しました。\n\n" +
          error.message;

      }
    );

}


/* =====================================================
   馬名処理
===================================================== */

function cleanText(value){

  if(!value){
    return "";
  }


  var s =
    String(value);


  /*
    Image markdown除去
  */

  s =
    s.replace(
      /!\[[^\]]*\]\([^)]*\)/g,
      ""
    );


  /*
    通常のMarkdownリンク
  */

  s =
    s.replace(
      /\[([^\]]+)\]\([^)]*\)/g,
      "$1"
    );


  /*
    HTML entity
  */

  s =
    s.replace(
      /&nbsp;/g,
      " "
    );


  s =
    s.replace(
      /&amp;/g,
      "&"
    );


  return s.trim();

}


function extractHorseName(cell){

  var s =
    cell || "";


  /*
    最優先：
    horseページのtitleに入っている馬名
  */

  var match =
    s.match(
      /\/horse\/[^)]*\s+"([^"]+)"/
    );


  if(
    match &&
    match[1]
  ){

    return match[1].trim();

  }


  /*
    Imageを削除
  */

  s =
    s.replace(
      /!\[[^\]]*\]\([^)]*\)/g,
      ""
    );


  /*
    Markdownリンクから文字だけ残す
  */

  match =
    s.match(
      /\[([^\]]+)\]\([^)]*\)/
    );


  if(
    match &&
    match[1]
  ){

    return match[1].trim();

  }


  return cleanText(s);

}


/* =====================================================
   出馬表解析
===================================================== */

function parseRacePage(
  text,
  raceId,
  raceNo
){

  var lines =
    text.split(/\r?\n/);


  var full =
    text.replace(
      /\r?\n/g,
      " "
    );


  var data = {

    raceId:raceId,

    raceNo:
      raceNo + "R",

    raceName:"",

    startTime:"",

    course:"",

    surface:"",

    distance:"",

    weather:"",

    going:"",

    fieldSize:"",

    horses:[]

  };


  /*
    発走
  */

  var match =
    full.match(
      /(\d{1,2}:\d{2})発走/
    );


  if(match){

    data.startTime =
      match[1];

  }


  /*
    芝・ダート
  */

  match =
    full.match(
      /([芝ダ])\s*(\d{3,4})m/
    );


  if(match){

    data.surface =
      match[1] === "芝"
      ? "芝"
      : "ダート";


    data.distance =
      match[2] + "m";

  }


  /*
    天候
  */

  match =
    full.match(
      /天候[:：]\s*([^\s]+)/
    );


  if(match){

    data.weather =
      match[1];

  }


  /*
    馬場
  */

  match =
    full.match(
      /馬場[:：]\s*([^\s]+)/
    );


  if(match){

    data.going =
      match[1];

  }


  /*
    頭数
  */

  match =
    full.match(
      /(\d+)頭/
    );


  if(match){

    data.fieldSize =
      match[1] + "頭";

  }


  /*
    開催場
  */

  match =
    full.match(
      /\d+回\s+([^\s]+)\s+\d+日目/
    );


  if(match){

    data.course =
      match[1];

  }


  /*
    レース名
  */

  for(
    var i=0;
    i<lines.length;
    i++
  ){

    var line =
      lines[i];


    if(
      line.indexOf("## ") === 0
    ){

      var name =
        cleanText(
          line
        ).replace(
          /^##\s*/,
          ""
        );


      if(
        name &&
        name.indexOf("出馬表") === -1 &&
        name.indexOf("レース情報") === -1
      ){

        data.raceName =
          name;

        break;

      }

    }

  }


  /*
    ==========================================
    馬テーブル
    ==========================================
  */

  var horses = [];


  for(
    var j=0;
    j<lines.length;
    j++
  ){

    var row =
      lines[j].trim();


    if(
      row.indexOf("|") !== 0
    ){

      continue;

    }


    var cells =
      row
        .split("|")
        .slice(1,-1);


    if(
      cells.length < 10
    ){

      continue;

    }


    for(
      var c=0;
      c<cells.length;
      c++
    ){

      cells[c] =
        cells[c].trim();

    }


    /*
      cells[1]が馬番
    */

    if(
      !/^\d+$/.test(
        cells[1]
      )
    ){

      continue;

    }


    var number =
      parseInt(
        cells[1],
        10
      );


    if(
      number < 1 ||
      number > 18
    ){

      continue;

    }


    var horse = {

      frame:
        cleanText(
          cells[0]
        ),

      number:
        number,

      name:
        extractHorseName(
          cells[3]
        ),

      sexAge:
        cleanText(
          cells[4]
        ),

      weight:
        cleanText(
          cells[5]
        ),

      jockey:
        cleanText(
          cells[6]
        ),

      stable:
        cleanText(
          cells[7]
        ),

      bodyWeight:
        cleanText(
          cells[8]
        ),

      odds:
        cleanText(
          cells[9]
        ),

      popularity:
        cleanText(
          cells[10] || ""
        )

    };


    if(
      horse.name
    ){

      horses.push(
        horse
      );

    }

  }


  /*
    馬番順
  */

  horses.sort(
    function(a,b){

      return a.number -
             b.number;

    }
  );


  /*
    重複除去
  */

  var seen = {};

  var unique = [];


  horses.forEach(
    function(horse){

      if(
        !seen[horse.number]
      ){

        seen[horse.number] =
          true;

        unique.push(
          horse
        );

      }

    }
  );


  data.horses =
    unique;


  return data;

}


/* =====================================================
   表示
===================================================== */

function renderRace(data){

  var result =
    document.getElementById(
      "resultCard"
    );


  var meta =
    document.getElementById(
      "raceMeta"
    );


  meta.innerHTML =
    "";


  var items = [

    [
      "レース",
      data.raceNo
    ],

    [
      "レース名",
      data.raceName || "-"
    ],

    [
      "発走",
      data.startTime || "-"
    ],

    [
      "コース",
      (data.course || "-") +
      " " +
      (data.surface || "") +
      " " +
      (data.distance || "")
    ],

    [
      "天候",
      data.weather || "-"
    ],

    [
      "馬場",
      data.going || "-"
    ],

    [
      "頭数",
      data.fieldSize ||
      data.horses.length +
      "頭"
    ],

    [
      "race_id",
      data.raceId
    ]

  ];


  items.forEach(
    function(item){

      var div =
        document.createElement(
          "div"
        );


      div.className =
        "meta-box";


      div.innerHTML =
        '<div class="meta-label">' +
        escapeHtml(item[0]) +
        '</div>' +

        '<div class="meta-value">' +
        escapeHtml(item[1]) +
        '</div>';


      meta.appendChild(
        div
      );

    }
  );


  /*
    馬一覧
  */

  var tbody =
    document.getElementById(
      "horseTable"
    );


  tbody.innerHTML =
    "";


  data.horses.forEach(
    function(horse){

      var tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML =

        "<td>" +
        escapeHtml(
          horse.frame
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.number
        ) +
        "</td>" +

        '<td class="horse-name">' +
        escapeHtml(
          horse.name
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.sexAge
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.weight
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.jockey
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.stable
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.bodyWeight
        ) +
        "</td>" +

        '<td class="odds">' +
        escapeHtml(
          horse.odds
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          horse.popularity
        ) +
        "</td>";


      tbody.appendChild(
        tr
      );

    }
  );


  document.getElementById(
    "parseStatus"
  ).textContent =
    data.horses.length +
    "頭を正常に解析しました。";


  result.style.display =
    "block";

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(value){

  return String(
    value == null
      ? ""
      : value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
