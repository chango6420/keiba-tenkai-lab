<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.9.3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:0;
  background:#0f1115;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:16px;
  background:#171a21;
  border-bottom:1px solid #292e38;
}

h1{
  margin:0;
  font-size:22px;
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 8px;
  border-radius:5px;
  background:#2864e8;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.card{
  background:#171a21;
  border:1px solid #292e38;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

h2{
  margin:0 0 12px;
  font-size:18px;
}

h3{
  margin:14px 0 8px;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

label{
  display:block;
  margin-bottom:5px;
  color:#aeb5c2;
  font-size:12px;
}

input,
select,
button{
  width:100%;
  border:1px solid #343b48;
  border-radius:8px;
  background:#0f1115;
  color:#fff;
  padding:10px;
  font-size:14px;
}

button{
  background:#2864e8;
  border:none;
  font-weight:700;
}

button:active{
  opacity:.75;
}

button:disabled{
  opacity:.45;
}

.races{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

@media(min-width:700px){
  .races{
    grid-template-columns:repeat(6,1fr);
  }
}

.races button{
  background:#222832;
  border:1px solid #39414e;
}

.races button.active{
  background:#2864e8;
}

.status{
  white-space:pre-wrap;
  line-height:1.6;
  background:#0d0f13;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  color:#bfc6d3;
}

.horse-card{
  background:#101318;
  border:1px solid #2b3039;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.horse-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.horse-name{
  font-weight:700;
  font-size:15px;
}

.meta{
  margin-top:5px;
  color:#9fa7b4;
  font-size:12px;
}

.tag{
  display:inline-block;
  padding:3px 7px;
  border-radius:5px;
  background:#292f3b;
  font-size:11px;
}

.good{
  color:#55dc88;
}

.warn{
  color:#ffd05a;
}

.bad{
  color:#ff6b6b;
}

.muted{
  color:#8d95a3;
  font-size:12px;
}

.progress{
  height:8px;
  background:#292f3b;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.progress div{
  height:100%;
  background:#2864e8;
}

.score-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:9px;
}

.score-box{
  background:#191e26;
  border-radius:6px;
  padding:7px 3px;
  text-align:center;
  font-size:11px;
}

.score-box strong{
  display:block;
  font-size:14px;
  margin-top:3px;
}

.past-race{
  background:#181d25;
  border-radius:7px;
  padding:8px;
  margin-top:6px;
  font-size:11px;
}

.detail{
  margin-top:8px;
}

.detail summary{
  color:#9fa7b4;
  font-size:12px;
  cursor:pointer;
}

.debug-info{
  margin-top:8px;
  padding:7px;
  border-radius:6px;
  background:#13171e;
  color:#788190;
  font-size:10px;
}
</style>
</head>

<body>

<header>
<h1>競馬展開ラボ</h1>
<span class="badge">v0.9.3 過去走データ紐付け改善版</span>
</header>

<div class="container">

<div class="card">

<h2>レース設定</h2>

<div class="grid">

<div>
<label>日付</label>
<input type="date" id="raceDate">
</div>

<div>
<label>競馬場</label>
<select id="course">
<option>東京</option>
<option>中山</option>
<option>京都</option>
<option>阪神</option>
<option>中京</option>
<option>新潟</option>
<option>小倉</option>
<option>福島</option>
<option>札幌</option>
<option>函館</option>
</select>
</div>

<div>
<label>レース番号</label>
<select id="raceNo">
<option>1R</option>
<option>2R</option>
<option>3R</option>
<option>4R</option>
<option>5R</option>
<option>6R</option>
<option>7R</option>
<option>8R</option>
<option>9R</option>
<option>10R</option>
<option>11R</option>
<option>12R</option>
</select>
</div>

<div>
<label>距離</label>
<input id="distance" type="number" value="1600">
</div>

</div>

<br>

<button id="fetchMeetingBtn">
開催情報を取得
</button>

</div>


<div class="card">

<h2>レース選択</h2>

<div id="raceButtons" class="races">
<div class="muted">
開催情報を取得してください
</div>
</div>

</div>


<div class="card">

<h2>取得状況</h2>

<div id="status" class="status">
JavaScript OK
</div>

</div>


<div class="card">

<h2>出馬表</h2>

<div id="horseList">
<div class="muted">
レースを選択してください。
</div>
</div>

<br>

<button id="analyzeBtn">
過去走を取得して脚質を解析
</button>

</div>


<div class="card">

<h2>脚質解析結果</h2>

<div id="styleSummary">
<div class="muted">
まだ解析していません。
</div>
</div>

<div id="styleResult" style="margin-top:12px"></div>

</div>

</div>


<script>

/* =====================================================
   競馬展開ラボ v0.9.3
===================================================== */

let horses = [];
let raceId = "";


/* =====================================================
   初期化
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

const now = new Date();

const yyyy =
now.getFullYear();

const mm =
String(now.getMonth()+1).padStart(2,"0");

const dd =
String(now.getDate()).padStart(2,"0");

document.getElementById("raceDate").value =
yyyy+"-"+mm+"-"+dd;

document
.getElementById("fetchMeetingBtn")
.addEventListener(
"click",
fetchMeeting
);

document
.getElementById("analyzeBtn")
.addEventListener(
"click",
analyzeAllHorses
);

});


/* =====================================================
   ステータス
===================================================== */

function status(text){

document
.getElementById("status")
.textContent = text;

}


/* =====================================================
   Jina
===================================================== */

async function jinaFetch(url){

const readerUrl =
"https://r.jina.ai/"+url;

const response =
await fetch(readerUrl);

if(!response.ok){

throw new Error(
"Jina HTTP "+response.status
);

}

return await response.text();

}


/* =====================================================
   開催情報
===================================================== */

async function fetchMeeting(){

const date =
document.getElementById("raceDate").value;

if(!date){

alert("日付を選択してください。");
return;

}

const ymd =
date.replace(/-/g,"");

const url =
"https://race.netkeiba.com/top/race_list.html?kaisai_date="+ymd;

status(
"開催情報取得中...\n"+
url
);

try{

const text =
await jinaFetch(url);

const ids = [
...new Set(
[...text.matchAll(/race_id=(\d{12})/g)]
.map(m=>m[1])
)
];

if(!ids.length){

throw new Error(
"race_idが見つかりませんでした"
);

}

renderRaces(ids);

status(
"開催情報取得成功\n"+
"レース数: "+ids.length
);

}catch(error){

console.error(error);

status(
"開催情報取得失敗\n"+
error.message
);

}

}


/* =====================================================
   レースボタン
===================================================== */

function renderRaces(ids){

const area =
document.getElementById("raceButtons");

area.innerHTML="";

ids.sort();

ids.forEach(function(id){

const button =
document.createElement("button");

const no =
Number(id.slice(-2));

button.textContent =
no+"R";

button.addEventListener(
"click",
function(){

selectRace(id,button);

}
);

area.appendChild(button);

});

}


/* =====================================================
   レース選択
===================================================== */

async function selectRace(id,button){

raceId=id;

document
.querySelectorAll(".races button")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

const url =
"https://race.netkeiba.com/race/shutuba.html?race_id="+id;

status(
"出馬表取得中...\n"+
"race_id: "+id
);

try{

const text =
await jinaFetch(url);

horses =
parseRacePage(text);

if(!horses.length){

throw new Error(
"馬が取得できませんでした"
);

}

renderHorses();

document
.getElementById("styleSummary")
.innerHTML =
'<div class="muted">過去走を取得して解析してください。</div>';

document
.getElementById("styleResult")
.innerHTML="";

status(
"出馬表取得成功\n"+
"取得頭数: "+horses.length
);

}catch(error){

console.error(error);

status(
"出馬表取得失敗\n"+
error.message
);

}

}


/* =====================================================
   出馬表解析
===================================================== */

function parseRacePage(text){

const lines =
text.split(/\r?\n/);

const result=[];
const used=new Set();

for(const line of lines){

if(
!line.includes(
"db.netkeiba.com/horse/"
)
){
continue;
}

const cells =
line
.split("|")
.map(x=>x.trim());

if(cells.length<10){
continue;
}

const frame =
Number(clean(cells[1]));

const number =
Number(clean(cells[2]));

if(
!Number.isInteger(frame) ||
frame<1 ||
frame>8
){
continue;
}

if(
!Number.isInteger(number) ||
number<1 ||
number>18
){
continue;
}

if(used.has(number)){
continue;
}

const name =
extractHorseName(line);

if(!name){
continue;
}

const horseUrlMatch =
line.match(
/https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

const horseUrl =
horseUrlMatch
?horseUrlMatch[0]
:"";

result.push({

frame:frame,

number:number,

name:name,

sexAge:clean(cells[5]||""),

weight:clean(cells[6]||""),

jockey:clean(cells[7]||""),

trainer:clean(cells[8]||""),

odds:Number(clean(cells[10]||""))||0,

popularity:Number(clean(cells[11]||""))||0,

horseUrl:horseUrl,

pastRaces:[],

style:"判定中",

styleConfidence:0,

styleConsistency:0,

styleScores:{
escape:0,
front:0,
stalker:0,
closer:0
}

});

used.add(number);

}

result.sort(
(a,b)=>a.number-b.number
);

return result;

}


/* =====================================================
   馬名
===================================================== */

function extractHorseName(line){

let match =
line.match(
/db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
);

if(match){

return clean(match[1]);

}

const fallback =
line.match(
/\[([^\]]+)\]\(https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

if(fallback){

return clean(
fallback[1]
.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
)
);

}

return "";

}


/* =====================================================
   全頭解析
===================================================== */

async function analyzeAllHorses(){

if(!horses.length){

alert(
"先にレースを選択してください。"
);

return;

}

const button =
document.getElementById("analyzeBtn");

button.disabled=true;

button.textContent=
"過去走を取得中...";

try{

for(
let i=0;
i<horses.length;
i++
){

const horse =
horses[i];

status(
"過去走解析中...\n"+
(i+1)+" / "+horses.length+
"\n\n"+
horse.number+". "+
horse.name
);

try{

if(!horse.horseUrl){

throw new Error(
"馬ページURLなし"
);

}

const text =
await jinaFetch(
horse.horseUrl
);

horse.pastRaces =
parsePastRaces(text);

const result =
judgeRunningStyle(
horse.pastRaces
);

horse.style =
result.style;

horse.styleConfidence =
result.confidence;

horse.styleConsistency =
result.consistency;

horse.styleScores =
result.scores;

}catch(error){

console.warn(
horse.name,
error
);

horse.pastRaces=[];

horse.style="不明";

horse.styleConfidence=0;

horse.styleConsistency=0;

horse.styleScores={
escape:0,
front:0,
stalker:0,
closer:0
};

}

renderStyleResult();

await sleep(250);

}

status(
"脚質解析完了\n"+
"解析頭数: "+horses.length
);

}catch(error){

console.error(error);

status(
"解析中にエラー\n"+
error.message
);

}

button.disabled=false;

button.textContent=
"過去走を取得して脚質を解析";

}


/* =====================================================
   ヘッダー解析
===================================================== */

function detectPastRaceHeader(cells){

const map={};

cells.forEach(
function(cell,index){

const h =
normalizeHeader(cell);

if(!h){
return;
}


/* 着順 */

if(
h==="着順" ||
h.includes("着順")
){

if(map.finish===undefined){

map.finish=index;

}

}


/* 通過 */

if(
h==="通過" ||
h.includes("通過")
){

if(map.position===undefined){

map.position=index;

}

}


/* 距離 */

if(
h==="距離" ||
h.includes("距離")
){

if(map.distance===undefined){

map.distance=index;

}

}


/* 日付 */

if(
h==="日付" ||
h.includes("日付")
){

if(map.date===undefined){

map.date=index;

}

}

});

return map;

}


/* =====================================================
   ヘッダー正規化
===================================================== */

function normalizeHeader(value){

return clean(value)
.replace(
/[\s　]/g,
""
)
.replace(
/（.*?）/g,
""
)
.replace(
/\(.*?\)/g,
""
)
.trim();

}


/* =====================================================
   着順解析
===================================================== */

function parseFinish(value){

const text =
clean(value);

if(!text){
return 0;
}


/*
正常な着順
*/

let match =
text.match(
/^(\d{1,2})$/
);

if(match){

const n =
Number(match[1]);

if(
n>=1 &&
n<=18
){

return n;

}

}


/*
「1着」形式
*/

match =
text.match(
/^(\d{1,2})着$/
);

if(match){

const n =
Number(match[1]);

if(
n>=1 &&
n<=18
){

return n;

}

}

return 0;

}


/* =====================================================
   距離解析
===================================================== */

function parseDistance(value){

const text =
clean(value);

if(!text){
return 0;
}

const match =
text.match(
/(?:芝|ダ|ダート|障|障害)?\s*(\d{3,4})\s*(?:m|Ｍ|メートル)?/i
);

if(!match){
return 0;
}

const d =
Number(match[1]);

const allowedDistances=[
1000,
1100,
1150,
1200,
1300,
1400,
1500,
1600,
1700,
1800,
1900,
2000,
2100,
2200,
2300,
2400,
2500,
2600,
2700,
2800,
3000,
3100,
3200,
3300,
3400,
3500,
3600,
4000
];

if(
!allowedDistances.includes(d)
){

return 0;

}

return d;

}


/* =====================================================
   日付解析
===================================================== */

function parseRaceDate(value){

const text =
clean(value);

if(!text){
return "";
}

if(
/^\d{4}[./-]\d{1,2}[./-]\d{1,2}$/.test(text)
){

return text;

}

if(
/^\d{2}[./-]\d{1,2}[./-]\d{1,2}$/.test(text)
){

return text;

}

return "";

}


/* =====================================================
   通過順位解析
===================================================== */

function parsePosition(value){

const text =
clean(value);

if(!text){
return "";
}

if(
/^\d+(?:-\d+)+$/.test(text)
){

return text;

}

const match =
text.match(
/(\d+(?:-\d+)+)/
);

if(match){

return match[1];

}

return "";

}


/* =====================================================
   レース行判定
===================================================== */

/*
ここがv0.9.3の中心。

過去走ページでは、
1レースの情報が複数行に分かれている
場合がある。

そのため、

日付
着順
通過
距離

を別々にページ全体から拾うのではなく、

「そのレースに属する情報」

としてまとめる。

*/

function isPastRaceDataRow(cells,header){

if(!header){
return false;
}


/*
通過列が存在して、
実際に通過順位が入っている場合。
*/

if(
header.position!==undefined &&
header.position<cells.length
){

if(
parsePosition(
cells[header.position]
)
){

return true;

}

}


/*
通過列が見つからない特殊ケース。

着順・距離・日付の組み合わせだけで
レース行らしいか確認。
*/

let hasFinish=false;
let hasDistance=false;
let hasDate=false;

if(
header.finish!==undefined &&
header.finish<cells.length
){

hasFinish =
parseFinish(
cells[header.finish]
)>0;

}

if(
header.distance!==undefined &&
header.distance<cells.length
){

hasDistance =
parseDistance(
cells[header.distance]
)>0;

}

if(
header.date!==undefined &&
header.date<cells.length
){

hasDate =
parseRaceDate(
cells[header.date]
)!=="";

}

return (
hasFinish &&
(hasDistance || hasDate)
);

}


/* =====================================================
   過去走解析
===================================================== */

function parsePastRaces(text){

const lines =
text.split(/\r?\n/);

const races=[];

let currentHeader=null;

let currentRace=null;


/*
-------------------------------------------------------
1行のレース情報を確定する
-------------------------------------------------------
*/

function pushCurrentRace(){

if(!currentRace){
return;
}


/*
最低限、通過が必要。

*/

if(
!currentRace.position
){

currentRace=null;

return;

}


/*
レースとして保存。

*/

races.push({

date:currentRace.date||"",

finish:currentRace.finish||0,

position:currentRace.position||"",

distance:currentRace.distance||0,

source:"row"

});

currentRace=null;

}


for(
let lineIndex=0;
lineIndex<lines.length;
lineIndex++
){

const rawLine =
lines[lineIndex];


/*
表が終わったら、
現在のレースを確定。

*/

if(
!rawLine.includes("|")
){

pushCurrentRace();

currentHeader=null;

continue;

}


const cells =
rawLine
.split("|")
.map(
x=>clean(x)
);


/*
短すぎる行は無視。
*/

if(cells.length<3){

continue;

}


/*
-------------------------------------------------------
ヘッダー検出
-------------------------------------------------------
*/

const detectedHeader =
detectPastRaceHeader(cells);

const hasUsefulHeader =
detectedHeader.finish!==undefined ||
detectedHeader.position!==undefined ||
detectedHeader.distance!==undefined ||
detectedHeader.date!==undefined;

if(hasUsefulHeader){

/*
別の表のヘッダーなら
現在のレースを確定してから切り替える。
*/

if(
currentHeader &&
(
JSON.stringify(currentHeader)!==
JSON.stringify(detectedHeader)
)
){

pushCurrentRace();

}

currentHeader =
detectedHeader;

continue;

}


/*
-------------------------------------------------------
区切り線
-------------------------------------------------------
*/

const isSeparator =
cells.every(
cell=>{
return (
cell==="" ||
/^:?-+:?$/.test(cell)
);
}
);

if(isSeparator){

continue;

}


/*
-------------------------------------------------------
ヘッダーがない場合
-------------------------------------------------------

以前と同じく、
通過だけは安全にフォールバック。

ただし着順・距離・日付は
推測しない。

*/

if(!currentHeader){

let fallbackPosition="";

for(const cell of cells){

const p =
parsePosition(cell);

if(p){

fallbackPosition=p;

break;

}

}

if(fallbackPosition){

/*
新しいレースとして扱う。
*/

pushCurrentRace();

currentRace={

date:"",

finish:0,

position:fallbackPosition,

distance:0

};

}

continue;

}


/*
-------------------------------------------------------
この行がレースデータか確認
-------------------------------------------------------
*/

if(
!isPastRaceDataRow(
cells,
currentHeader
)
){

continue;

}


/*
-------------------------------------------------------
新しいレース行
-------------------------------------------------------

ここが重要。

同じ表の次のレース行に進んだら、
前のレースを確定してから新しい
レースオブジェクトを作る。

*/

if(currentRace){

pushCurrentRace();

}


currentRace={

date:"",

finish:0,

position:"",

distance:0

};


/*
-------------------------------------------------------
日付
-------------------------------------------------------
*/

if(
currentHeader.date!==undefined &&
currentHeader.date<cells.length
){

currentRace.date =
parseRaceDate(
cells[currentHeader.date]
);

}


/*
-------------------------------------------------------
着順
-------------------------------------------------------
*/

if(
currentHeader.finish!==undefined &&
currentHeader.finish<cells.length
){

currentRace.finish =
parseFinish(
cells[currentHeader.finish]
);

}


/*
-------------------------------------------------------
通過
-------------------------------------------------------
*/

if(
currentHeader.position!==undefined &&
currentHeader.position<cells.length
){

currentRace.position =
parsePosition(
cells[currentHeader.position]
);

}


/*
-------------------------------------------------------
距離
-------------------------------------------------------
*/

if(
currentHeader.distance!==undefined &&
currentHeader.distance<cells.length
){

currentRace.distance =
parseDistance(
cells[currentHeader.distance]
);

}


/*
-------------------------------------------------------
通過だけ取れなかった場合の
安全なフォールバック
-------------------------------------------------------
*/

if(!currentRace.position){

for(const cell of cells){

const p =
parsePosition(cell);

if(p){

currentRace.position=p;

break;

}

}

}

}


/*
最後のレースを確定。
*/

pushCurrentRace();


/* =====================================================
   重複除去
===================================================== */

const unique=[];

const used=new Set();

for(const race of races){

if(
!race.position
){

continue;

}


/*
同一レースの完全重複だけ除去。

*/

const key =
[
race.date,
race.finish,
race.position,
race.distance
].join("|");

if(
used.has(key)
){

continue;

}

used.add(key);

unique.push(race);

}


/*
最大10走
*/

return unique.slice(0,10);

}


/* =====================================================
   1走ごとの脚質判定
===================================================== */

function judgeSingleRace(
positionText
){

const nums =
positionText
.split("-")
.map(Number)
.filter(
n=>Number.isFinite(n)
);

if(!nums.length){

return null;

}

const first =
nums[0];

const second =
nums.length>=2
?nums[1]
:first;

let style="";

if(first===1){

style="逃げ";

}else if(first<=3){

style="先行";

}else if(first<=6){

style="差し";

}else{

style="追込";

}


/*
位置変化補正
*/

const last =
nums[nums.length-1];

let adjustment=0;

if(
first>=7 &&
last<=3
){

adjustment=1;

}

if(
first<=3 &&
last>=7
){

adjustment=-1;

}

return {

style:style,

first:first,

second:second,

last:last,

adjustment:adjustment,

positions:nums

};

}


/* =====================================================
   総合脚質判定
===================================================== */

function judgeRunningStyle(
pastRaces
){

const scores={
escape:0,
front:0,
stalker:0,
closer:0
};

if(!pastRaces.length){

return {

style:"不明",

confidence:0,

consistency:0,

scores:scores

};

}

const raceResults=[];

pastRaces.forEach(
function(race,index){

const result =
judgeSingleRace(
race.position
);

if(!result){
return;
}

const weight =
Math.max(
0.25,
1-(index*0.10)
);

let points =
10*weight;

points +=
result.adjustment*2;

if(result.style==="逃げ"){

scores.escape += points;

}else if(result.style==="先行"){

scores.front += points;

}else if(result.style==="差し"){

scores.stalker += points;

}else if(result.style==="追込"){

scores.closer += points;

}

raceResults.push({

style:result.style,

weight:weight,

first:result.first,

second:result.second,

last:result.last,

distance:race.distance,

finish:race.finish,

date:race.date

});

}
);

const total =
Object.values(scores)
.reduce(
(a,b)=>a+b,
0
);

if(!total){

return {

style:"不明",

confidence:0,

consistency:0,

scores:scores

};

}

const ranking=[
["逃げ",scores.escape],
["先行",scores.front],
["差し",scores.stalker],
["追込",scores.closer]
];

ranking.sort(
(a,b)=>b[1]-a[1]
);

const top =
ranking[0];

const second =
ranking[1];

const dominance =
(top[1]/total)*100;

const separation =
((top[1]-second[1])/total)*100;

const topStyle =
top[0];

let sameCount=0;

raceResults.forEach(
function(r){

if(r.style===topStyle){

sameCount++;

}

});

const consistency =
raceResults.length
?
sameCount/raceResults.length*100
:0;

const recent =
raceResults.slice(0,3);

let recentSame=0;

recent.forEach(
function(r){

if(r.style===topStyle){

recentSame++;

}

});

const recentConsistency =
recent.length
?
recentSame/recent.length*100
:0;

let confidence =
dominance*0.30+
separation*0.30+
consistency*0.20+
recentConsistency*0.20;

if(raceResults.length===1){

confidence =
Math.min(
confidence,
45
);

}else if(raceResults.length===2){

confidence =
Math.min(
confidence,
65
);

}else if(raceResults.length===3){

confidence =
Math.min(
confidence,
78
);

}

confidence =
Math.max(
0,
Math.min(
100,
confidence
)
);

return {

style:topStyle,

confidence:confidence,

consistency:consistency,

scores:scores,

raceResults:raceResults,

dominance:dominance,

separation:separation,

recentConsistency:recentConsistency

};

}

/* =====================================================
   補助
===================================================== */

function clean(value){

return String(value||"")
.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
)
.replace(
/\[([^\]]+)\]\([^)]*\)/g,
"$1"
)
.replace(
/<[^>]+>/g,
""
)
.replace(
/&nbsp;/g,
" "
)
.replace(
/&amp;/g,
"&"
)
.replace(
/&quot;/g,
'"'
)
.replace(
/\s+/g,
" "
)
.trim();

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function sleep(ms){

return new Promise(
resolve=>setTimeout(
resolve,
ms
)
);

}
