<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.6.5</title>

<style>
body{
  margin:0;
  padding:16px;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
h1{font-size:22px;margin:0 0 6px}
.badge{
  display:inline-block;
  background:#2864e8;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
}
.card{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:10px;
  padding:14px;
  margin-top:14px;
}
label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  color:#aaa;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:8px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:15px;
}
button{
  background:#2864e8;
  border:0;
  font-weight:bold;
}
button:active{opacity:.7}
#status{
  white-space:pre-wrap;
  line-height:1.6;
  font-size:13px;
}
.races{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.races button{
  background:#292929;
}
.races button.active{
  background:#2864e8;
}
.horse{
  border:1px solid #333;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
}
.small{
  color:#aaa;
  font-size:12px;
}
.good{color:#55dc88}
.bad{color:#ff6666}
</style>
</head>

<body>

<h1>競馬展開ラボ</h1>
<span class="badge">v0.6.5 診断版</span>

<div class="card">

  <label>日付</label>
  <input type="date" id="raceDate">

  <br><br>

  <button id="fetchBtn">開催情報を取得</button>

</div>


<div class="card">

  <h3>診断状況</h3>

  <div id="status">
待機中
  </div>

</div>


<div class="card">

  <h3>レース選択</h3>

  <div id="raceButtons" class="races">
    まだ取得していません
  </div>

</div>


<div class="card">

  <h3>出馬表</h3>

  <div id="horses">
    レースを選択してください
  </div>

</div>


<script>

/* =====================================================
   v0.6.5
   まずJavaScriptが確実に動くことを確認する
===================================================== */

console.log("v0.6.5 JavaScript START");


/* -----------------------------------------------------
   初期状態
----------------------------------------------------- */

const statusBox =
  document.getElementById("status");

const fetchBtn =
  document.getElementById("fetchBtn");

const raceDate =
  document.getElementById("raceDate");

const raceButtons =
  document.getElementById("raceButtons");

const horsesBox =
  document.getElementById("horses");


/* -----------------------------------------------------
   今日の日付をセット
----------------------------------------------------- */

const now = new Date();

const yyyy =
  now.getFullYear();

const mm =
  String(now.getMonth()+1).padStart(2,"0");

const dd =
  String(now.getDate()).padStart(2,"0");

raceDate.value =
  yyyy + "-" + mm + "-" + dd;


/* -----------------------------------------------------
   JavaScript起動確認
----------------------------------------------------- */

statusBox.innerHTML =
  '<span class="good">JavaScript OK</span>\n' +
  'v0.6.5 起動済み';


/* -----------------------------------------------------
   ステータス表示
----------------------------------------------------- */

function status(message){

  statusBox.textContent =
    message;

}


/* -----------------------------------------------------
   Jina Reader
----------------------------------------------------- */

async function jinaFetch(url){

  status(
    "Jina Readerへ接続中...\n\n" +
    url
  );

  const readerUrl =
    "https://r.jina.ai/" + url;

  console.log(
    "Jina URL:",
    readerUrl
  );

  const response =
    await fetch(readerUrl);

  console.log(
    "HTTP:",
    response.status
  );

  if(!response.ok){

    throw new Error(
      "Jina HTTP " +
      response.status
    );

  }

  const text =
    await response.text();

  console.log(
    "取得文字数:",
    text.length
  );

  return text;

}


/* -----------------------------------------------------
   開催情報取得ボタン
----------------------------------------------------- */

fetchBtn.addEventListener(
  "click",
  async function(){

    console.log(
      "fetchMeeting START"
    );

    status(
      "① ボタン動作OK\n" +
      "開催情報取得を開始..."
    );


    const date =
      raceDate.value;


    if(!date){

      status(
        "日付が選択されていません"
      );

      return;

    }


    const ymd =
      date.replaceAll("-","");


    const url =
      "https://race.netkeiba.com/top/race_list.html?kaisai_date=" +
      ymd;


    try{

      status(
        "② 日付取得OK\n" +
        "③ Jinaへアクセス中...\n\n" +
        url
      );


      const text =
        await jinaFetch(url);


      status(
        "④ Jina取得成功\n\n" +
        "取得文字数: " +
        text.length
      );


      console.log(
        "開催情報RAW:",
        text
      );


      const ids = [
        ...new Set(
          [
            ...text.matchAll(
              /race_id=(\d{12})/g
            )
          ]
          .map(
            m => m[1]
          )
        )
      ];


      console.log(
        "race IDs:",
        ids
      );


      if(!ids.length){

        status(
          "⑤ Jina取得成功\n\n" +
          "しかしrace_idが見つかりませんでした。\n\n" +
          "取得文字数: " +
          text.length
        );

        return;

      }


      status(
        "⑤ 開催情報解析成功\n\n" +
        "race数: " +
        ids.length
      );


      renderRaces(ids);

    }
    catch(error){

      console.error(
        "取得エラー:",
        error
      );


      status(
        "❌ エラー発生\n\n" +
        error.message
      );

    }

  }
);


/* -----------------------------------------------------
   レースボタン生成
----------------------------------------------------- */

function renderRaces(ids){

  raceButtons.innerHTML = "";

  ids.sort();


  ids.forEach(
    function(id){

      const button =
        document.createElement("button");


      const raceNo =
        Number(
          id.slice(-2)
        );


      button.textContent =
        raceNo + "R";


      button.addEventListener(
        "click",
        function(){

          selectRace(
            id,
            button
          );

        }
      );


      raceButtons.appendChild(
        button
      );

    }
  );

}


/* -----------------------------------------------------
   レース選択
----------------------------------------------------- */

async function selectRace(
  id,
  button
){

  document
    .querySelectorAll(".races button")
    .forEach(
      b => b.classList.remove("active")
    );


  button.classList.add("active");


  const url =
    "https://race.netkeiba.com/race/shutuba.html?race_id=" +
    id;


  try{

    status(
      "出馬表取得中...\n\n" +
      "race_id: " +
      id
    );


    const text =
      await jinaFetch(url);


    status(
      "出馬表取得成功\n\n" +
      "race_id: " +
      id +
      "\n" +
      "文字数: " +
      text.length
    );


    const parsed =
      parseRacePage(text);


    renderHorses(parsed);


  }
  catch(error){

    console.error(error);

    status(
      "❌ 出馬表取得失敗\n\n" +
      error.message
    );

  }

}


/* -----------------------------------------------------
   出馬表解析
----------------------------------------------------- */

function parseRacePage(text){

  const lines =
    text.split(/\r?\n/);


  const result = [];

  const used =
    new Set();


  for(
    const line of lines
  ){

    if(
      !line.includes(
        "db.netkeiba.com/horse/"
      )
    ){
      continue;
    }


    const cells =
      line
        .split("|")
        .map(
          x => x.trim()
        );


    if(cells.length < 10){
      continue;
    }


    /*
      実際のnetkeiba表

      cells[1] 枠番
      cells[2] 馬番
      cells[3] 印
      cells[4] 馬名
      cells[5] 性齢
      cells[6] 斤量
      cells[7] 騎手
      cells[8] 厩舎
      cells[9] 馬体重
      cells[10] オッズ
      cells[11] 人気
    */


    const frame =
      Number(
        clean(
          cells[1]
        )
      );


    const number =
      Number(
        clean(
          cells[2]
        )
      );


    if(
      !Number.isInteger(frame) ||
      frame < 1 ||
      frame > 8
    ){
      continue;
    }


    if(
      !Number.isInteger(number) ||
      number < 1 ||
      number > 18
    ){
      continue;
    }


    if(
      used.has(number)
    ){
      continue;
    }


    /*
      馬名はtitle属性から取得
    */

    let name = "";


    const titleMatch =
      line.match(
        /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
      );


    if(titleMatch){

      name =
        clean(
          titleMatch[1]
        );

    }


    /*
      titleが取れない場合
    */

    if(!name){

      const fallback =
        line.match(
          /\[([^\]]+)\]\(https?:\/\/db\.netkeiba\.com\/horse\/\d+/
        );


      if(fallback){

        name =
          clean(
            fallback[1]
          );

        name =
          name.replace(
            /!\[[^\]]*\]\([^)]*\)/g,
            ""
          );

        name =
          clean(name);

      }

    }


    if(!name){
      continue;
    }


    const sexAge =
      clean(
        cells[5] || ""
      );


    const weight =
      clean(
        cells[6] || ""
      );


    let jockey =
      clean(
        cells[7] || ""
      );


    jockey =
      jockey.replace(
        /\[([^\]]+)\]\([^)]*\)/g,
        "$1"
      );


    let trainer =
      clean(
        cells[8] || ""
      );


    trainer =
      trainer.replace(
        /\[([^\]]+)\]\([^)]*\)/g,
        "$1"
      );


    const odds =
      Number(
        clean(
          cells[10] || ""
        )
      );


    const popularity =
      Number(
        clean(
          cells[11] || ""
        )
      );


    result.push({

      frame:frame,

      number:number,

      name:name,

      sexAge:sexAge,

      weight:weight,

      jockey:jockey,

      trainer:trainer,

      odds:
        Number.isFinite(odds)
          ? odds
          : 0,

      popularity:
        Number.isFinite(popularity)
          ? popularity
          : 0

    });


    used.add(number);

  }


  result.sort(
    (a,b) =>
      a.number - b.number
  );


  console.log(
    "解析結果:",
    result
  );


  console.log(
    "取得頭数:",
    result.length
  );


  return result;

}


/* -----------------------------------------------------
   文字列クリーニング
----------------------------------------------------- */

function clean(value){

  return String(
    value || ""
  )
  .replace(
    /!\[[^\]]*\]\([^)]*\)/g,
    ""
  )
  .replace(
    /\[([^\]]+)\]\([^)]*\)/g,
    "$1"
  )
  .replace(
    /<[^>]+>/g,
    ""
  )
  .replace(
    /&nbsp;/g,
    " "
  )
  .replace(
    /&amp;/g,
    "&"
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/* -----------------------------------------------------
   出馬表表示
----------------------------------------------------- */

function renderHorses(list){

  if(!list.length){

    horsesBox.innerHTML =
      '<span class="bad">馬を取得できませんでした。</span>';

    return;

  }


  let html = "";


  list.forEach(
    function(h){

      html += `

        <div class="horse">

          <strong>
            ${h.number}.
            ${escapeHtml(h.name)}
          </strong>

          <div class="small">

            枠番:
            ${h.frame}

            ／

            性齢:
            ${escapeHtml(h.sexAge)}

            ／

            斤量:
            ${escapeHtml(h.weight)}

          </div>

          <div class="small">

            騎手:
            ${escapeHtml(h.jockey)}

            ／

            厩舎:
            ${escapeHtml(h.trainer)}

          </div>

          <div class="small">

            オッズ:
            ${
              h.odds > 0
                ? h.odds
                : "--"
            }

            ／

            人気:
            ${
              h.popularity > 0
                ? h.popularity
                : "--"
            }

          </div>

        </div>

      `;

    }
  );


  horsesBox.innerHTML =
    html;


  status(
    "出馬表解析成功\n\n" +
    "取得頭数: " +
    list.length +
    "\n" +
    "馬番: " +
    list
      .map(h => h.number)
      .join(",")
  );

}


/* -----------------------------------------------------
   HTMLエスケープ
----------------------------------------------------- */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


console.log(
  "v0.6.5 JavaScript END"
);

</script>

</body>
</html>
