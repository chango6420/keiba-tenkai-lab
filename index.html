<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競馬展開ラボ v0.8</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:0;
  background:#0f1115;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:16px;
  background:#171a21;
  border-bottom:1px solid #292e38;
}

h1{margin:0;font-size:22px}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 8px;
  border-radius:5px;
  background:#2864e8;
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.card{
  background:#171a21;
  border:1px solid #292e38;
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

h2{margin:0 0 12px;font-size:18px}

h3{margin:14px 0 8px;font-size:15px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

label{
  display:block;
  margin-bottom:5px;
  color:#aeb5c2;
  font-size:12px;
}

input,select,button{
  width:100%;
  border:1px solid #343b48;
  border-radius:8px;
  background:#0f1115;
  color:#fff;
  padding:10px;
  font-size:14px;
}

button{
  background:#2864e8;
  border:none;
  font-weight:700;
}

button:active{opacity:.75}

button.secondary{
  background:#292f3b;
}

.races{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

@media(min-width:700px){
  .races{
    grid-template-columns:repeat(6,1fr);
  }
}

.races button{
  background:#222832;
  border:1px solid #39414e;
}

.races button.active{
  background:#2864e8;
}

.status{
  white-space:pre-wrap;
  line-height:1.6;
  background:#0d0f13;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  color:#bfc6d3;
}

.horse-card{
  background:#101318;
  border:1px solid #2b3039;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.horse-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.horse-name{
  font-weight:700;
  font-size:15px;
}

.meta{
  margin-top:5px;
  color:#9fa7b4;
  font-size:12px;
}

.tag{
  display:inline-block;
  padding:3px 7px;
  border-radius:5px;
  background:#292f3b;
  font-size:11px;
}

.good{color:#55dc88}
.warn{color:#ffd05a}
.bad{color:#ff6b6b}
.muted{color:#8d95a3;font-size:12px}

.progress{
  height:8px;
  background:#292f3b;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.progress div{
  height:100%;
  background:#2864e8;
  width:0%;
}
</style>
</head>

<body>

<header>
<h1>競馬展開ラボ</h1>
<span class="badge">v0.8 過去走・脚質解析</span>
</header>

<div class="container">

<div class="card">

<h2>レース設定</h2>

<div class="grid">

<div>
<label>日付</label>
<input type="date" id="raceDate">
</div>

<div>
<label>競馬場</label>
<select id="course">
<option>東京</option>
<option>中山</option>
<option>京都</option>
<option>阪神</option>
<option>中京</option>
<option>新潟</option>
<option>小倉</option>
<option>福島</option>
<option>札幌</option>
<option>函館</option>
</select>
</div>

<div>
<label>レース番号</label>
<select id="raceNo">
<option>1R</option>
<option>2R</option>
<option>3R</option>
<option>4R</option>
<option>5R</option>
<option>6R</option>
<option>7R</option>
<option>8R</option>
<option>9R</option>
<option>10R</option>
<option>11R</option>
<option>12R</option>
</select>
</div>

<div>
<label>距離</label>
<input id="distance" type="number" value="1600">
</div>

</div>

<br>

<button id="fetchMeetingBtn">
開催情報を取得
</button>

</div>


<div class="card">

<h2>レース選択</h2>

<div id="raceButtons" class="races">
<div class="muted">
開催情報を取得してください
</div>
</div>

</div>


<div class="card">

<h2>取得状況</h2>

<div id="status" class="status">
JavaScript OK
</div>

</div>


<div class="card">

<h2>出馬表</h2>

<div id="horseList">
<div class="muted">
レースを選択してください。
</div>
</div>

<br>

<button id="analyzeBtn">
過去走を取得して脚質を解析
</button>

</div>


<div class="card">

<h2>脚質解析結果</h2>

<div id="styleResult">
<div class="muted">
まだ解析していません。
</div>
</div>

</div>

</div>


<script>

/* =====================================================
   v0.8
   現在出馬表取得
   ↓
   馬ページURL取得
   ↓
   過去走解析
   ↓
   脚質推定
===================================================== */

let horses = [];
let raceId = "";


/* =====================================================
   初期化
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

const now = new Date();

const yyyy =
now.getFullYear();

const mm =
String(now.getMonth()+1).padStart(2,"0");

const dd =
String(now.getDate()).padStart(2,"0");

document.getElementById("raceDate").value =
yyyy+"-"+mm+"-"+dd;


document
.getElementById("fetchMeetingBtn")
.addEventListener(
"click",
fetchMeeting
);


document
.getElementById("analyzeBtn")
.addEventListener(
"click",
analyzeAllHorses
);

});


/* =====================================================
   ステータス
===================================================== */

function status(text){

document
.getElementById("status")
.textContent = text;

}


/* =====================================================
   Jina取得
===================================================== */

async function jinaFetch(url){

const readerUrl =
"https://r.jina.ai/"+url;

const response =
await fetch(readerUrl);

if(!response.ok){

throw new Error(
"Jina HTTP "+response.status
);

}

return await response.text();

}


/* =====================================================
   開催情報
===================================================== */

async function fetchMeeting(){

const date =
document.getElementById("raceDate").value;

if(!date){

alert("日付を選択してください。");
return;

}

const ymd =
date.replace(/-/g,"");

const url =
"https://race.netkeiba.com/top/race_list.html?kaisai_date="+ymd;

status(
"開催情報取得中...\n"+
url
);

try{

const text =
await jinaFetch(url);

const ids = [
...new Set(
[...text.matchAll(/race_id=(\d{12})/g)]
.map(m=>m[1])
)
];

if(!ids.length){

throw new Error(
"race_idが見つかりませんでした"
);

}

renderRaces(ids);

status(
"開催情報取得成功\n"+
"レース数: "+ids.length
);

}catch(error){

console.error(error);

status(
"開催情報取得失敗\n"+
error.message
);

}

}


/* =====================================================
   レースボタン
===================================================== */

function renderRaces(ids){

const area =
document.getElementById("raceButtons");

area.innerHTML="";

ids.sort();

ids.forEach(function(id){

const button =
document.createElement("button");

const no =
Number(id.slice(-2));

button.textContent =
no+"R";

button.addEventListener(
"click",
function(){

selectRace(id,button);

}
);

area.appendChild(button);

});

}


/* =====================================================
   レース取得
===================================================== */

async function selectRace(
id,
button
){

raceId=id;

document
.querySelectorAll(".races button")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

const url =
"https://race.netkeiba.com/race/shutuba.html?race_id="+id;

status(
"出馬表取得中...\n"+
"race_id: "+id
);

try{

const text =
await jinaFetch(url);

horses =
parseRacePage(text);

if(!horses.length){

throw new Error(
"馬が取得できませんでした"
);

}

renderHorses();

status(
"出馬表取得成功\n"+
"取得頭数: "+horses.length
);

}catch(error){

console.error(error);

status(
"出馬表取得失敗\n"+
error.message
);

}

}


/* =====================================================
   出馬表解析
===================================================== */

function parseRacePage(text){

const lines =
text.split(/\r?\n/);

const result=[];
const used=new Set();

for(const line of lines){

if(
!line.includes(
"db.netkeiba.com/horse/"
)
){
continue;
}

const cells =
line
.split("|")
.map(x=>x.trim());

if(cells.length<10){
continue;
}

const frame =
Number(clean(cells[1]));

const number =
Number(clean(cells[2]));

if(
!Number.isInteger(frame) ||
frame<1 ||
frame>8
){
continue;
}

if(
!Number.isInteger(number) ||
number<1 ||
number>18
){
continue;
}

if(used.has(number)){
continue;
}


const name =
extractHorseName(line);

if(!name){
continue;
}


/*
馬ページURLを保存する。
これが今回の重要ポイント。
*/

const horseUrlMatch =
line.match(
/https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

const horseUrl =
horseUrlMatch
?horseUrlMatch[0]
:"";


result.push({

frame:frame,

number:number,

name:name,

sexAge:clean(cells[5]||""),

weight:clean(cells[6]||""),

jockey:clean(cells[7]||""),

trainer:clean(cells[8]||""),

odds:Number(clean(cells[10]||""))||0,

popularity:Number(clean(cells[11]||""))||0,

horseUrl:horseUrl,

pastRaces:[],

style:"判定中",

styleScore:{
escape:0,
front:0,
stalker:0,
closer:0
},

styleConfidence:0

});

used.add(number);

}

result.sort(
(a,b)=>a.number-b.number
);

return result;

}


/* =====================================================
   馬名
===================================================== */

function extractHorseName(line){

let m =
line.match(
/db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
);

if(m){

return clean(m[1]);

}

const fallback =
line.match(
/\[([^\]]+)\]\(https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

if(fallback){

return clean(
fallback[1]
.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
)
);

}

return "";

}


/* =====================================================
   全馬解析
===================================================== */

async function analyzeAllHorses(){

if(!horses.length){

alert(
"先にレースを選択してください。"
);

return;

}

const button =
document.getElementById("analyzeBtn");

button.disabled=true;

button.textContent=
"過去走を取得中...";


try{

for(
let i=0;
i<horses.length;
i++
){

const h=horses[i];

status(
"過去走解析中...\n"+
(i+1)+" / "+horses.length+
"\n\n"+
h.number+". "+
h.name
);

try{

if(!h.horseUrl){

throw new Error(
"馬ページURLなし"
);

}

const text =
await jinaFetch(
h.horseUrl
);

h.pastRaces =
parsePastRaces(text);

h.styleData =
judgeRunningStyle(
h.pastRaces
);

h.style =
h.styleData.style;

h.styleConfidence =
h.styleData.confidence;

h.styleScore =
h.styleData.score;

}catch(error){

console.warn(
h.name,
error
);

h.pastRaces=[];

h.styleData={
style:"不明",
confidence:0,
score:{
escape:0,
front:0,
stalker:0,
closer:0
}
};

h.style="不明";

}


/*
サーバー側への負荷を考えて
少し待つ。
*/

await sleep(250);

renderStyleResult();

}

status(
"過去走解析完了\n"+
"解析頭数: "+horses.length
);

}catch(error){

console.error(error);

status(
"解析中にエラー\n"+
error.message
);

}

button.disabled=false;

button.textContent=
"過去走を取得して脚質を解析";

}


/* =====================================================
   過去走解析
===================================================== */

function parsePastRaces(text){

const lines =
text.split(/\r?\n/);

const races=[];


/*
netkeibaの過去走表は
馬ページ内に複数の表がある。

今回はまず
「通過順位」
「着順」
「距離」
「日付」
などを持つ行を候補にする。
*/

for(const line of lines){

if(!line.includes("|")){
continue;
}

const cells =
line
.split("|")
.map(x=>clean(x));

if(cells.length<8){
continue;
}


/*
通過順位らしき文字列を探す。
例:
1-1
2-2
3-4-5
8-7
*/

let positionText="";

for(const cell of cells){

if(
/^\d+(?:-\d+)+$/.test(cell)
){

positionText=cell;

break;

}

}


/*
着順候補
*/

let finish=0;

for(const cell of cells){

const n=
Number(cell);

if(
Number.isInteger(n) &&
n>=1 &&
n<=18
){

/*
最初に現れる小さい数字を候補にする。
*/

if(!finish){

finish=n;

}

}

}


if(!positionText){
continue;
}


/*
距離
*/

let distance=0;

for(const cell of cells){

const m=
cell.match(
/(\d{3,4})/
);

if(m){

const d=
Number(m[1]);

if(
d>=1000 &&
d<=4000
){

distance=d;

break;

}

}

}


races.push({

finish:finish,

position:positionText,

distance:distance

});

}


/*
同じ行が重複することがあるため
最大10走まで。
*/

return races
.slice(0,10);

}


/* =====================================================
   脚質判定
===================================================== */

function judgeRunningStyle(
pastRaces
){

const score={
escape:0,
front:0,
stalker:0,
closer:0
};

if(!pastRaces.length){

return {

style:"不明",

confidence:0,

score:score

};

}


pastRaces.forEach(function(race){

const nums =
race.position
.split("-")
.map(Number)
.filter(
n=>Number.isFinite(n)
);

if(!nums.length){
return;
}


/*
先頭通過順位。
*/

const first =
nums[0];


/*
過去走の頭数は
完全には取れないため、
現段階では順位そのものを
脚質判定に使う。
*/


if(first===1){

score.escape+=4;

}else if(first<=3){

score.front+=4;

}else if(first<=6){

score.stalker+=4;

}else{

score.closer+=4;

}


/*
2つ目以降も見る。

道中ずっと前なら前受け能力を加点。
*/

if(nums.length>=2){

const second=nums[1];

if(second===1){

score.escape+=2;

}else if(second<=3){

score.front+=2;

}else if(second<=6){

score.stalker+=2;

}else{

score.closer+=2;

}

}

});


const entries=[
["逃げ",score.escape],
["先行",score.front],
["差し",score.stalker],
["追込",score.closer]
];

entries.sort(
(a,b)=>b[1]-a[1]
);

const top=entries[0];
const second=entries[1];

const total=
Object.values(score)
.reduce(
(a,b)=>a+b,
0
);

let confidence=0;

if(total>0){

confidence =
(top[1]-second[1])
/
total
*100;

confidence =
Math.max(
0,
Math.min(
100,
confidence
)
);

}


return {

style:top[0],

confidence:confidence,

score:score

};

}


/* =====================================================
   表示
===================================================== */

function renderHorses(){

const area =
document.getElementById("horseList");

let html="";

horses.forEach(function(h){

html+=`

<div class="horse-card">

<div class="horse-head">

<div class="horse-name">

${h.number}.
${escapeHtml(h.name)}

</div>

<div>

${
h.odds
?h.odds.toFixed(1)+"倍"
:"--"
}

</div>

</div>

<div class="meta">

枠:
${h.frame}

/
${escapeHtml(h.sexAge)}

/
斤量:
${escapeHtml(h.weight)}

/
${escapeHtml(h.jockey)}

/
${h.popularity
?h.popularity+"人気"
:"--"}

</div>

<div class="meta">

脚質:
<span class="tag">
${h.style}
</span>

</div>

</div>

`;

});

area.innerHTML=html;

}


/* =====================================================
   脚質結果
===================================================== */

function renderStyleResult(){

const area =
document.getElementById("styleResult");

let html="";

horses.forEach(function(h){

const data =
h.styleData;

const confidence =
data
?data.confidence
:0;

html+=`

<div class="horse-card">

<div class="horse-head">

<div class="horse-name">

${h.number}.
${escapeHtml(h.name)}

</div>

<div class="tag">

${h.style}

</div>

</div>

<div class="meta">

過去走:
${h.pastRaces.length}走

/
判定信頼度:
${confidence.toFixed(0)}%

</div>

<div class="progress">

<div style="
width:${confidence}%;
"></div>

</div>

<div class="meta">

逃げ:
${data?data.score.escape:0}

/
先行:
${data?data.score.front:0}

/
差し:
${data?data.score.stalker:0}

/
追込:
${data?data.score.closer:0}

</div>

</div>

`;

});

area.innerHTML=html;

renderHorses();

}


/* =====================================================
   補助
===================================================== */

function clean(value){

return String(value||"")
.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
)
.replace(
/\[([^\]]+)\]\([^)]*\)/g,
"$1"
)
.replace(
/<[^>]+>/g,
""
)
.replace(
/&nbsp;/g,
" "
)
.replace(
/&amp;/g,
"&"
)
.replace(
/\s+/g,
" "
)
.trim();

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function sleep(ms){

return new Promise(
resolve=>setTimeout(
resolve,
ms
)
);

}

</script>

</body>
</html>
