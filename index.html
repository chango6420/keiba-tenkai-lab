<body>

<header>
  <h1>競馬展開ラボ</h1>
  <div class="sub">v1.0.0｜逃げ予想・隊列予想・展開アニメーション</div>
</header>

<main>

<div class="card">
  <h2>① 開催取得</h2>

  <input id="dateInput" type="date">

  <button onclick="loadMeeting()">開催を取得</button>

  <select id="raceSelect">
    <option value="">レースを選択</option>
  </select>

  <button onclick="loadRace()">出馬表を取得</button>

  <div id="status" class="status">待機中</div>
</div>


<div class="card">
  <h2>② 今回の逃げ予想</h2>

  <div id="escapeForecast" class="forecast">
    まだ解析していません。
  </div>
</div>


<div class="card">
  <h2>③ 想定隊列</h2>

  <div id="formation">
    まだ解析していません。
  </div>
</div>


<div class="card">
  <h2>④ 展開アニメーション</h2>

  <div class="controls">
    <button onclick="playAnimation()">▶ 再生</button>
    <button class="secondary" onclick="pauseAnimation()">Ⅱ 一時停止</button>
    <button class="secondary" onclick="resetAnimation()">↺ リセット</button>
    <br>
    <button class="secondary" onclick="setSpeed(0.5)">0.5倍</button>
    <button class="secondary" onclick="setSpeed(1)">1倍</button>
    <button class="secondary" onclick="setSpeed(2)">2倍</button>
  </div>

  <div id="courseInfo" class="small" style="margin:10px 0">
    コース未設定
  </div>

  <div id="course"></div>
</div>


<div class="card">
  <h2>⑤ 各馬分析</h2>

  <div id="horses">
    まだ出馬表を取得していません。
  </div>
</div>

</main>


<script>

const JINA="https://r.jina.ai/";

let horses=[];
let raceId="";
let raceText="";
let raceInfo={};

let animationFrame=null;
let animationStart=0;
let animationPausedAt=0;
let animationRunning=false;
let animationSpeed=1;

let svgState=null;


/* =========================
   基本
========================= */

function clean(v){
  return String(v ?? "")
    .replace(/<[^>]*>/g," ")
    .replace(/\[[^\]]*\]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function setStatus(text){
  document.getElementById("status").textContent=text;
}

async function jinaFetch(url){

  const response=await fetch(JINA+url);

  if(!response.ok){
    throw new Error("Jina HTTP "+response.status);
  }

  return await response.text();
}


/* =========================
   開催取得
========================= */

async function loadMeeting(){

  const date=document.getElementById("dateInput").value;

  if(!date){
    setStatus("日付を選択してください");
    return;
  }

  try{

    setStatus("開催情報を取得中…");

    const url=
      "https://race.netkeiba.com/top/race_list.html?kaisai_date="
      +date.replaceAll("-","");

    const text=await jinaFetch(url);

    const ids=[
      ...text.matchAll(/race_id=(\d{12})/g)
    ].map(m=>m[1]);

    const unique=[...new Set(ids)];

    const select=document.getElementById("raceSelect");

    select.innerHTML=
      '<option value="">レースを選択</option>';

    unique.forEach(id=>{

      const option=document.createElement("option");

      option.value=id;

      const raceNo=Number(id.slice(-2));

      option.textContent=
        id+"｜"+raceNo+"R";

      select.appendChild(option);

    });

    setStatus(
      "開催取得完了\n"+
      unique.length+
      "件のレースIDを取得しました"
    );

  }catch(e){

    console.error(e);

    setStatus(
      "開催取得失敗\n"+
      e.message
    );
  }
}


/* =========================
   出馬表
========================= */

async function loadRace(){

  raceId=document.getElementById("raceSelect").value;

  if(!raceId){
    setStatus("レースを選択してください");
    return;
  }

  try{

    setStatus("出馬表を取得中…");

    const url=
      "https://race.netkeiba.com/race/shutuba.html?race_id="
      +raceId;

    raceText=await jinaFetch(url);

    horses=parseShutuba(raceText);

    parseRaceHeader(raceText);

    if(!horses.length){

      setStatus(
        "出馬表を取得しましたが、馬を解析できませんでした"
      );

      return;
    }

    setStatus(
      "出馬表取得完了\n"+
      horses.length+
      "頭"
    );

    renderHorses();

    await loadPastNine();

  }catch(e){

    console.error(e);

    setStatus(
      "レース取得失敗\n"+
      e.message
    );
  }
}


/* =========================
   出馬表解析
========================= */

function parseShutuba(text){

  const result=[];
  const seen=new Set();

  const lines=text.split(/\r?\n/);

  for(const line of lines){

    if(!line.includes("|")) continue;

    const cells=line
      .split("|")
      .map(x=>clean(x));

    if(cells.length<8) continue;

    let frame=Number(cells[1]);
    let number=Number(cells[2]);

    if(
      !Number.isInteger(frame) ||
      frame<1 ||
      frame>8
    ) continue;

    if(
      !Number.isInteger(number) ||
      number<1 ||
      number>18
    ) continue;

    const titleMatch=
      line.match(
        /db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
      );

    if(!titleMatch) continue;

    const name=clean(titleMatch[1]);

    if(!name) continue;

    if(seen.has(number)) continue;

    seen.add(number);

    let odds=0;
    let popularity=0;

    for(let i=0;i<cells.length;i++){

      const n=Number(
        cells[i].replace(/[^0-9.]/g,"")
      );

      if(
        n>0 &&
        n<1000 &&
        i>5
      ){
        if(!odds) odds=n;
      }
    }

    result.push({

      frame,
      number,
      name,

      style:"不明",

      styleScore:{
        escape:0,
        front:0,
        stalker:0,
        closer:0
      },

      confidence:0,

      past:[],

      odds,
      popularity,

      netkeibaPosition:{
        start:"",
        corner3:"",
        corner4:""
      },

      predictedGroup:"中団",

      escapeScore:0

    });

  }

  result.sort((a,b)=>a.number-b.number);

  return result;
}


/* =========================
   レース情報
========================= */

function parseRaceHeader(text){

  const lines=text.split(/\r?\n/);

  let course="";

  const venues=[
    "札幌",
    "函館",
    "福島",
    "新潟",
    "東京",
    "中山",
    "中京",
    "京都",
    "阪神",
    "小倉"
  ];

  for(const line of lines){

    const c=clean(line);

    for(const v of venues){

      if(c.includes(v)){

        course=v;
        break;
      }
    }

    if(course) break;
  }

  let surface="";

  if(
    text.includes("芝")
  ){
    surface="芝";
  }

  if(
    text.includes("ダート") ||
    text.includes("ダ ")
  ){
    surface="ダート";
  }

  let distance=0;

  const matches=[
    ...text.matchAll(
      /(?:芝|ダート|ダ)[^\d]{0,5}(\d{3,4})m/g
    )
  ];

  if(matches.length){
    distance=Number(matches[0][1]);
  }

  if(!distance){

    const m=text.match(
      /\b(1000|1100|1150|1200|1300|1400|1500|1600|1700|1800|1900|2000|2100|2200|2300|2400|2500|2600|2800|3000|3200|3400|3600)\b/
    );

    if(m){
      distance=Number(m[1]);
    }
  }

  raceInfo={
    course,
    surface,
    distance
  };
}


/* =========================
   過去9走を一括取得
========================= */

async function loadPastNine(){

  try{

    setStatus(
      "過去走9走を一括取得中…"
    );

    const url=
      "https://race.netkeiba.com/race/shutuba_past_9.html?race_id="
      +raceId;

    const text=await jinaFetch(url);

    const parsed=parsePastNine(text);

    if(!parsed.length){

      setStatus(
        "過去走ページは取得しましたが、\n"+
        "過去走を解析できませんでした"
      );

      return;
    }

    for(const horse of horses){

      const data=parsed.find(
        x=>x.number===horse.number
      );

      if(data){

        horse.past=data.past;

        analyseHorse(horse);
      }
    }

    parseNetkeibaFormation(text);

    analyseFormation();

    renderHorses();

    renderForecast();

    renderFormation();

    renderCourse();

    setStatus(
      "解析完了\n"+
      horses.length+
      "頭\n"+
      "過去走解析："+parsed.length+"頭"
    );

  }catch(e){

    console.error(e);

    setStatus(
      "過去走解析失敗\n"+
      e.message
    );
  }
}


/* =========================
   過去9走解析
========================= */

function parsePastNine(text){

  const result=[];

  const lines=text.split(/\r?\n/);

  let currentHorse=null;

  for(let i=0;i<lines.length;i++){

    const line=lines[i];

    const numberMatch=
      line.match(
        /(?:^|\|)\s*(\d{1,2})\s*(?:\||$)/
      );

    if(
      numberMatch &&
      Number(numberMatch[1])>=1 &&
      Number(numberMatch[1])<=18
    ){

      const n=Number(numberMatch[1]);

      if(
        !currentHorse ||
        currentHorse.number!==n
      ){

        currentHorse={
          number:n,
          past:[]
        };

        result.push(currentHorse);
      }
    }

    if(!currentHorse) continue;

    if(!line.includes("|")) continue;

    const cells=line
      .split("|")
      .map(x=>clean(x));

    if(cells.length<5) continue;

    const dateIndex=cells.findIndex(
      x=>/^\d{4}[\/.]\d{1,2}[\/.]\d{1,2}$/.test(x)
    );

    if(dateIndex<0) continue;

    const date=cells[dateIndex];

    let finish=0;

    for(
      let j=dateIndex+1;
      j<Math.min(cells.length,dateIndex+15);
      j++
    ){

      const value=cells[j];

      const m=value.match(
        /^(\d{1,2})(?:着)?$/
      );

      if(m){

        const n=Number(m[1]);

        if(n>=1 && n<=18){

          finish=n;
          break;
        }
      }
    }

    let distance=0;
    let surface="";
    let going="";
    let course="";

    for(
      let j=dateIndex;
      j<Math.min(cells.length,dateIndex+25);
      j++
    ){

      const value=cells[j];

      const dm=
        value.match(
          /(芝|ダート|ダ|障)[^\d]{0,3}(\d{3,4})/
        );

      if(dm){

        surface=
          dm[1]==="芝"
          ? "芝"
          : dm[1].includes("ダ")
          ? "ダート"
          : "障害";

        distance=Number(dm[2]);
      }

      if(
        value==="良" ||
        value==="稍重" ||
        value==="重" ||
        value==="不良"
      ){
        going=value;
      }
    }

    const positionCandidates=[];

    for(
      let j=dateIndex;
      j<Math.min(cells.length,dateIndex+30);
      j++
    ){

      const value=cells[j];

      if(
        /^\d+(?:-\d+)+$/.test(value)
      ){

        positionCandidates.push(value);
      }
    }

    const position=
      positionCandidates.length
      ? positionCandidates[0]
      : "";

    if(
      currentHorse.past.some(
        x=>x.date===date &&
        x.position===position
      )
    ){
      continue;
    }

    if(
      finish ||
      position ||
      distance
    ){

      currentHorse.past.push({

        date,
        finish,
        position,
        distance,
        surface,
        going,
        course

      });

      if(
        currentHorse.past.length>=9
      ){
        continue;
      }
    }
  }

  return result;
}


/* =========================
   脚質分析
========================= */

function classifyPosition(position){

  if(!position) return "不明";

  const nums=
    position
      .split("-")
      .map(Number)
      .filter(Boolean);

  if(!nums.length) return "不明";

  const first=nums[0];

  if(first===1) return "逃げ";

  if(first<=3) return "先行";

  if(first<=6) return "差し";

  return "追込";
}


function analyseHorse(horse){

  const races=
    horse.past
      .filter(x=>x.position)
      .slice(0,9);

  if(!races.length){

    horse.style="不明";
    horse.confidence=0;
    horse.escapeScore=0;

    return;
  }

  let escape=0;
  let front=0;
  let stalker=0;
  let closer=0;

  races.forEach((race,index)=>{

    const weight=
      index===0 ? 5 :
      index===1 ? 4 :
      index===2 ? 3 :
      2;

    const style=
      classifyPosition(race.position);

    if(style==="逃げ"){
      escape+=weight;
    }

    if(style==="先行"){
      front+=weight;
    }

    if(style==="差し"){
      stalker+=weight;
    }

    if(style==="追込"){
      closer+=weight;
    }

  });

  horse.styleScore={
    escape,
    front,
    stalker,
    closer
  };

  const scores=[
    ["逃げ",escape],
    ["先行",front],
    ["差し",stalker],
    ["追込",closer]
  ];

  scores.sort((a,b)=>b[1]-a[1]);

  horse.style=scores[0][0];

  const total=
    escape+
    front+
    stalker+
    closer;

  if(total){

    horse.confidence=
      Math.round(
        scores[0][1]/total*100
      );
  }

  /*
   * 逃げ能力スコア
   *
   * 単純な逃げ回数ではなく
   * 直近を強く評価
   */

  horse.escapeScore=
    escape*1.8+
    front*0.75;

  /*
   * 直近で1角1番手なら加点
   */

  races.slice(0,3).forEach(
    (race,index)=>{

      const nums=
        race.position
          .split("-")
          .map(Number);

      if(
        nums[0]===1
      ){

        horse.escapeScore+=
          10-index*2;
      }

    }
  );

  /*
   * 逃げ経験が全くない馬は
   * 逃げ候補として大きく下げる
   */

  if(escape===0){

    horse.escapeScore*=0.35;
  }

}


/* =========================
   netkeiba展開予想
========================= */

function parseNetkeibaFormation(text){

  /*
   * ページ内に
   * 逃 / 先行 / 差 / 追込
   * が存在する場合に拾う。
   *
   * HTMLを直接依存しすぎないよう
   * 馬番周辺の文字列を調査する。
   */

  for(const horse of horses){

    const patterns=[
      new RegExp(
        horse.number+
        "[^\\n]{0,100}逃"
      ),
      new RegExp(
        horse.name+
        "[^\\n]{0,150}逃"
      )
    ];

    let found="";

    for(const p of patterns){

      const m=text.match(p);

      if(m){

        found=m[0];
        break;
      }
    }

    if(!found) continue;

    if(
      found.includes("逃")
    ){
      horse.netkeibaPosition.start="逃";
    }

    else if(
      found.includes("先")
    ){
      horse.netkeibaPosition.start="先行";
    }

    else if(
      found.includes("差")
    ){
      horse.netkeibaPosition.start="差";
    }

    else if(
      found.includes("追")
    ){
      horse.netkeibaPosition.start="追込";
    }

  }

}


/* =========================
   今回の隊列予想
========================= */

function analyseFormation(){

  /*
   * まず全馬を脚質から分類
   */

  horses.forEach(horse=>{

    const score=horse.escapeScore;

    if(score>=28){

      horse.predictedGroup="逃げ";

    }else if(
      horse.style==="逃げ" ||
      horse.style==="先行"
    ){

      horse.predictedGroup="先行";

    }else if(
      horse.style==="差し"
    ){

      horse.predictedGroup="中団";

    }else{

      horse.predictedGroup="後方";

    }

  });


  /*
   * 逃げ馬候補をスコア順に並べる
   */

  const sorted=
    [...horses]
      .sort(
        (a,b)=>
          b.escapeScore-a.escapeScore
      );

  if(!sorted.length) return;

  /*
   * 逃げ本命
   */

  const main=sorted[0];

  /*
   * 逃げスコア差が小さい馬は
   * ハナ争い候補
   */

  const second=sorted[1];

  if(second){

    const diff=
      main.escapeScore-
      second.escapeScore;

    if(diff<8){

      second.predictedGroup="逃げ候補";

    }

  }

  /*
   * 最上位だけ「逃げ」とする。
   */

  main.predictedGroup="逃げ";


  /*
   * 逃げ本命以外の逃げ型は
   * 先行に落とす
   */

  horses.forEach(horse=>{

    if(
      horse!==main &&
      horse.predictedGroup==="逃げ"
    ){

      horse.predictedGroup="先行";

    }

  });

}


/* =========================
   表示
========================= */

function styleClass(style){

  if(style==="逃げ") return "escape";
  if(style==="先行") return "front";
  if(style==="差し") return "stalker";
  if(style==="追込") return "closer";

  return "";
}


function renderHorses(){

  const el=
    document.getElementById("horses");

  if(!horses.length){

    el.innerHTML="馬がありません";

    return;
  }

  el.innerHTML=
    horses.map(horse=>{

      const recent=
        horse.past
          .slice(0,5)
          .map(r=>
            `${r.finish||"--"}着 ${
              r.position||"--"
            }`
          )
          .join(" / ");

      return `
        <div class="horse">

          <div class="horse-name">

            ${horse.number}番
            ${horse.name}

            <span class="badge ${styleClass(horse.style)}">
              ${horse.style}
            </span>

            <span class="badge">
              ${horse.predictedGroup}
            </span>

          </div>

          <div class="small">
            脚質信頼度：${horse.confidence}%
            ／逃げスコア：
            ${horse.escapeScore.toFixed(1)}
          </div>

          <div class="small">
            ${recent || "過去走データなし"}
          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   逃げ予想表示
========================= */

function renderForecast(){

  const el=
    document.getElementById("escapeForecast");

  const sorted=
    [...horses]
      .sort(
        (a,b)=>
          b.escapeScore-a.escapeScore
      );

  if(!sorted.length){

    el.textContent=
      "解析できる馬がありません";

    return;
  }

  const main=sorted[0];

  const second=sorted[1];

  let html="";

  html+=`
    <div>
      <span class="small">
        今回のハナ予想
      </span>
    </div>

    <div class="big">
      ◎ ${main.number}番 ${main.name}
    </div>

    <div>
      逃げスコア：
      ${main.escapeScore.toFixed(1)}
    </div>

    <div>
      過去脚質：
      ${main.style}
      ／信頼度 ${main.confidence}%
    </div>
  `;

  if(second){

    html+=`
      <hr style="border-color:#30363d">

      <div class="small">
        ハナ争い候補
      </div>

      <div>
        ○ ${second.number}番 ${second.name}
        ／
        ${second.escapeScore.toFixed(1)}
      </div>
    `;
  }

  el.innerHTML=html;
}


/* =========================
   隊列表示
========================= */

function renderFormation(){

  const groups={
    "逃げ":[],
    "逃げ候補":[],
    "先行":[],
    "中団":[],
    "後方":[]
  };

  horses.forEach(h=>{

    if(!groups[h.predictedGroup]){
      groups[h.predictedGroup]=[];
    }

    groups[h.predictedGroup].push(h);

  });

  let html="";

  [
    "逃げ",
    "逃げ候補",
    "先行",
    "中団",
    "後方"
  ].forEach(group=>{

    if(!groups[group].length) return;

    html+=`
      <div style="margin-bottom:8px">
        <strong>${group}</strong>：
        ${groups[group]
          .map(h=>
            `${h.number} ${h.name}`
          )
          .join(" ／ ")}
      </div>
    `;

  });

  document.getElementById(
    "formation"
  ).innerHTML=html;
}


/* =========================
   コース設定
========================= */

function getCourseConfig(){

  const venue=raceInfo.course;
  const surface=raceInfo.surface;
  const distance=raceInfo.distance;

  /*
   * 新潟芝1000は直線
   */

  if(
    venue==="新潟" &&
    surface==="芝" &&
    distance===1000
  ){

    return {
      type:"straight",
      label:"新潟 芝1000m 直線"
    };
  }

  /*
   * 基本は楕円。
   * 競馬場ごとの特徴を軽く反映。
   */

  let direction="右回り";

  if(
    venue==="東京" ||
    venue==="新潟" ||
    venue==="中京"
  ){

    direction="左回り";
  }

  return {
    type:"oval",
    label:
      (venue||"競馬場不明")+
      " "+
      (surface||"")+
      " "+
      (distance||"")+"m "+
      direction
  };
}


/* =========================
   SVG生成
========================= */

function renderCourse(){

  const config=
    getCourseConfig();

  document.getElementById(
    "courseInfo"
  ).textContent=
    config.label+
    "｜模式図";

  if(config.type==="straight"){

    renderStraightCourse();

  }else{

    renderOvalCourse();

  }

}


function renderStraightCourse(){

  const width=800;
  const height=280;

  const startX=80;
  const goalX=720;
  const y=140;

  let html=`
    <svg
      id="courseSvg"
      viewBox="0 0 ${width} ${height}"
      xmlns="http://www.w3.org/2000/svg"
    >

      <line
        x1="${startX}"
        y1="${y}"
        x2="${goalX}"
        y2="${y}"
        class="track"
      />

      <line
        x1="${startX}"
        y1="${y}"
        x2="${goalX}"
        y2="${y}"
        class="track-inner"
      />

      <text
        x="${startX}"
        y="70"
        class="marker-text"
      >
        START
      </text>

      <text
        x="${goalX-30}"
        y="70"
        class="marker-text"
      >
        GOAL
      </text>

      <g id="horseLayer"></g>

    </svg>
  `;

  document.getElementById(
    "course"
  ).innerHTML=html;

  svgState={
    type:"straight",
    width,
    height,
    startX,
    goalX,
    y
  };

  createHorseTokens();

}


/* =========================
   楕円コース
========================= */

function renderOvalCourse(){

  const width=800;
  const height=520;

  const cx=400;
  const cy=260;

  const rx=270;
  const ry=170;

  const path=`
    M ${cx-rx} ${cy}
    C ${cx-rx} ${cy-ry},
      ${cx-rx/2} ${cy-ry},
      ${cx} ${cy-ry}

    C ${cx+rx/2} ${cy-ry},
      ${cx+rx} ${cy-ry},
      ${cx+rx} ${cy}

    C ${cx+rx} ${cy+ry},
      ${cx+rx/2} ${cy+ry},
      ${cx} ${cy+ry}

    C ${cx-rx/2} ${cy+ry},
      ${cx-rx} ${cy+ry},
      ${cx-rx} ${cy}
  `;

  let html=`
    <svg
      id="courseSvg"
      viewBox="0 0 ${width} ${height}"
      xmlns="http://www.w3.org/2000/svg"
    >

      <path
        id="trackPath"
        d="${path}"
        class="track"
      />

      <path
        d="${path}"
        class="track-inner"
      />

      <circle
        cx="${cx-rx}"
        cy="${cy}"
        r="8"
        class="marker"
      />

      <text
        x="${cx-rx-25}"
        y="${cy-25}"
        class="marker-text"
      >
        START
      </text>

      <circle
        cx="${cx}"
        cy="${cy-ry}"
        r="7"
        class="marker"
      />

      <text
        x="${cx+10}"
        y="${cy-ry-10}"
        class="marker-text"
      >
        3C
      </text>

      <circle
        cx="${cx+rx}"
        cy="${cy}"
        r="7"
        class="marker"
      />

      <text
        x="${cx+10}"
        y="${cy+30}"
        class="marker-text"
      >
        4C
      </text>

      <circle
        cx="${cx-rx}"
        cy="${cy}"
        r="7"
        class="marker"
      />

      <text
        x="${cx-rx-25}"
        y="${cy+35}"
        class="marker-text"
      >
        GOAL
      </text>

      <g id="horseLayer"></g>

    </svg>
  `;

  document.getElementById(
    "course"
  ).innerHTML=html;

  const pathElement=
    document.getElementById("trackPath");

  svgState={
    type:"oval",
    pathElement,
    length:pathElement.getTotalLength()
  };

  createHorseTokens();

}


/* =========================
   馬アイコン
========================= */

function createHorseTokens(){

  const layer=
    document.getElementById(
      "horseLayer"
    );

  if(!layer) return;

  layer.innerHTML="";

  horses.forEach((horse,index)=>{

    const g=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
      );

    g.setAttribute(
      "class",
      "horse-token"
    );

    g.dataset.index=index;

    const circle=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    circle.setAttribute(
      "r",
      "14"
    );

    circle.setAttribute(
      "class",
      "horse-circle"
    );

    const text=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );

    text.textContent=
      horse.number;

    text.setAttribute(
      "class",
      "horse-number"
    );

    g.appendChild(circle);
    g.appendChild(text);

    g.addEventListener(
      "click",
      ()=>{
        alert(
          horse.number+
          "番 "+horse.name+
          "\n脚質："+horse.style+
          "\n今回："+horse.predictedGroup
        );
      }
    );

    layer.appendChild(g);

  });

  resetAnimation();

}


/* =========================
   隊列位置
========================= */

function groupRank(horse){

  switch(horse.predictedGroup){

    case "逃げ":
      return 0;

    case "逃げ候補":
      return 1;

    case "先行":
      return 2;

    case "中団":
      return 3;

    case "後方":
      return 4;

    default:
      return 3;
  }
}


function getGroupOffset(horse){

  const same=
    horses.filter(
      h=>
        h.predictedGroup===
        horse.predictedGroup
    );

  const index=
    same.indexOf(horse);

  return index-
    (same.length-1)/2;
}


/* =========================
   アニメーション位置
========================= */

function setHorsePosition(
  horse,
  progress
){

  const index=
    horses.indexOf(horse);

  const layer=
    document.getElementById(
      "horseLayer"
    );

  if(!layer) return;

  const token=
    layer.children[index];

  if(!token) return;

  if(svgState.type==="straight"){

    const rank=
      groupRank(horse);

    const offset=
      getGroupOffset(horse);

    const start=
      svgState.startX+
      rank*8;

    const x=
      start+
      (
        svgState.goalX-start
      )*
      progress;

    const y=
      svgState.y+
      offset*22;

    token.setAttribute(
      "transform",
      `translate(${x},${y})`
    );

    return;
  }


  /*
   * 楕円コース
   */

  const path=
    svgState.pathElement;

  const length=
    svgState.length;

  /*
   * START→3C→4C→GOALを
   * コース上で移動
   */

  const base=
    0.0;

  let fraction;

  if(progress<0.65){

    /*
     * スタートから3C
     */

    fraction=
      base+
      progress*
      0.70;

  }else if(progress<0.82){

    /*
     * 3C→4C
     */

    fraction=
      0.455+
      (progress-0.65)*
      1.9;

  }else{

    /*
     * 4C→GOAL
     */

    fraction=
      0.778+
      (progress-0.82)*
      1.23;

  }

  fraction=
    fraction%1;

  const point=
    path.getPointAtLength(
      length*fraction
    );

  /*
   * 隊列による前後差
   */

  const rank=
    groupRank(horse);

  const offset=
    getGroupOffset(horse);

  const spread=
    8+
    rank*2;

  const x=
    point.x+
    offset*spread;

  const y=
    point.y+
    offset*spread*0.6;

  token.setAttribute(
    "transform",
    `translate(${x},${y})`
  );
}


/* =========================
   全馬更新
========================= */

function updateAnimation(progress){

  horses.forEach(
    horse=>
      setHorsePosition(
        horse,
        progress
      )
  );

}


/* =========================
   再生
========================= */

function playAnimation(){

  if(animationRunning) return;

  animationRunning=true;

  const duration=12000;

  const startProgress=
    animationPausedAt;

  animationStart=
    performance.now()-
    startProgress*
    duration/
    animationSpeed;

  function frame(now){

    if(!animationRunning) return;

    let progress=
      (
        now-
        animationStart
      )/
      duration*
      animationSpeed;

    if(progress>=1){

      progress=1;

      updateAnimation(progress);

      animationRunning=false;

      animationPausedAt=1;

      return;
    }

    updateAnimation(progress);

    animationFrame=
      requestAnimationFrame(frame);
  }

  animationFrame=
    requestAnimationFrame(frame);
}


function pauseAnimation(){

  if(!animationRunning) return;

  animationRunning=false;

  cancelAnimationFrame(
    animationFrame
  );
}


function resetAnimation(){

  animationRunning=false;

  animationPausedAt=0;

  cancelAnimationFrame(
    animationFrame
  );

  if(svgState){

    updateAnimation(0);

  }

}


function setSpeed(speed){

  animationSpeed=speed;

}
