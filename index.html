<style>
*{box-sizing:border-box}

body{

<script>

/* =====================================================
   競馬展開ラボ v0.7
===================================================== */

let horses = [];
let raceId = "";
let predictionData = null;

let lineupTimer = null;
let lineupSpeed = 700;


/* =====================================================
   初期化
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

const d = new Date();

const yyyy = d.getFullYear();
const mm = String(d.getMonth()+1).padStart(2,"0");
const dd = String(d.getDate()).padStart(2,"0");

document.getElementById("raceDate").value =
yyyy+"-"+mm+"-"+dd;

document

.forEach(function(btn){

btn.addEventListener(
"click",
function(){

document
.querySelectorAll(".tabBtn")
.forEach(b =>
b.classList.remove("active")

.forEach(t =>
t.classList.remove("active")
);

btn.classList.add("active");

document
.getElementById(btn.dataset.tab)
.classList.add("active");

}
);

});

document
.getElementById("fetchMeetingBtn")
.addEventListener(
"click",
fetchMeeting
);

document
.getElementById("predictBtn")
.addEventListener(
"click",
runPrediction
);

document
.getElementById("startLineupBtn")
.addEventListener(
"click",
startLineup
);

document
.getElementById("stopLineupBtn")
.addEventListener(
"click",
stopLineup
);

document
.getElementById("speedUpBtn")
.addEventListener(
"click",
speedUp
);

document
.getElementById("saveVerifyBtn")
.addEventListener(
"click",
saveVerification
);

renderVerifyHistory();

});


/* =====================================================
   ステータス
===================================================== */

function setStatus(text){

document
.getElementById("status")
.textContent = text;

}


/* =====================================================
   Jina
===================================================== */

async function jinaFetch(url){

const readerUrl =
"https://r.jina.ai/"+url;

const response =
await fetch(readerUrl);

if(!response.ok){

throw new Error(
"Jina HTTP "+response.status
);

}

return await response.text();

}


/* =====================================================
   開催情報
===================================================== */

async function fetchMeeting(){

const date =
document.getElementById("raceDate").value;

if(!date){

alert("日付を選択してください。");
return;

}

const ymd =
date.replace(/-/g,"");

const url =
"https://race.netkeiba.com/top/race_list.html?kaisai_date="+ymd;


setStatus(
"開催情報取得中...\n"+
url
);

try{

const text =
await jinaFetch(url);

const ids = [
...new Set(
[...text.matchAll(/race_id=(\d{12})/g)]
.map(m=>m[1])
)
];

if(!ids.length){

throw new Error(
"race_idが見つかりませんでした"
);

}

renderRaceButtons(ids);

setStatus(
"開催情報取得成功\n"+
"取得レース数: "+ids.length
);

}catch(error){

console.error(error);

setStatus(
"開催情報取得失敗\n"+
error.message
);

alert(
"開催情報の取得に失敗しました。\n"+
error.message
);

}

}


/* =====================================================
   レースボタン
===================================================== */

function renderRaceButtons(ids){

const area =
document.getElementById("raceButtons");

area.innerHTML = "";

ids.sort();

ids.forEach(function(id){

const btn =
document.createElement("button");

const raceNo =
Number(id.slice(-2));

btn.textContent =
raceNo+"R";

btn.addEventListener(
"click",
function(){

selectRace(id,btn);

}
);

area.appendChild(btn);

});

}


/* =====================================================
   レース選択
===================================================== */

async function selectRace(id,button){

raceId = id;

document
.querySelectorAll(".races button")
.forEach(b =>
b.classList.remove("active")
);

button.classList.add("active");

const url =
"https://race.netkeiba.com/race/shutuba.html?race_id="+id;

setStatus(
"出馬表取得中...\n"+
"race_id: "+id
);

try{

const text =
await jinaFetch(url);

if(!text || text.length<1000){

throw new Error(
"取得データが短すぎます"
);

}

horses =
parseRacePage(text);

if(!horses.length){

throw new Error(
"出馬表を解析できませんでした"
);

}

document
.getElementById("horseCount")
.value =
String(horses.length);

renderHorses();

setStatus(
"出馬表取得成功\n"+
"race_id: "+id+"\n"+
"取得頭数: "+horses.length+"\n"+
"馬番: "+
horses.map(h=>h.number).join(",")
);

}catch(error){

console.error(error);

setStatus(
"出馬表取得失敗\n"+
error.message
);

alert(
"出馬表の取得に失敗しました。\n"+
error.message
);

}

}


/* =====================================================
   セルクリーニング
===================================================== */

function clean(value){

return String(value||"")
.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
)
.replace(
/\[([^\]]+)\]\([^)]*\)/g,
"$1"
)
.replace(
/<[^>]+>/g,
""
)
.replace(
/&nbsp;/g,
" "
)
.replace(
/&amp;/g,
"&"
)
.replace(
/&quot;/g,
'"'
)
.replace(
/&#39;/g,
"'"
)
.replace(
/\s+/g,
" "
)
.trim();

}


/* =====================================================
   馬名取得
===================================================== */

function extractHorseName(line){

let m =
line.match(
/db\.netkeiba\.com\/horse\/\d+\s+"([^"]+)"/
);

if(m){

return clean(m[1]);

}


const fallback =
line.match(
/\[([^\]]+)\]\(https?:\/\/db\.netkeiba\.com\/horse\/\d+/
);

if(fallback){

let name =
fallback[1];

name =
name.replace(
/!\[[^\]]*\]\([^)]*\)/g,
""
);

return clean(name);

}

return "";

}


/* =====================================================
   出馬表パーサー
===================================================== */

function parseRacePage(text){

const lines =
text.split(/\r?\n/);

const result = [];
const used = new Set();

for(const line of lines){

if(
!line.includes(
"db.netkeiba.com/horse/"
)
){
continue;
}

const cells =
line
.split("|")
.map(x=>x.trim());

if(cells.length<10){
continue;
}


/*
cells[1] 枠番
cells[2] 馬番
cells[3] 印
cells[4] 馬名
cells[5] 性齢
cells[6] 斤量
cells[7] 騎手
cells[8] 厩舎
cells[9] 馬体重
cells[10] オッズ
cells[11] 人気
*/

const frame =
Number(clean(cells[1]));

const number =
Number(clean(cells[2]));

if(
!Number.isInteger(frame) ||
frame<1 ||
frame>8
){
continue;
}

if(
!Number.isInteger(number) ||
number<1 ||
number>18
){
continue;
}

if(used.has(number)){
continue;
}

const name =
extractHorseName(line);

if(!name){
continue;
}

let odds =
Number(clean(cells[10]));

if(!Number.isFinite(odds)){
odds=0;
}

let popularity =
Number(clean(cells[11]));

if(!Number.isFinite(popularity)){
popularity=0;
}

let jockey =
clean(cells[7]||"");

let trainer =
clean(cells[8]||"");


/*
初期評価。
自動取得できていない項目は50。
*/

result.push({

frame:frame,

number:number,

name:name,

sexAge:clean(cells[5]||""),

weight:clean(cells[6]||""),

jockey:jockey,

trainer:trainer,

odds:odds,

popularity:popularity,

style:"先行",

secondLeg:50,

training:50,

pedigree:50,

position:50,

score:0,

winRate:0,

ev:0,

mark:""

});

used.add(number);

}

result.sort(
(a,b)=>a.number-b.number
);

return result;

}


/* =====================================================
   馬一覧
===================================================== */

function renderHorses(){

const area =
document.getElementById("horseList");

let html = "";

horses.forEach(function(h,index){

html += `

/
${escapeHtml(h.weight)}kg
/
${escapeHtml(h.jockey)}
/
${escapeHtml(h.trainer)}

${
h.popularity
?" / "+h.popularity+"人気"

</div>


<div class="horse-grid">

<div>

脚質
</div>

<select
data-index="${index}"

?"selected":""

h.style==="差し"

}>差し</option>

<option ${
h.style==="追込"

}>追込</option>

</select>

</div>


<div>

</div>

<input

min="0"

value="${h.secondLeg}"

<div>

</div>

data-key="training">

<div>

</div>

<input

area.innerHTML = html;


area
.querySelectorAll("[data-index]")
.forEach(function(el){

el.addEventListener(
"change",
function(){

const index =
Number(el.dataset.index);

const key =
el.dataset.key;

if(key==="style"){

horses[index][key] =
el.value;

}else{

horses[index][key] =
Number(el.value);

/* =====================================================
   ペース計算
===================================================== */

function calcPace(){

const front =
horses.filter(
h =>
h.style==="逃げ" ||
h.style==="先行"
);

const escape =
horses.filter(
h =>
h.style==="逃げ"
);

const frontPower =
front.length
?
front.reduce(
(sum,h)=>sum+h.secondLeg,
0
)/front.length
:0;

const escapePower =
escape.length
?
escape.reduce(
(sum,h)=>sum+h.secondLeg,
0
)/escape.length
:0;

let pressure =
front.length*1.5+
escape.length*2+
Math.max(
0,
(frontPower-50)/10
)+
Math.max(
0,
(escapePower-50)/10
);

if(horses.length>=16){
pressure+=1;
}

let pace="M";
let flow="展開フラット";

if(pressure>=12){

pace="H";
flow="差し・追込有利";

}else if(pressure<=5){

pace="S";
flow="逃げ・先行有利";

}

return {
pace,
flow,
pressure,
frontCount:front.length,
escapeCount:escape.length
};

}


/* =====================================================
   ペース補正
===================================================== */

function paceBonus(h,pace){

let bonus=0;

if(pace==="H"){

if(h.style==="逃げ") bonus-=9;
if(h.style==="先行") bonus-=4;
if(h.style==="差し") bonus+=7;
if(h.style==="追込") bonus+=9;

if(
(h.style==="逃げ"||h.style==="先行") &&
h.secondLeg<45
){
bonus-=4;
}

}

if(pace==="M"){

if(h.style==="逃げ") bonus+=2;
if(h.style==="先行") bonus+=3;
if(h.style==="差し") bonus+=2;
if(h.style==="追込") bonus-=2;

}

if(pace==="S"){

if(h.style==="逃げ") bonus+=10;
if(h.style==="先行") bonus+=7;
if(h.style==="差し") bonus-=5;
if(h.style==="追込") bonus-=10;

if(
(h.style==="逃げ"||h.style==="先行") &&
h.secondLeg>=70
){
bonus+=3;
}

}

return bonus;

}


/* =====================================================
   コース補正
===================================================== */

function courseBonus(h){

const distance =
Number(
document.getElementById("distance").value
);

const surface =
document.getElementById("surface").value;

const going =
document.getElementById("going").value;

const course =
document.getElementById("course").value;

let bonus=0;

if(distance<=1400){

bonus+=
h.secondLeg*0.05+
h.position*0.05;

}else if(distance<=1800){

bonus+=
h.training*0.05+
h.position*0.05;

}else{

bonus+=
h.training*0.05+
h.pedigree*0.05;

}

if(surface==="ダート"){

bonus+=
h.position*0.04+
h.secondLeg*0.04;

}else{

bonus+=
h.training*0.04+
h.pedigree*0.04;

}

if(going==="稍重"){

bonus+=
h.training*0.02+
h.pedigree*0.02;

}

if(
going==="重"||
going==="不良"
){

bonus+=
h.training*0.04+
h.pedigree*0.04;

}

switch(course){

case "東京":
bonus+=h.position*0.03;
break;

case "中山":
bonus+=
h.position*0.03+
h.secondLeg*0.03;
break;

case "京都":
bonus+=h.position*0.03;
break;

case "阪神":
case "中京":
bonus+=h.training*0.03;
break;

case "新潟":
bonus+=h.secondLeg*0.03;
break;

case "小倉":
bonus+=h.position*0.03;
break;

case "福島":
bonus+=
h.position*0.03+
h.secondLeg*0.02;
break;

case "札幌":
case "函館":
bonus+=h.training*0.03;
break;

}

return bonus;

}


/* =====================================================
   人気補正
===================================================== */

function favoriteBonus(h){

const mode =
document.getElementById("favoriteMode").value;

if(h.odds<=0){
return 0;
}

if(h.odds<=3){

if(mode==="caution"){
return -3;
}

if(mode==="value"){
return -5;
}

}

return 0;

}


/* =====================================================
   予想
===================================================== */

function runPrediction(){

if(!horses.length){

alert(
"先にレースを選択してください。"
);

return;

}

const pace =
calcPace();

let total=0;

horses.forEach(function(h){

const base =
h.training*0.30+
h.pedigree*0.25+
h.position*0.25+
h.secondLeg*0.20;

h.score =
base+
paceBonus(h,pace.pace)+
courseBonus(h)+
favoriteBonus(h);

if(h.score<1){
h.score=1;
}

total+=h.score;

});


horses.forEach(function(h){

h.winRate =
h.score/total*100;

h.ev =
h.odds>0
?h.winRate/100*h.odds*100
:0;

});


const ranking =
horses
.slice()
.sort(
(a,b)=>b.score-a.score
);

const marks =
["◎","○","▲","△","☆"];

ranking.forEach(function(h,i){

h.mark =
i<marks.length
?marks[i]
:"";

});


predictionData = {

raceId:raceId,

pace:pace,

createdAt:
new Date().toISOString()

};

renderPrediction(
ranking,
pace
);

renderPace(pace);

renderPedigree();

renderEV();

}

/* =====================================================

===================================================== */

function startLineup(){

stopLineup();

let i=0;

lineupTimer =
setInterval(function(){

const cards =
document.querySelectorAll(
"#lineupArea .horse-card"
);

cards.forEach(
c=>c.style.opacity="0.35"
);

if(cards[i]){
cards[i].style.opacity="1";
}

i++;

if(i>=cards.length){
i=0;
}

},lineupSpeed);

}


function stopLineup(){

if(lineupTimer){

clearInterval(
lineupTimer
);

lineupTimer=null;

}

}


function speedUp(){

if(lineupSpeed>200){

lineupSpeed-=100;

}

}

/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
