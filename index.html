<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬展開ラボ v0.5</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  color: #1f2937;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px;
}

.header {
  background: #111827;
  color: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 22px;
}

.badge {
  display: inline-block;
  background: #2563eb;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-size: 12px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  min-height: 44px;
  border-radius: 9px;
  border: 1px solid #d1d5db;
  background: white;
  padding: 10px;
  font-size: 15px;
}

button {
  margin-top: 12px;
  background: #2563eb;
  color: white;
  border: none;
  font-weight: bold;
}

button:disabled {
  opacity: .45;
}

.status {
  padding: 12px;
  border-radius: 9px;
  background: #eef2ff;
  white-space: pre-wrap;
  font-size: 13px;
}

.status.ok {
  background: #ecfdf5;
  color: #065f46;
}

.status.error {
  background: #fef2f2;
  color: #991b1b;
}

.small {
  font-size: 11px;
  color: #6b7280;
  line-height: 1.6;
}

.result-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.horse {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}

.horse-name {
  font-weight: bold;
}

.horse-data {
  margin-top: 4px;
  font-size: 12px;
  color: #4b5563;
  line-height: 1.5;
}

.raw {
  margin-top: 12px;
  background: #111827;
  color: #e5e7eb;
  padding: 10px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 11px;
  max-height: 300px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .header h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>
      競馬展開ラボ
      <span class="badge">v0.5 NETKEIBA TEST</span>
    </h1>
    <div style="font-size:12px;color:#cbd5e1;">
      netkeiba出馬表の取得テスト版
    </div>
  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label>日付</label>
        <input id="raceDate" type="date">
      </div>

      <div>
        <label>開催</label>
        <select id="venue">
          <option value="">開催を取得してください</option>
        </select>
      </div>

    </div>

    <button id="getVenues">
      ① 開催を取得
    </button>

    <div class="grid" style="margin-top:10px;">

      <div>
        <label>レース</label>
        <select id="raceSelect" disabled>
          <option value="">開催を選択してください</option>
        </select>
      </div>

      <div>
        <label>取得方法</label>
        <select id="fetchMode">
          <option value="proxy">プロキシ経由</option>
          <option value="direct">直接アクセス</option>
        </select>
      </div>

    </div>

    <button id="getRace" disabled>
      ② 出馬表を取得
    </button>

  </div>

  <div id="status" class="card status">
    待機中
  </div>

  <div id="result" class="card" style="display:none;">
  </div>

  <div class="card small">

    <b>v0.5について</b><br><br>

    今回は「netkeibaからブラウザ経由でデータを取得できるか」の確認版です。<br>
    まず取得成功を確認し、その後のバージョンで取得データを予想エンジンへ接続します。<br><br>

    ※netkeiba側のアクセス制限やブラウザのCORS制限によって取得できない場合があります。
    その場合は取得方式を変更します。

  </div>

</div>

<script>

const $ = id => document.getElementById(id);

const raceDate = $("raceDate");
const venue = $("venue");
const raceSelect = $("raceSelect");
const fetchMode = $("fetchMode");
const getVenues = $("getVenues");
const getRace = $("getRace");
const status = $("status");
const result = $("result");


// 今日の日付
const today = new Date();

raceDate.value =
  today.getFullYear() +
  "-" +
  String(today.getMonth() + 1).padStart(2, "0") +
  "-" +
  String(today.getDate()).padStart(2, "0");


// ------------------------------
// 共通
// ------------------------------

function setStatus(text, type = "") {

  status.textContent = text;

  status.className = "card status";

  if (type) {
    status.classList.add(type);
  }
}


function cleanText(text) {

  return (text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ------------------------------
// URL
// ------------------------------

function netkeibaDayURL(dateString) {

  const d = dateString.replace(/-/g, "");

  return "https://race.netkeiba.com/top/race_list.html?kaisai_date=" + d;

}


function netkeibaRaceURL(raceId) {

  return "https://race.netkeiba.com/race/shutuba.html?race_id=" + raceId;

}


function proxyURL(url) {

  return "https://api.allorigins.win/raw?url=" +
    encodeURIComponent(url);

}


// ------------------------------
// HTML取得
// ------------------------------

async function fetchHTML(url) {

  let targetURL = url;

  if (fetchMode.value === "proxy") {

    targetURL = proxyURL(url);

  }

  const response = await fetch(targetURL, {
    method: "GET",
    cache: "no-store"
  });

  if (!response.ok) {

    throw new Error(
      "HTTPエラー: " + response.status
    );

  }

  return await response.text();

}


function parseHTML(html) {

  return new DOMParser()
    .parseFromString(html, "text/html");

}


// ------------------------------
// race_id抽出
// ------------------------------

function extractRaceId(href) {

  if (!href) {
    return null;
  }

  const match =
    href.match(/[?&]race_id=(\d{12})/);

  if (!match) {
    return null;
  }

  return match[1];

}


// ------------------------------
// 開催一覧解析
// ------------------------------

function parseVenues(document) {

  const venueMap = {};

  const links =
    [...document.querySelectorAll("a[href*='race_id=']")];

  links.forEach(link => {

    const href =
      link.getAttribute("href") || "";

    const raceId =
      extractRaceId(href);

    if (!raceId) {
      return;
    }

    const parent =
      link.closest("tr");

    const text =
      cleanText(
        parent
          ? parent.innerText
          : link.innerText
      );

    const venueMatch =
      text.match(
        /(札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉)/
      );

    const raceMatch =
      text.match(/(\d{1,2})R/);

    const venueName =
      venueMatch
        ? venueMatch[1]
        : "開催";

    const raceNumber =
      raceMatch
        ? raceMatch[1]
        : "";

    if (!venueMap[venueName]) {
      venueMap[venueName] = [];
    }

    const exists =
      venueMap[venueName]
        .some(x => x.id === raceId);

    if (!exists) {

      venueMap[venueName].push({

        id: raceId,

        number: raceNumber,

        text: text

      });

    }

  });

  return venueMap;

}


// ------------------------------
// ① 開催取得
// ------------------------------

async function loadVenues() {

  const date = raceDate.value;

  if (!date) {

    setStatus(
      "日付を選択してください。",
      "error"
    );

    return;

  }

  venue.innerHTML =
    "<option>取得中...</option>";

  raceSelect.innerHTML =
    "<option>開催を選択してください</option>";

  raceSelect.disabled = true;

  getRace.disabled = true;

  setStatus(
    "netkeibaから開催情報を取得しています..."
  );

  try {

    const url =
      netkeibaDayURL(date);

    const html =
      await fetchHTML(url);

    const document =
      parseHTML(html);

    const venues =
      parseVenues(document);

    const names =
      Object.keys(venues);

    if (!names.length) {

      throw new Error(
        "開催情報を認識できませんでした。"
      );

    }

    venue.innerHTML =
      '<option value="">開催を選択</option>';

    names.forEach(name => {

      const option =
        document.createElement("option");

      option.value = name;

      option.textContent =
        name +
        " (" +
        venues[name].length +
        "レース候補)";

      option.dataset.races =
        JSON.stringify(
          venues[name]
        );

      venue.appendChild(option);

    });

    setStatus(
      "開催情報の取得に成功しました。\n" +
      "開催を選択してください。",
      "ok"
    );

  } catch (error) {

    setStatus(
      "開催情報の取得に失敗しました。\n\n" +
      error.message +
      "\n\n" +
      "「直接アクセス」に変更してもう一度試すこともできます。",
      "error"
    );

    venue.innerHTML =
      '<option value="">取得失敗</option>';

  }

}


// ------------------------------
// 開催変更
// ------------------------------

venue.addEventListener(
  "change",
  function() {

    raceSelect.innerHTML =
      '<option value="">レースを選択</option>';

    raceSelect.disabled = true;

    getRace.disabled = true;

    const option =
      venue.options[
        venue.selectedIndex
      ];

    if (!option.dataset.races) {
      return;
    }

    let races;

    try {

      races =
        JSON.parse(
          option.dataset.races
        );

    } catch {

      return;

    }

    races.sort(
      (a, b) =>
        Number(a.number || 99) -
        Number(b.number || 99)
    );

    races.forEach(race => {

      const option =
        document.createElement("option");

      option.value =
        race.id;

      option.textContent =
        (race.number
          ? race.number + "R"
          : "レース") +
        "  " +
        race.text.slice(0, 80);

      raceSelect.appendChild(option);

    });

    raceSelect.disabled = false;

  }
);


// ------------------------------
// レース変更
// ------------------------------

raceSelect.addEventListener(
  "change",
  function() {

    getRace.disabled =
      !raceSelect.value;

  }
);


// ------------------------------
// 馬名抽出
// ------------------------------

function extractHorses(document) {

  const horses = [];

  const links =
    [...document.querySelectorAll(
      "a[href*='/horse/']"
    )];

  links.forEach(link => {

    const name =
      cleanText(link.innerText);

    if (!name) {
      return;
    }

    const row =
      link.closest("tr");

    const rowText =
      cleanText(
        row
          ? row.innerText
          : ""
      );

    const exists =
      horses.some(
        h => h.name === name
      );

    if (!exists) {

      horses.push({

        name: name,

        row: rowText

      });

    }

  });

  return horses;

}


// ------------------------------
// ② 出馬表取得
// ------------------------------

async function loadRace() {

  const raceId =
    raceSelect.value;

  if (!raceId) {

    return;

  }

  result.style.display =
    "none";

  setStatus(
    "netkeibaから出馬表を取得しています..."
  );

  try {

    const url =
      netkeibaRaceURL(raceId);

    const html =
      await fetchHTML(url);

    const document =
      parseHTML(html);

    const horses =
      extractHorses(document);

    const title =
      cleanText(document.title);

    if (!horses.length) {

      throw new Error(
        "ページは取得できましたが、馬名を認識できませんでした。"
      );

    }

    let output = "";

    output +=
      '<div class="result-title">' +
      "取得成功" +
      "</div>";

    output +=
      "<p>" +
      "<b>race_id：</b>" +
      raceId +
      "</p>";

    output +=
      "<p>" +
      "<b>ページ：</b>" +
      title +
      "</p>";

    output +=
      "<p>" +
      "<b>認識した馬：</b>" +
      horses.length +
      "頭" +
      "</p>";

    output +=
      "<hr>";

    horses.forEach(
      (horse, index) => {

        output +=
          '<div class="horse">';

        output +=
          '<div class="horse-name">' +
          (index + 1) +
          ". " +
          horse.name +
          "</div>";

        output +=
          '<div class="horse-data">' +
          horse.row +
          "</div>";

        output +=
          "</div>";

      }
    );

    output +=
      '<details style="margin-top:15px;">' +
      "<summary>取得URL</summary>" +
      '<div class="raw">' +
      url +
      "</div>" +
      "</details>";

    result.innerHTML =
      output;

    result.style.display =
      "block";

    setStatus(
      "出馬表の取得に成功しました！\n" +
      horses.length +
      "頭の馬名を認識しました。",
      "ok"
    );

  } catch (error) {

    result.innerHTML =
      "<div class='result-title'>" +
      "取得テスト失敗" +
      "</div>" +
      "<p>" +
      cleanText(error.message) +
      "</p>";

    result.style.display =
      "block";

    setStatus(
      "出馬表の取得に失敗しました。\n\n" +
      error.message +
      "\n\n" +
      "この結果も重要です。v0.5では、まずどこまで取得できるかを確認します。",
      "error"
    );

  }

}


// ------------------------------
// ボタン
// ------------------------------

getVenues.addEventListener(
  "click",
  loadVenues
);

getRace.addEventListener(
  "click",
  loadRace
);

</script>

</body>
</html>
